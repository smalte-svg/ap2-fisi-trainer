, verschiedene Subnetze/VLANs). Er arbeitet mit IP-Adressen, wählt per Routing-Tabelle den besten Weg und trennt Broadcastdomänen.","nr":203,"cat":6},{"id":194,"question":"Wofür wird das Network File System (NFS) verwendet?","answer":"NFS ist ein Protokoll für den Zugriff auf Dateien über ein Netzwerk, das hauptsächlich in Unix- und Linux-Umgebungen eingesetzt wird. Es ermöglicht den transparenten Zugriff auf entfernte Dateisysteme: Freigaben eines Servers werden auf dem Client in das lokale Dateisystem eingehängt (gemountet) und können wie lokale Verzeichnisse genutzt werden.\nZweck: gemeinsame Nutzung von Dateien und Daten zwischen verschiedenen Betriebssystemen und Rechnern, zentrale Datenhaltung (z. B. Home-Verzeichnisse auf einem Server, Speicher für Virtualisierung).\nNFS basiert auf dem Client-Server-Modell; Pendant in der Windows-Welt: SMB.","nr":204,"cat":7},{"id":195,"question":"Was ist die Aufgabe des SMB-Protokolls?","answer":"SMB (Server Message Block) ist ein Netzwerkprotokoll, das ursprünglich von IBM/Microsoft entwickelt wurde und hauptsächlich in Windows-Umgebungen verwendet wird.\nEs ermöglicht die gemeinsame Nutzung von Dateien, Druckern und anderen Ressourcen in einem Netzwerk (Datei- und Druckerfreigaben, z. B. \\\\server\\freigabe).\nSMB unterstützt Funktionen wie Authentifizierung, Datei- und Sperrmechanismen (Locking), Verschlüsselung (ab SMB 3) und den Zugriff auf Netzwerkfreigaben. Es ist das Standardprotokoll für die Dateifreigabe in Windows-Netzwerken; unter Linux nutzbar mit Samba.\nPort: TCP 445. Veraltetes SMBv1 ist unsicher (WannaCry) und sollte deaktiviert werden.","nr":205,"cat":7},{"id":196,"question":"Erläutern Sie die Aufgabe eines Hypervisors / Virtual Machine Monitor (VMM).","answer":"Die Hauptaufgabe eines Hypervisors besteht darin, virtuelle Maschinen (VMs) auf einem physischen Computer zu erstellen und auszuführen, wodurch mehrere unabhängige Betriebssysteme und Anwendungen auf einem einzigen physischen Server laufen können.\nDer Hypervisor erstellt eine Abstraktionsschicht zwischen der physischen Hardware und den virtuellen Maschinen:\n• Er verteilt Ressourcen wie Prozessoren, Arbeitsspeicher, Festplatten und Netzwerkschnittstellen zwischen den VMs.\n• Er isoliert die VMs voneinander (Absturz einer VM betrifft andere nicht).\n• Er verwaltet Start, Stopp, Snapshots und Migration der VMs.\nVorteil: bessere Auslastung der Hardware-Ressourcen und effizientere Nutzung der vorhandenen Ressourcen.","nr":206,"cat":7},{"id":197,"question":"Erläutern Sie den Unterschied zwischen einem Hypervisor Typ 1 und einem Hypervisor Typ 2.","answer":"• Hypervisor Typ 1 (Bare-Metal-Hypervisor): wird direkt auf der physischen Hardware eines Computers installiert. Er läuft direkt auf der Hardware, ohne dass ein separates Betriebssystem erforderlich ist. Dies ermöglicht eine direkte Verwaltung der Hardware-Ressourcen und eine bessere Leistung, Sicherheit und Stabilität. Einsatz im Rechenzentrum. Beispiele: VMware ESXi, Microsoft Hyper-V, Proxmox VE/KVM, Xen.\n• Hypervisor Typ 2 (Hosted-Hypervisor): wird als Anwendung auf einem bereits installierten Host-Betriebssystem ausgeführt. Das bedeutet, dass zuerst ein vollständiges Betriebssystem auf der physischen Hardware installiert sein muss. Mehr Overhead, geringere Leistung; einfach für Tests und Desktops. Beispiele: VirtualBox, VMware Workstation.","nr":207,"cat":7},{"id":198,"question":"Wie kann ein bestehender physischer Server mit Betriebssystem in eine virtuelle Maschine konvertiert werden?","answer":"Um einen bestehenden physischen Server in eine VM zu übertragen, gibt es verschiedene Möglichkeiten (P2V – Physical to Virtual):\n• Neuinstallation und Konfiguration des Betriebssystems und der Anwendungen in einer neuen VM, anschließend Datenübernahme\n• Wiederherstellung der Image-Sicherung eines bestehenden Systems in einer neuen virtuellen Maschine\n• Konvertierung eines physischen Servers in eine virtuelle Maschine mittels spezieller Konvertierungstools (z. B. VMware vCenter Converter, Disk2vhd, Veeam), die das laufende System inkl. Daten in eine VM-Festplatte überführen\nNach der Konvertierung: Treiber anpassen (VM-Tools), Hardware-spezifische Software entfernen, Netzwerk prüfen.","nr":208,"cat":7},{"id":199,"question":"Was ist unter dem Funktionsprinzip der Containerisierung zu verstehen?","answer":"Containerisierung ist eine Form der Virtualisierung auf Betriebssystemebene. Anwendungen werden mitsamt aller notwendigen Abhängigkeiten (Bibliotheken, Konfiguration, Laufzeitumgebung) in isolierte Container verpackt, die auf demselben Host-Betriebssystem laufen und dessen Kernel gemeinsam nutzen – ohne eigenes Gast-Betriebssystem.\nVorteile:\n• Portabilität: Container laufen auf jedem unterstützten System gleich („läuft überall“)\n• Isolation: Jeder Container ist von anderen und vom Host-System getrennt\n• Effizienz: leichtgewichtig, starten in Sekunden, benötigen weniger Ressourcen als VMs\n• Skalierbarkeit: einfaches Hinzufügen weiterer Instanzen und Verwaltung über Orchestrierung\nBeispiele: Docker, Podman; Orchestrierung mit Kubernetes.","nr":209,"cat":7},{"id":200,"question":"Beschreiben Sie die Methoden der horizontalen und der vertikalen Skalierung von IT-Infrastruktur.","answer":"• Horizontale Skalierung (Scale-out): bezieht sich auf die Erweiterung eines Systems, indem zusätzliche Ressourcen hinzugefügt werden – also weitere Server, Computer oder Knoten. Die Last wird auf mehrere Systeme verteilt (z. B. per Load Balancer). Vorteile: nahezu unbegrenzt erweiterbar, höhere Ausfallsicherheit; Nachteil: Anwendung muss verteilbar sein, mehr Verwaltungsaufwand.\n• Vertikale Skalierung (Scale-up): bezieht sich auf die Verbesserung der Leistung eines einzelnen Systems, indem die vorhandenen Ressourcen verbessert oder aufgerüstet werden – z. B. mehr CPU-Kerne, RAM oder schnellerer Speicher. Einfach umzusetzen, aber begrenzt durch die Hardware; das System bleibt ein Single Point of Failure.","nr":210,"cat":7},{"id":201,"question":"Erklären Sie die Unterschiede zwischen den Speichersystemen DAS und NAS.","answer":"• DAS (Direct Attached Storage): ein Speichersystem, das direkt an einen Computer oder Server angeschlossen ist (z. B. per SATA, SAS, USB). Es ist nur über diesen Rechner zugänglich. Vorteile: einfach, günstig, sehr schnelle Datenübertragungsrate. Nachteil: nicht direkt im Netzwerk teilbar, schlecht skalierbar.\n• NAS (Network Attached Storage): ein eigenständiges Speichergerät, das mit dem Netzwerk verbunden ist und Speicher dateibasiert über Netzwerkprotokolle (SMB, NFS) bereitstellt. Mehrere Benutzer und Geräte können gleichzeitig darauf zugreifen. Hat eine eigene IP-Adresse und meist eigene Funktionen (RAID, Benutzerverwaltung, Backup). Geringere Geschwindigkeit als DAS, abhängig vom Netzwerk.","nr":211,"cat":7},{"id":202,"question":"Beschreiben Sie die Vorteile, die der Einsatz eines SAN (Storage Area Network) gegenüber einem NAS bietet.","answer":"Ein SAN ist ein eigenes, dediziertes Hochgeschwindigkeitsnetzwerk von Speichergeräten, die den Servern als lokale Laufwerke (blockbasiert) zur Verfügung gestellt werden. Gegenüber einem NAS bietet es:\n• höhere Leistung und geringere Latenz (Fibre Channel, iSCSI; eigenes Netz, belastet das LAN nicht)\n• blockbasierten Zugriff – geeignet für Datenbanken und Virtualisierung\n• bessere Skalierbarkeit: Kapazität kann flexibel erweitert und zentral verwaltet werden\n• hohe Verfügbarkeit und Fehlertoleranz durch redundante Pfade, Snapshots, Replikation\n• die Daten-Volumes können online erweitert werden\nNachteil: deutlich teurer und komplexer.","nr":212,"cat":7},{"id":203,"question":"Erläutern Sie den Unterschied zwischen blockorientierten und dateiorientierten Speichertechniken.","answer":"• Blockorientierte Speicherung: Daten werden in festgelegten Blockgrößen gespeichert und direkt vom Speichermedium gelesen bzw. geschrieben. Der Server sieht den Speicher wie eine lokale Festplatte und legt selbst ein Dateisystem darauf an. Hohe Performance, ideal für Datenbanken und VMs. Diese Methode ist typisch für SAN (Storage Area Network) und DAS.\n• Dateiorientierte Speicherung: arbeitet auf Datei-Ebene. Sie lesen und schreiben ganze Dateien anstelle von Blöcken; das Dateisystem wird vom Speichersystem verwaltet und über Protokolle wie SMB oder NFS freigegeben. Einfach gemeinsam nutzbar. Diese Methode wird bei NAS (Network Attached Storage) verwendet.","nr":213,"cat":7},{"id":204,"question":"Was bedeutet der Begriff „Clustergröße“ im Kontext von Laufwerken und welchen Einfluss hat die Wahl der Clustergröße auf die Speicherleistung?","answer":"Die Clustergröße (Zuordnungseinheit) bezeichnet die kleinste Menge an Speicherplatz, die ein Dateisystem einer Datei zuordnen kann. Jede Datei belegt mindestens einen ganzen Cluster, unabhängig von ihrer tatsächlichen Größe (z. B. NTFS-Standard 4 KB).\n• Kleine Clustergröße: Speicherplatz wird effizienter genutzt, da weniger verschwendet wird (geringer Verschnitt bei vielen kleinen Dateien). Nachteil: Große Dateien bestehen aus sehr vielen Clustern → mehr Verwaltungsaufwand, stärkere Fragmentierung, langsamer.\n• Große Clustergröße: schneller beim Lesen und Schreiben großer Dateien (weniger Cluster zu verwalten), aber mehr Speicherplatz wird bei kleinen Dateien verschwendet.\nWahl je nach Einsatz: viele kleine Dateien → klein; Video/Backups → groß.","nr":214,"cat":7},{"id":205,"question":"Was ist Deduplizierung in der Datenverarbeitung und wie wirkt sie sich auf Speichereffizienz und Performance aus?","answer":"Deduplizierung ist ein Verfahren in der Datenverwaltung, bei dem redundante (doppelte) Datenkopien eliminiert werden, um den Speicherbedarf zu reduzieren. Identische Daten bzw. Datenblöcke werden nur einmal physisch gespeichert; weitere Vorkommen werden durch Verweise (Pointer) auf diese einzige Kopie ersetzt. Erkennung über Hashwerte.\n• Speichereffizienz: deutlich weniger Speicherbedarf – besonders bei Backups und VMs mit vielen gleichen Daten.\n• Performance: Weniger Daten müssen übertragen und geschrieben werden (z. B. schnellere Backups über WAN). Allerdings kostet das Berechnen der Hashwerte und das Zusammensetzen der Daten beim Lesen Rechenleistung, was die Performance auch verschlechtern kann.\nHäufig in Speichersystemen und Datensicherung eingesetzt.","nr":215,"cat":7},{"id":206,"question":"Was versteht man unter Datenkomprimierung und welche Auswirkungen hat sie auf den Speicherbedarf und die Datenübertragung?","answer":"Datenkomprimierung ist der Prozess der Reduzierung der Größe von Daten, indem redundante oder unwichtige Informationen effizienter kodiert bzw. entfernt werden.\n• verlustfrei: Originaldaten können vollständig wiederhergestellt werden (ZIP, PNG)\n• verlustbehaftet: einige Daten gehen verloren, dafür höhere Kompressionsrate (JPEG, MP3)\nAuswirkungen:\n• Speicherbedarf: sinkt, da komprimierte Daten weniger Speicherplatz benötigen.\n• Datenübertragung: Weniger Daten müssen übertragen werden → kürzere Übertragungszeiten, geringere Bandbreitennutzung.\n• Nachteil: Komprimieren und Dekomprimieren benötigt Rechenleistung (CPU-Last, Zeit).","nr":216,"cat":7},{"id":207,"question":"Es soll eine Vielzahl von Bildern gespeichert werden. Wie wird die Dateigröße eines Bildes in Byte berechnet?","answer":"Die Dateigröße eines unkomprimierten Bildes berechnet sich so:\nDateigröße (Byte) = Breite (Pixel) × Höhe (Pixel) × Farbtiefe (Byte)\nDie Farbtiefe wird oft in Bit angegeben → durch 8 teilen (24 Bit = 3 Byte, 32 Bit = 4 Byte).\nBeispiel: 1920 × 1080 Pixel mit 24 Bit Farbtiefe:\n1920 × 1080 × 3 Byte = 6.220.800 Byte ≈ 6,22 MB (≈ 5,93 MiB)\nFür viele Bilder: Ergebnis × Anzahl der Bilder. Achtung bei der Umrechnung: 1 KB = 1000 Byte, 1 KiB = 1024 Byte.","nr":217,"cat":7},{"id":208,"question":"Beschreiben Sie kurz die Lizenzmodelle kommerzielle Lizenz, Open Source und Freeware.","answer":"• Kommerzielle Lizenzen: erfordern in der Regel eine Zahlung oder den Erwerb einer Lizenz, um die Software nutzen zu können. Die Bedingungen und Einschränkungen variieren je nach Lizenzvereinbarung des Anbieters (z. B. Anzahl Nutzer/Geräte, Kauf oder Abo). Quellcode ist meist nicht zugänglich (proprietär).\n• Open-Source-Lizenzen: ermöglichen die Einsichtnahme, Nutzung, Weitergabe und Modifizierung des Quellcodes einer Software durch die Öffentlichkeit. Open-Source-Software steht in der Regel kostenlos zur Verfügung; die Lizenzbedingungen (z. B. GPL, MIT, Apache) regeln, wie der Quellcode weiterverbreitet und modifiziert werden kann.\n• Freeware: bezeichnet Software, die kostenlos genutzt werden kann, jedoch dennoch urheberrechtlich geschützt ist. Der Quellcode ist nicht offen; Veränderung meist nicht erlaubt, kommerzielle Nutzung teils eingeschränkt.","nr":218,"cat":7},{"id":209,"question":"Was besagt die GNU General Public License?","answer":"Die GNU General Public License (GPL) ist eine weit verbreitete Open-Source-Lizenz, die von der Free Software Foundation (FSF) entwickelt wurde.\nDie GPL erlaubt die freie Nutzung, Verteilung und Modifizierung der Software – auch kommerziell.\nSie erfordert jedoch, dass alle abgeleiteten Werke unter derselben Lizenz veröffentlicht werden („Copyleft“): Wer GPL-Software verändert und weitergibt, muss den Quellcode seiner veränderten Version ebenfalls offenlegen und unter der GPL weitergeben.\nDies stellt sicher, dass der Quellcode von abgeleiteten Versionen ebenfalls offen zugänglich bleibt. Beispiel: Linux-Kernel (GPLv2).","nr":219,"cat":7},{"id":210,"question":"Wie unterscheiden sich die beiden Lizenztypen User CAL und Device CAL?","answer":"CAL = Client Access License: Zugriffslizenz, die zum Zugriff auf Serverdienste (z. B. Windows Server, Exchange) berechtigt.\n• User CAL: Lizenz für einen Benutzer, der von beliebigen Geräten aus auf ein System zugreifen darf. Dieser Lizenztyp ist vorteilhaft, wenn Nutzer oft mehrere verschiedene Geräte verwenden (PC, Laptop, Smartphone, Homeoffice).\n• Device CAL: Lizenz für ein Gerät, auf dem beliebig viele Benutzer ein System nutzen können. Dieser Lizenztyp ist vorteilhaft, wenn mehrere Nutzer ein gemeinsames Gerät benutzen (z. B. Schichtbetrieb, Kassen, Schulungsrechner).\nWahl: Rechnen, was günstiger ist – Anzahl Benutzer vs. Anzahl Geräte.","nr":220,"cat":7},{"id":211,"question":"Erklären Sie den Unterschied zwischen Individualsoftware und Standardsoftware.","answer":"• Individualsoftware: wird nach den spezifischen Anforderungen des Auftraggebers entwickelt. Dies bedeutet, dass die Software genau auf die Geschäftsprozesse und Anforderungen abgestimmt ist und höchste Effizienz und Produktivität ermöglicht. Nachteile: hohe Kosten, lange Entwicklungszeit, Abhängigkeit vom Entwickler bei Wartung.\n• Standardsoftware: eine vorgefertigte Softwarelösung, die für einen breiten Markt von Benutzern entwickelt wurde, mit Funktionen, die für viele verschiedene Unternehmen und Anwender geeignet sind (z. B. MS Office, SAP). Vorteile: niedrigere Kosten und sofortige Verfügbarkeit; wird oft von großen Softwareunternehmen entwickelt, die regelmäßige Updates und Kundensupport bieten. Nachteil: Prozesse müssen ggf. an die Software angepasst werden.","nr":221,"cat":7},{"id":212,"question":"Erläutern Sie den Begriff Service Level Agreement (SLA).","answer":"Ein Service Level Agreement (SLA) ist eine schriftliche Vereinbarung zwischen einem Dienstleister und einem Kunden, die die vereinbarten Leistungsparameter und -ziele für eine bestimmte Dienstleistung oder ein Produkt festlegt.\nEin SLA definiert die Erwartungen hinsichtlich z. B.:\n• Qualität und Umfang des Services\n• Verfügbarkeit (z. B. 99,9 % pro Jahr)\n• Reaktions- und Lösungszeiten bei Störungen\n• Supportzeiten und Ansprechpartner\n• Vertragsstrafen bei Nichteinhaltung\nEs dient als Grundlage für die Bewertung der Servicequalität.","nr":222,"cat":7},{"id":213,"question":"Was sind die Aufgaben des First-Level-Supports?","answer":"Der First-Level-Support ist der erste Kontakt für Kunden bei Supportanfragen (Service Desk/Helpdesk). Die Aufgaben des 1st-Level-Supports umfassen:\n• Entgegennahme von Supportanfragen (Telefon, E-Mail, Ticketsystem)\n• Klassifizierung und Priorisierung von Supportanfragen\n• grundlegende Unterstützung, um häufig auftretende Probleme zu lösen (z. B. Passwort zurücksetzen, Standardfehler)\n• Weiterleitung von Anfragen, wenn das Problem über den Bereich des 1st-Level-Supports hinausgeht\n• Dokumentation der Supportanfragen in einem Ticketsystem oder einer Wissensdatenbank\n• professionelle und freundliche Kommunikation mit den Kunden","nr":223,"cat":7},{"id":214,"question":"Erklären Sie den Unterschied zwischen dem 2nd-Level- und 3rd-Level-Support.","answer":"• Second-Level-Support: die erste Eskalationsstufe, wenn eine Anfrage nicht vom First-Level-Support gelöst werden kann. Er besteht aus erfahrenen Technikern oder Spezialisten, die komplexe Anfragen bearbeiten, Fehlerdiagnosen durchführen und spezifische Lösungen bereitstellen (tieferes technisches Wissen, Zugriff auf Systeme).\n• Third-Level-Support: die höchste Eskalationsstufe im Supportprozess. Er umfasst hochspezialisierte Fachleute (oft Entwickler oder Hersteller), die über umfangreiches technisches Wissen und Expertise verfügen. Sie sind in der Lage, komplexe Probleme zu analysieren und umfassende Fehlerbehebung durchzuführen (z. B. Bugfixes im Code), die über die Möglichkeiten des Second-Level-Supports hinausgehen.","nr":224,"cat":7},{"id":215,"question":"Welchem Zweck dienen Standard Operating Procedures (SOP)?","answer":"Standard Operating Procedures (SOP) sind schriftliche Anweisungen oder Leitfäden, die die spezifischen Schritte und Verfahren beschreiben, die in einer Organisation oder einem Unternehmen bei bestimmten Aufgaben oder Prozessen befolgt werden sollen (z. B. Benutzeranlage, Backup-Prüfung, Notfallablauf).\nSie dienen dazu:\n• eine klare Struktur, Einheitlichkeit und Effizienz in organisatorischen Abläufen zu gewährleisten\n• die Qualität zu kontrollieren und die Einhaltung von Standards sicherzustellen\n• Fehler zu reduzieren und Wissen zu dokumentieren\n• neue Mitarbeitende schneller einzuarbeiten","nr":225,"cat":7},{"id":216,"question":"Beschreiben Sie, was unter dem ITIL-Framework zu verstehen ist.","answer":"ITIL (Information Technology Infrastructure Library) ist ein Framework für das IT-Service-Management (ITSM), das bewährte Praktiken (Best Practices) und Standards für die effektive Bereitstellung und Verwaltung von IT-Services bietet.\nEs wurde entwickelt, um die Qualität von IT-Services zu verbessern, die Kundenzufriedenheit zu steigern und die Effizienz der IT-Organisationen zu maximieren.\nITIL besteht aus einer Sammlung von Best Practices, die in verschiedene Prozesse und Funktionen unterteilt sind – z. B. Incident Management, Problem Management, Change Management, Service Desk, Service Level Management.\nEs wird weltweit von Organisationen verschiedener Größen und Branchen eingesetzt und ist zu einem Industriestandard für das IT-Service-Management geworden (aktuelle Version: ITIL 4).","nr":226,"cat":7}];
const CAT={1:'Datenschutz',2:'IT-Sicherheit',3:'Projekt & Qualität',4:'DB & Programmierung',5:'Netzsicherheit',6:'Netzwerktechnik',7:'Infrastruktur & Betrieb'};
const CATLONG={1:'Datenschutz & Compliance',2:'IT- & Systemsicherheit',3:'Projektmanagement, Softwareentwicklung & Qualität',4:'Datenbanken, Programmierung & moderne IT-Konzepte',5:'Netzwerksicherheit & Zugriffskontrolle',6:'Netzwerktechnik: Adressierung, Topologien, Protokolle & VPN',7:'IT-Infrastruktur, Storage & Betrieb'};
const CCOL={1:'#89b4ff',2:'#ff8fa3',3:'#ffcf5c',4:'#c49bff',5:'#ff9f5a',6:'#5fe0c1',7:'#7fd4ff'};
const BYID={};CARDS.forEach(c=>BYID[c.id]=c);
const KEY='ap2_fisi_216_progress_v1',MKEY='ap2_fisi_meta_v1';
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:d}catch(e){return d}}
let state=load(KEY,{});
let meta=Object.assign({xp:0,days:{},goal:20,marks:[],blitzBest:0,onb:false,vib:true,badges:[],filter:'all'},load(MKEY,{}));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(MKEY,JSON.stringify(meta))}catch(e){toast('Speichern nicht möglich')}}
const $=s=>document.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function day(){return Math.floor(Date.now()/86400000)}
function dkey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayCount(){return meta.days[dkey()]||0}
function streak(){let n=0,d=new Date();if(!meta.days[dkey(d)])d.setDate(d.getDate()-1);while(meta.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function level(){return Math.floor(Math.sqrt(meta.xp/40))+1}
function lvlRange(){const l=level();return [40*(l-1)**2,40*l**2]}
const LVLNAMES=['Praktikant','Azubi','Azubi 2. Lj.','Azubi 3. Lj.','Junior-Admin','Admin','Senior-Admin','Netzwerk-Profi','IT-Architekt','Prüfungs-Boss'];
function lvlName(){return LVLNAMES[Math.min(level()-1,LVLNAMES.length-1)]}
function isDue(c){const s=state[c.id];return !s||(s.due||0)<=day()}
function label(c){return c.nr?'Nr. '+c.nr:'nur 3. Aufl.'}
function vib(p){if(meta.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function sizeCls(t){return t.length>700?'xs':t.length>480?'s':''}
function excerpt(c,n=170){let t=c.answer.replace(/\n•\s*/g,' · ').replace(/\n/g,' ');return t.length>n?t.slice(0,n).replace(/\s+\S*$/,'')+' …':t}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Filter ---------- */
const FILTERS=[['all','Alle'],['due','⏰ Fällig'],['weak','🔴 Schwach'],['neu','★ Neu 4. Aufl.'],['marks','🔖 Gemerkt'],...[1,2,3,4,5,6,7].map(k=>[String(k),k+' · '+CAT[k]])];
function matchF(c,f){if(f==='all')return true;if(f==='due')return isDue(c);if(f==='weak')return ['red','yellow'].includes(state[c.id]?.rating);if(f==='neu')return !!c.neu;if(f==='marks')return meta.marks.includes(c.id);return String(c.cat)===f}
function chipRow(box,cur,onPick){box.replaceChildren();FILTERS.forEach(([k,l])=>{const b=el('button','chip'+(k===cur?' on':''),esc(l));b.onclick=()=>{onPick(k);vib(8)};box.appendChild(b)});const on=box.querySelector('.on');if(on)setTimeout(()=>on.scrollIntoView({inline:'center',block:'nearest'}),0)}
function smartPool(f){const cs=CARDS.filter(c=>matchF(c,f));const g=[[],[],[],[],[]];cs.forEach(c=>{const s=state[c.id];if(!s)g[2].push(c);else if(isDue(c))g[s.rating==='red'?0:s.rating==='yellow'?1:3].push(c);else g[4].push(c)});const g4=shuffle(g[4]).sort((a,b)=>(state[a.id].due||0)-(state[b.id].due||0));
  const ord=meta.order||'smart';if(ord==='random')return shuffle(cs);if(ord==='nr')return [...cs].sort((a,b)=>(a.nr||29.5)-(b.nr||29.5));
  return [...shuffle(g[0]),...shuffle(g[1]),...shuffle(g[2]),...shuffle(g[3]),...g4]}

/* ---------- Bewertung, XP, Ziele ---------- */
let combo=0;
function activity(xp){const k=dkey();const before=meta.days[k]||0;meta.days[k]=before+1;const oldL=level();meta.xp+=xp;
  if(before+1===meta.goal){setTimeout(()=>{confetti(160);toast('🎯 Tagesziel geschafft! 🔥 '+streak()+' Tage Streak');vib([30,60,30])},350)}
  else if(level()>oldL){setTimeout(()=>{confetti(90);toast('⬆️ Level '+level()+': '+lvlName())},350)}
  checkBadges()}
function rate(id,r,src){const old=state[id]?{...state[id]}:null;const o=old||{streak:0,count:0};const st=r==='green'?o.streak+1:0;const gap=r==='red'?0:r==='yellow'?1:[1,3,7,14,30,60][Math.min(st-1,5)];
  state[id]={rating:r,count:o.count+1,streak:st,due:day()+gap,updated:Date.now()};
  if(r==='green')combo++;else combo=0;
  const xp=(r==='green'?10:r==='yellow'?6:4)+(combo>=5?3:0);activity(xp);save();
  if(combo&&combo%10===0){toast('🔥 '+combo+'er Combo!');vib([20,40,20])}
  return {id,old,xp}}
function undoRate(h){if(h.old)state[h.id]=h.old;else delete state[h.id];const k=dkey();meta.days[k]=Math.max(0,(meta.days[k]||1)-1);meta.xp=Math.max(0,meta.xp-h.xp);combo=0;save()}
function toggleMark(id){const i=meta.marks.indexOf(id);if(i>=0)meta.marks.splice(i,1);else meta.marks.push(id);save();vib(10);return i<0}
const BADGES=[['first','🌱 Erste Karte',()=>Object.keys(state).length>=1],['k50','📗 50 Karten geübt',()=>Object.keys(state).length>=50],['k150','📘 150 Karten geübt',()=>Object.keys(state).length>=150],['all','🏆 Alle Karten gesehen',()=>CARDS.every(c=>state[c.id])],['s3','🔥 3 Tage Streak',()=>streak()>=3],['s7','🔥 7 Tage Streak',()=>streak()>=7],['g50','💚 50× sicher',()=>CARDS.filter(c=>state[c.id]?.rating==='green').length>=50],['neu','★ Alle neuen Karten',()=>CARDS.filter(c=>c.neu).every(c=>state[c.id])],['b150','⚡ 150 Blitz-Punkte',()=>meta.blitzBest>=150],['goal','🎯 Tagesziel geschafft',()=>todayCount()>=meta.goal]];
function checkBadges(){BADGES.forEach(([k,n,f])=>{if(!meta.badges.includes(k)&&f()){meta.badges.push(k);setTimeout(()=>{toast('Abzeichen: '+n);confetti(60)},900)}})}

/* ---------- UI-Helfer ---------- */
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function confetti(n){const w=fx.width=innerWidth,h=fx.height=innerHeight;const cols=['#5fe0c1','#ffcf5c','#ff8fa3','#89b4ff','#c49bff','#fff'];for(let i=0;i<n;i++)parts.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,l:110+Math.random()*50});if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.globalAlpha=Math.min(1,p.l/40);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);fctx.restore()});if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fctx.clearRect(0,0,fx.width,fx.height)}}
function openSheet(html,center){const s=$('#sheet');s.className='sheet'+(center?' center':'');s.innerHTML=(center?'':'<div class="grab"></div>')+html;$('#ov').classList.add('on');$('#ov').style.alignItems=center?'center':'flex-end';return s}
function closeSheet(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
function ask(text,yes,no='Abbrechen'){return new Promise(res=>{const s=openSheet(`<h2>${esc(text)}</h2><div class="row" style="margin-top:16px"><button class="btn block" id="aN">${esc(no)}</button><button class="btn primary block" id="aY">${esc(yes)}</button></div>`,true);s.querySelector('#aN').onclick=()=>{closeSheet();res(false)};s.querySelector('#aY').onclick=()=>{closeSheet();res(true)}})}

/* ---------- Navigation ---------- */
const TABS=['home','swipe','feed','quiz','blitz','more'];let cur='';
function show(t){if(!TABS.includes(t))t='home';if(t===cur&&t!=='home'){return}const prev=cur;cur=t;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(prev==='blitz'&&blitz.run)stopBlitz(true);
  if(t==='home')renderHome();if(t==='swipe')enterSwipe();if(t==='feed')enterFeed();if(t==='blitz')renderBlitzStart();if(t==='quiz')renderQuiz();if(t==='more')renderLib()}
function go(t){if(location.hash!=='#'+t)location.hash=t;else show(t)}
addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>{vib(6);go(b.dataset.tab)});

/* ---------- START ---------- */
function greet(){const h=new Date().getHours();return h<5?'Nachtschicht? 🌙':h<11?'Guten Morgen ☀️':h<17?'Hallo 👋':h<22?'Guten Abend 🌆':'Späte Lernrunde 🌙'}
function renderHome(){const b=$('#homeBody');const tc=todayCount(),g=meta.goal,pct=Math.min(1,tc/g),st=streak();const [lo,hi]=lvlRange();
  const due=CARDS.filter(isDue).length,seen=CARDS.filter(c=>state[c.id]).length,green=CARDS.filter(c=>state[c.id]?.rating==='green').length;

/* ---------- SWIPE ---------- */
const SESSION=20;let sw={queue:[],pos:0,hist:[],res:{green:0,yellow:0,red:0},xp:0,maxCombo:0,filter:null},swipeReset=true;
function enterSwipe(){chipRow($('#swChips'),meta.filter,function pick(f){meta.filter=f;save();newSession();chipRow($('#swChips'),f,pick)});if(swipeReset||sw.filter!==meta.filter||sw.pos>=sw.queue.length&&!sw.done){newSession()}else renderStack();swipeReset=false;
  if(!localStorage.getItem('ap2_swipe_hint')){setTimeout(()=>toast('Tippen = umdrehen · rechts ✔ · links ✖ · hoch ?'),500);try{localStorage.setItem('ap2_swipe_hint','1')}catch(e){}}}
function newSession(list){sw={queue:(list||smartPool(meta.filter)).slice(0,SESSION),pos:0,hist:[],res:{green:0,yellow:0,red:0},xp:0,maxCombo:0,filter:meta.filter,done:false};combo=0;renderStack()}
function swHud(){const n=sw.queue.length;$('#swCount').textContent=n?`${Math.min(sw.pos+1,n)} / ${n}`:'';$('#swBar').style.width=(n?100*sw.pos/n:0)+'%';$('#swCombo').textContent=combo>=3?'🔥 '+combo+'er Combo':'';$('#swGoal').textContent='🎯 '+todayCount()+'/'+meta.goal;$('#bUndo').style.visibility=sw.hist.length?'visible':'hidden'}
function cardFace(c){const sc=sizeCls(c.answer);return `<div class="inner"><div class="face front"><div class="row" style="justify-content:space-between"><span class="tag"><i style="background:${CCOL[c.cat]}"></i>${esc(CAT[c.cat])}</span><span class="tiny muted">${label(c)}${c.neu?' · ★ neu':''}${meta.marks.includes(c.id)?' · 🔖':''}</span></div><div class="q">${esc(c.question)}</div><div class="hint">👆 Tippen zum Umdrehen</div></div><div class="face back"><div class="bq">${esc(c.question)}</div><div class="a ans ${sc}">${esc(c.answer)}</div><div class="hint" style="margin-top:8px">← nochmal · ↑ unsicher · kann ich →</div></div></div><div class="stamp yes">KANN ICH</div><div class="stamp no">NOCHMAL</div><div class="stamp mid">UNSICHER</div>`}
function renderStack(){const st=$('#stack');st.replaceChildren();swHud();$('#swBtns').style.display='';
  if(!sw.queue.length){$('#swBtns').style.display='none';st.innerHTML=`<div class="empty"><div class="big">🗂️</div><h2>Keine Karten in dieser Auswahl</h2><p class="muted small">Wähle oben einen anderen Filter.</p></div>`;return}
  if(sw.pos>=sw.queue.length){sw.done=true;return summary()}
  for(let i=Math.min(sw.pos+2,sw.queue.length-1);i>=sw.pos;i--){const c=sw.queue[i];const d=el('div','sc'+(i>sw.pos?' under':''),cardFace(c));const k=i-sw.pos;d.style.transform=`translateY(${k*12}px) scale(${1-k*.05})`;d.style.opacity=k>1?.6:1;d.dataset.id=c.id;st.appendChild(d);if(i===sw.pos)bindDrag(d)}}
function topCard(){return $('#stack .sc:not(.under)')}
function bindDrag(d){let sx=0,sy=0,dx=0,dy=0,t0=0,down=false,moved=false;
  d.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;t0=Date.now();d.setPointerCapture(e.pointerId);d.style.transition='none'});
  d.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;if(!moved)return;d.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/16}deg)`;
    const yes=d.querySelector('.stamp.yes'),no=d.querySelector('.stamp.no'),mid=d.querySelector('.stamp.mid');yes.style.opacity=Math.max(0,Math.min(1,dx/110));no.style.opacity=Math.max(0,Math.min(1,-dx/110));mid.style.opacity=(-dy>Math.abs(dx))?Math.max(0,Math.min(1,-dy/120)):0});
  const end=e=>{if(!down)return;down=false;const dt=Math.max(1,Date.now()-t0),vx=dx/dt,vy=dy/dt;
    if(!moved){flip();return}
    if(dx>110||(vx>.6&&dx>40))fly('green');else if(dx<-110||(vx<-.6&&dx<-40))fly('red');else if((dy<-110||(vy<-.6&&dy<-40))&&-dy>Math.abs(dx))fly('yellow');
    else{d.style.transition='transform .35s cubic-bezier(.2,.8,.2,1)';d.style.transform='';d.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}};
  d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end)}
function flip(){const d=topCard();if(!d)return;d.classList.toggle('flip');vib(8)}
let flying=false;
function fly(r){const d=topCard();if(!d||flying)return;flying=true;const c=sw.queue[sw.pos];const w=innerWidth;
  const tx=r==='green'?w*1.3:r==='red'?-w*1.3:0,ty=r==='yellow'?-innerHeight:40,rot=r==='green'?28:r==='red'?-28:0;
  d.querySelector('.stamp.'+(r==='green'?'yes':r==='red'?'no':'mid')).style.opacity=1;
  d.style.transition='transform .38s ease-in';d.style.transform=`translate(${tx}px,${ty}px) rotate(${rot}deg)`;
  vib(r==='green'?[12,30,12]:15);
  const h=rate(c.id,r);sw.hist.push(h);sw.res[r]++;sw.xp+=h.xp;sw.maxCombo=Math.max(sw.maxCombo,combo);
  setTimeout(()=>{sw.pos++;flying=false;renderStack()},300)}
function undo(){const h=sw.hist.pop();if(!h)return;undoRate(h);sw.pos--;sw.res=recount();renderStack();vib(10);toast('↶ Rückgängig')}
function recount(){const res={green:0,yellow:0,red:0};sw.hist.forEach(h=>{const r=state[h.id]?.rating;if(r)res[r]++});return res}
function summary(){$('#swBtns').style.display='none';const r=sw.res,n=r.green+r.yellow+r.red;const pct=n?Math.round(100*r.green/n):0;
  if(pct>=80)confetti(120);
  const msg=pct>=90?'Überragend! 🏆':pct>=70?'Stark! 💪':pct>=40?'Gut dran! 📈':'Dranbleiben – Wiederholung macht den Meister 🧠';
  const st=$('#stack');st.innerHTML=`<div class="empty"><div class="big">${pct>=70?'🎉':'💡'}</div><h1>${msg}</h1><p class="muted">Runde geschafft · +${sw.xp} XP · beste Combo ${sw.maxCombo}</p>
  <div class="card" style="width:100%;max-width:360px"><div class="stats3"><div><b style="color:var(--grn)">${r.green}</b><span class="tiny muted">kann ich</span></div><div><b style="color:var(--yel)">${r.yellow}</b><span class="tiny muted">unsicher</span></div><div><b style="color:var(--red)">${r.red}</b><span class="tiny muted">nochmal</span></div></div></div>
  <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px">${r.red+r.yellow?`<button class="btn block" id="sRep">🔁 Nur die ${r.red+r.yellow} unsicheren wiederholen</button>`:''}<button class="btn primary block" id="sNext">Nächste Runde ▶</button></div>
  <p class="tiny muted">${todayCount()>=meta.goal?'🎯 Tagesziel erreicht · 🔥 '+streak()+' Tage':'🎯 Noch '+(meta.goal-todayCount())+' bis zum Tagesziel'}</p></div>`;
  const rep=$('#sRep');if(rep)rep.onclick=()=>newSession(sw.hist.filter(h=>state[h.id]?.rating!=='green').map(h=>BYID[h.id]));$('#sNext').onclick=()=>newSession()}
$('#bYes').onclick=()=>fly('green');$('#bNo').onclick=()=>fly('red');$('#bMid').onclick=()=>fly('yellow');$('#bFlip').onclick=flip;$('#bUndo').onclick=undo;
addEventListener('keydown',e=>{if(cur!=='swipe'||$('#ov').classList.contains('on'))return;if(e.key==='ArrowRight')fly('green');else if(e.key==='ArrowLeft')fly('red');else if(e.key==='ArrowUp')fly('yellow');else if(e.key===' '){e.preventDefault();flip()}else if(e.key==='Backspace')undo()});

let feed={pool:[],pi:0,count:0,seen:0,filter:null,obs:null,since:0};
function enterFeed(){fitFeed();if(feed.filter!==meta.filter||!$('#feedList').children.length)resetFeed();updFeedHud()}
function resetFeed(){feed={pool:smartPool(meta.filter),pi:0,count:0,seen:0,filter:meta.filter,since:0};const L=$('#feedList');L.replaceChildren();$('#v-feed').scrollTop=0;
  if(!feed.pool.length){L.innerHTML=`<section class="post milestone"><div class="big">🗂️</div><h2>Keine Karten in diesem Filter</h2><button class="btn primary" id="fAll">Alle Karten zeigen</button></section>`;$('#fAll').onclick=()=>{meta.filter='all';save();resetFeed()};return}
  L.appendChild(introPost());appendPosts(8)}
function nextCard(){if(feed.pi>=feed.pool.length){feed.pool=shuffle(CARDS.filter(c=>matchF(c,feed.filter)));feed.pi=0}return feed.pool[feed.pi++]}
function introPost(){const p=el('section','post milestone');p.style.setProperty('--pc',CCOL[6]);p.innerHTML=`<div class="big">📱</div><h1>Dein Lern-Feed</h1><p class="muted">Wisch nach oben für die nächste Karte.<br>Tippen = Antwort zeigen · <b>Doppeltipp = kann ich</b> 💚</p><div class="chips" id="fChips" style="max-width:100%;padding:12px 0"></div><p class="tiny muted">⬆️ Hochwischen zum Starten</p>`;
  setTimeout(()=>{const box=p.querySelector('#fChips');if(box)chipRow(box,meta.filter,function f(k){meta.filter=k;save();resetFeed()})},0);return p}
function appendPosts(n){const L=$('#feedList');for(let i=0;i<n;i++){feed.count++;let p;
  if(feed.count%15===0)p=milestonePost();else if(feed.count%6===0){const c=nextCard();p=quizPost(c)||cardPost(c)}else p=cardPost(nextCard());L.appendChild(p)}}
function sideBtns(c){return `<div class="side"><button class="g" data-r="green"><span class="ib">💚</span>kann ich</button><button class="y" data-r="yellow"><span class="ib">🤔</span>unsicher</button><button class="r" data-r="red"><span class="ib">🔁</span>nochmal</button><button data-m="1" class="${meta.marks.includes(c.id)?'on':''}"><span class="ib">🔖</span>merken</button></div>`}
function cardPost(c){const p=el('section','post');p.dataset.id=c.id;p.style.setProperty('--pc',CCOL[c.cat]);
  p.innerHTML=`<div class="ptop"><span class="tag"><i style="background:${CCOL[c.cat]}"></i>${esc(CAT[c.cat])}</span><span class="tag">${label(c)}</span>${c.neu?'<span class="tag" style="color:var(--yel)">★ neu</span>':''}</div><div class="pbody"><div class="pq">${esc(c.question)}</div><div class="pa ans hide ${sizeCls(c.answer)}">${esc(c.answer)}</div><div class="tap">👆 Tippen für die Antwort · Doppeltipp = 💚</div></div>${sideBtns(c)}`;
  const pa=p.querySelector('.pa');let lastTap=0;
  p.querySelector('.pbody').addEventListener('click',e=>{const now=Date.now();if(now-lastTap<320){like(p,c,e)}else{if(pa.classList.contains('hide')){pa.classList.remove('hide');p.querySelector('.tap').textContent='Wie gut wusstest du es? → rechts bewerten';vib(6)}}lastTap=now});
  p.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>feedRate(p,c,b.dataset.r));
  p.querySelector('[data-m]').onclick=e=>{const on=toggleMark(c.id);e.currentTarget.classList.toggle('on',on);toast(on?'🔖 Gemerkt':'Nicht mehr gemerkt')};return p}
function like(p,c,e){const r=p.getBoundingClientRect();const h=el('div','heart','💚');h.style.left=(e.clientX-r.left)+'px';h.style.top=(e.clientY-r.top)+'px';p.appendChild(h);setTimeout(()=>h.remove(),800);feedRate(p,c,'green')}
function feedRate(p,c,r){if(p.dataset.rated===r)return;p.querySelector('.pa')?.classList.remove('hide');const first=!p.dataset.rated;if(p.dataset.rated&&p._h)undoRate(p._h);p._h=rate(c.id,r);p.dataset.rated=r;p.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===r));vib(r==='green'?[10,30,10]:12);updFeedHud();
  if(first)setTimeout(()=>{const n=p.nextElementSibling;if(n)$('#v-feed').scrollTo({top:n.offsetTop,behavior:'smooth'})},650)}
function quizPost(c){const ks=KQ.filter(k=>k.id===c.id);if(!ks.length)return null;const k=ks[Math.floor(Math.random()*ks.length)];const opts=kqOpts(k);
  const p=el('section','post');p.style.setProperty('--pc',CCOL[c.cat]);p.innerHTML=`<div class="ptop"><span class="tag" style="color:var(--yel)">🧩 Quiz-Runde</span><span class="tag">${label(c)}</span></div><div class="pbody" style="justify-content:center"><div class="pq" style="font-size:21px">${esc(k.q)}</div><div>${opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(p.dataset.done)return;p.dataset.done=1;const ok=opts[+b.dataset.o]===k.a;p.querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.o]===k.a)x.classList.add('ok')});if(!ok){b.classList.add('bad');p.classList.add('shake')}
    rate(c.id,ok?'green':'red');vib(ok?[10,30,10]:[40]);if(ok)confettiSmall();toast(ok?'✅ Richtig! +10 XP':'❌ Knapp daneben – kommt wieder');updFeedHud();setTimeout(()=>{const n=p.nextElementSibling;if(n)$('#v-feed').scrollTo({top:n.offsetTop,behavior:'smooth'})},1300)});return p}

function milestonePost(){const p=el('section','post milestone');const tc=todayCount();p.innerHTML=`<div class="big">${tc>=meta.goal?'🏆':'🔥'}</div><h1>${feed.seen} Karten im Feed!</h1><p class="muted">Heute: ${tc}/${meta.goal} · Streak ${streak()} Tage · Level ${level()}</p><p>${tc>=meta.goal?'Tagesziel geknackt – alles ab jetzt ist Bonus.':'Noch '+(meta.goal-tc)+' bis zum Tagesziel. Weiter geht\'s ⬆️'}</p>`;return p}

  if(L.children.length>120&&idx>60){const cut=40;for(let i=0;i<cut;i++)L.removeChild(L.firstElementChild);v.scrollTop-=cut*h}}

let blitz={run:false};
function renderBlitzStart(){const b=$('#blitzBody');b.innerHTML=`<div class="empty"><div class="big">⚡</div><h1>Blitz-Runde</h1><p class="muted">60 Sekunden. Wähle die passende Antwort.<br>Richtige Antworten in Folge geben einen <b style="color:var(--yel)">Combo-Multiplikator</b>.</p><div class="pill" style="font-size:16px">🏆 Highscore: ${meta.blitzBest}</div><div class="chips" id="bChips" style="max-width:100%;padding:8px 0"></div><button class="btn primary block" style="max-width:340px;padding:16px;font-size:18px" id="bStart">Start ▶</button><p class="tiny muted">Falsche Antworten landen automatisch in deinen Wiederholungen.</p></div>`;
  chipRow($('#bChips'),meta.filter,function f(k){meta.filter=k;save();chipRow($('#bChips'),k,f)});$('#bStart').onclick=startBlitz}
function startBlitz(){const pool=kqFor(meta.filter);blitz={run:true,pool:shuffle(pool),i:0,score:0,combo:0,right:0,wrong:0,end:Date.now()+60000,wrongIds:[]};vib(20);blitzQ();blitz.t=setInterval(blitzTick,200)}
function blitzTick(){const left=Math.max(0,blitz.end-Date.now());const t=$('#bTimer');if(t)t.style.width=(left/600)+'%';const s=$('#bSec');if(s)s.textContent=Math.ceil(left/1000)+'s';if(left<=0)stopBlitz()}
function mult(){return blitz.combo>=8?4:blitz.combo>=5?3:blitz.combo>=2?2:1}
function blitzQ(){if(blitz.i>=blitz.pool.length){blitz.pool=shuffle(blitz.pool);blitz.i=0}const k=blitz.pool[blitz.i++],c=BYID[k.id];const opts=kqOpts(k);
  const b=$('#blitzBody');b.innerHTML=`<div class="row" style="justify-content:space-between"><span class="score">${blitz.score}</span><span class="pill" style="color:var(--yel)">${mult()>1?'×'+mult()+' Combo':'Combo ×1'}</span><span class="pill" id="bSec">60s</span></div><div class="timer" style="margin-top:10px"><div id="bTimer" style="width:100%"></div></div>
  <div class="row" style="margin-top:14px"><span class="tag"><i style="background:${CCOL[c.cat]}"></i>${esc(CAT[c.cat])}</span><span class="tag">${label(c)}</span></div><div class="bq">${esc(k.q)}</div><div id="bOpts">${opts.map((o,i)=>`<button class="opt" data-o="${i}" style="font-size:15.5px;font-weight:600">${esc(o)}</button>`).join('')}</div>`;blitzTick();
  b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(!blitz.run||blitz.lock)return;blitz.lock=true;const ok=opts[+x.dataset.o]===k.a;b.querySelectorAll('.opt').forEach(y=>{if(opts[+y.dataset.o]===k.a)y.classList.add('ok')});
    if(ok){blitz.combo++;blitz.right++;blitz.score+=10*mult();vib(10);b.classList.add('flash-ok');activity(3)}else{x.classList.add('bad');blitz.combo=0;blitz.wrong++;blitz.wrongIds.push(c.id);vib([50]);b.classList.add('flash-bad','shake');rate(c.id,'red')}
    setTimeout(()=>{b.classList.remove('flash-ok','flash-bad','shake');blitz.lock=false;if(blitz.run)blitzQ()},ok?450:1300)})}
function stopBlitz(silent){if(!blitz.run)return;blitz.run=false;clearInterval(blitz.t);save();if(silent)return;const best=blitz.score>meta.blitzBest;if(best){meta.blitzBest=blitz.score;save();checkBadges();confetti(150)}vib([30,50,30]);
  const n=blitz.right+blitz.wrong;$('#blitzBody').innerHTML=`<div class="empty"><div class="big">${best?'🏆':'⏱️'}</div><h1>${best?'Neuer Highscore!':'Zeit abgelaufen!'}</h1><div class="score" style="font-size:52px">${blitz.score}</div><p class="muted">${blitz.right} richtig · ${blitz.wrong} falsch · ${n?Math.round(100*blitz.right/n):0} % Trefferquote<br>Highscore: ${meta.blitzBest}</p>${blitz.wrongIds.length?`<button class="btn block" style="max-width:340px" id="bRev">🔁 Die ${blitz.wrongIds.length} Fehler im Swipe üben</button>`:''}<button class="btn primary block" style="max-width:340px" id="bAgain">Nochmal ⚡</button></div>`;
  $('#bAgain').onclick=startBlitz;const rv=$('#bRev');if(rv)rv.onclick=()=>{const ids=[...new Set(blitz.wrongIds)];go('swipe');setTimeout(()=>newSession(ids.map(i=>BYID[i])),50)}}

function detail(c){const s=openSheet(`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="tag"><i style="background:${CCOL[c.cat]}"></i>${esc(CATLONG[c.cat])}</span><span class="tiny muted">${label(c)}</span></div><h2 style="font-size:19px">${esc(c.question)}</h2><div class="ans" style="background:#00000030;border:1px solid #ffffff14;border-radius:16px;padding:14px;margin:12px 0">${esc(c.answer)}</div>

function renderSettings(){const p=$('#setPane');p.innerHTML=`<div class="card" style="margin-bottom:12px"><h2>Lernen</h2>

function exportData(){meta.lastBackup=Date.now();save();const json=JSON.stringify({version:2,progress:state,meta,exported:new Date().toISOString()},null,2);if(window.AndroidApp&&AndroidApp.saveFile){AndroidApp.saveFile('ap2-fisi-fortschritt.json',json);return}try{const f=new File([json],'ap2-fisi-fortschritt.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'AP2 Lernfortschritt'}).catch(()=>{});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='ap2-fisi-fortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}

function kqFor(f){let a=KQ.filter(k=>matchF(BYID[k.id],f));return a.length>=4?a:KQ}
function kqOpts(k){return shuffle([k.a,...k.w])}

/* ---------- MQTT über WebSocket (minimal, QoS 0) ---------- */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const TE=new TextEncoder(),TD=new TextDecoder();
function mStr(s){const b=TE.encode(s);return [b.length>>8,b.length&255,...b]}
function mPkt(type,body){const len=[];let x=body.length;do{let d=x%128;x=Math.floor(x/128);if(x>0)d|=128;len.push(d)}while(x>0);const u=new Uint8Array(1+len.length+body.length);u[0]=type;u.set(len,1);u.set(body,1+len.length);return u}
class Mqtt{
  constructor(onMsg,onLost){this.onMsg=onMsg;this.onLost=onLost;this.ws=null;this.buf=new Uint8Array(0);this.pid=1;this.closed=false;this.subs=[]}
  async connect(){let list=[];try{list=(localStorage.getItem('ap2_broker')||'').split(',').filter(Boolean)}catch(e){}const urls=list.length?list:BROKERS;
    for(const u of urls){if(this.closed)return false;try{await this._try(u);this.url=u;return true}catch(e){}}return false}
  _try(url){return new Promise((res,rej)=>{let ws;try{ws=new WebSocket(url,['mqtt'])}catch(e){return rej(e)}ws.binaryType='arraybuffer';let done=false;
    const to=setTimeout(()=>{if(!done){done=true;try{ws.close()}catch(e){}rej('timeout')}},7000);
    this._connack=rc=>{if(done)return;done=true;clearTimeout(to);if(rc!==0){try{ws.close()}catch(e){}return rej('rc'+rc)}this.ws=ws;
      this._ping=setInterval(()=>this._send(new Uint8Array([0xC0,0])),20000);ws.onclose=()=>{clearInterval(this._ping);this.ws=null;if(!this.closed&&this.onLost)this.onLost()};res()};
    ws.onopen=()=>{const cid='ap2-'+Math.random().toString(36).slice(2,12);ws.send(mPkt(0x10,[...mStr('MQTT'),4,2,0,40,...mStr(cid)]))};
    ws.onmessage=e=>this._data(new Uint8Array(e.data));
    ws.onerror=()=>{if(!done){done=true;clearTimeout(to);rej('err')}};
    ws.onclose=()=>{if(!done){done=true;clearTimeout(to);rej('closed')}}})}
  _send(u){if(this.ws&&this.ws.readyState===1)try{this.ws.send(u)}catch(e){}}
  _data(chunk){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
    while(this.buf.length>=2){let mul=1,len=0,i=1,d;do{if(i>=this.buf.length)return;d=this.buf[i++];len+=(d&127)*mul;mul*=128}while(d&128);
      if(this.buf.length<i+len)return;const h=this.buf[0],body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);const t=h>>4;
      if(t===2&&this._connack)this._connack(body[1]);
      else if(t===3){const tl=(body[0]<<8)|body[1];const topic=TD.decode(body.slice(2,2+tl));const q=(h>>1)&3;const msg=TD.decode(body.slice(2+tl+(q?2:0)));try{this.onMsg(topic,msg)}catch(e){console.error(e)}}}}
  sub(topic){this.subs.push(topic);const p=this.pid++;this._send(mPkt(0x82,[p>>8,p&255,...mStr(topic),0]))}
  pub(topic,obj){this._send(mPkt(0x30,[...mStr(topic),...TE.encode(JSON.stringify(obj))]))}
  close(){this.closed=true;clearInterval(this._ping);try{this._send(new Uint8Array([0xE0,0]));this.ws&&this.ws.close()}catch(e){}}
}

/* ---------- QUIZ-SPIEL (Kahoot-Stil) ---------- */
if(!meta.pid){meta.pid=Math.random().toString(36).slice(2,10);save()}
const KCOL=[['#e21b3c','▲'],['#1368ce','◆'],['#d89e00','●'],['#26890c','■']];
const BASE='ap2fisi/kq1/';
let H=null;   // Host-Zustand (nur beim Host)
let G=null;   // Spieler-Sicht {role,code,net,snap,deadline,answered,...}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function myName(){return (meta.name||'').trim()||'Spieler'}

// ---- Host ----
function hostSnap(){const now=Date.now();const q=H.qi>=0&&H.qi<H.qs.length?H.qs[H.qi]:null;const rev=H.phase==='reveal';
  const players=[...H.players.values()].sort((a,b)=>b.score-a.score).map(p=>({id:p.id,name:p.name,score:p.score,gain:p.gain||0,ok:!!p.ok,streak:p.streak||0,ans:H.phase==='q'?!!p.ans:undefined}));
  let dist=null;if(rev){dist=[0,0,0,0];H.players.forEach(p=>{if(p.ans)dist[p.ans.c]++})}
  return {t:'s',code:H.code,phase:H.phase,qi:H.qi,n:H.qs.length,dur:H.dur,rem:H.phase==='q'?Math.max(0,H.deadline-now):0,
    q:q?{id:q.k.id,nr:q.k.nr,cat:q.k.cat,text:q.k.q,opts:q.opts}:null,correct:rev?q.correct:-1,dist,answered:H.phase==='q'?[...H.players.values()].filter(p=>p.ans).length:0,players,host:meta.pid}}
function hostSend(){if(!H)return;const s=hostSnap();if(H.net)H.net.pub(BASE+H.code+'/h',s);applySnap(s)}
function hostMsg(topic,raw){let m;try{m=JSON.parse(raw)}catch(e){return}if(!H||!m||!m.id)return;
  if(m.t==='join'){const name=String(m.name||'Spieler').slice(0,16);if(!H.players.has(m.id)){H.players.set(m.id,{id:m.id,name,score:0,streak:0});hostSend()}else H.players.get(m.id).name=name}
  else if(m.t==='ans'&&H.phase==='q'&&m.qi===H.qi){const p=H.players.get(m.id);if(!p||p.ans)return;p.ans={c:+m.c,ms:Math.max(0,Math.min(H.dur,+m.ms||H.dur))};
    if([...H.players.values()].every(x=>x.ans))hostReveal();else hostSend()}
  else if(m.t==='leave'){H.players.delete(m.id);hostSend()}}
async function hostCreate(opts){const k=shuffle(kqFor(opts.filter)).slice(0,opts.n);
  H={code:genCode(),net:null,players:new Map(),qs:k.map(it=>{const o=kqOpts(it);return{k:it,opts:o,correct:o.indexOf(it.a)}}),qi:-1,phase:'lobby',dur:opts.sec*1000,deadline:0,solo:opts.solo};
  H.players.set(meta.pid,{id:meta.pid,name:myName(),score:0,streak:0});
  G={role:'host',code:H.code,snap:null,answered:-1,solo:opts.solo,lastSeen:Date.now()};
  if(!opts.solo){renderKMsg('🔌 Verbinde mit dem Spielserver …');const net=new Mqtt(hostMsg,()=>toast('⚠️ Verbindung unterbrochen – verbinde neu …')||reconnect(net));
    if(!await net.connect()){H=null;G=null;return renderKMsg('❌ Keine Verbindung zum Spielserver. Prüfe die Internetverbindung und versuche es erneut.',true)}
    H.net=net;net.sub(BASE+H.code+'/p');H.hb=setInterval(hostSend,1500)}
  hostSend();if(opts.solo)hostStart()}
async function reconnect(net){for(let i=0;i<5&&!net.closed;i++){await new Promise(r=>setTimeout(r,1500*(i+1)));if(await net.connect()){net.subs.splice(0).forEach(t=>net.sub(t));toast('✅ Wieder verbunden');return}}}
function hostStart(){if(!H)return;hostNext()}
function hostNext(){clearInterval(H.tick);H.qi++;H.players.forEach(p=>{p.ans=null;p.gain=0;p.ok=false});
  if(H.qi>=H.qs.length){H.phase='end';hostSend();return}
  H.phase='q';H.deadline=Date.now()+H.dur;hostSend();H.tick=setInterval(()=>{if(H&&H.phase==='q'&&Date.now()>=H.deadline)hostReveal()},250)}
function hostReveal(){clearInterval(H.tick);if(H.phase!=='q')return;const q=H.qs[H.qi];
  H.players.forEach(p=>{const ok=!!p.ans&&p.ans.c===q.correct;p.ok=ok;p.streak=ok?(p.streak||0)+1:0;p.gain=ok?Math.round(1000*(1-(p.ans.ms/H.dur)/2))+Math.min((p.streak-1)*100,500):0;p.score+=p.gain});
  H.phase='reveal';hostSend()}
function quitGame(){if(G&&G.role==='player'&&G.net){G.net.pub(BASE+G.code+'/p',{t:'leave',id:meta.pid})}
  if(H){clearInterval(H.hb);clearInterval(H.tick);H.net&&H.net.close();H=null}if(G){clearInterval(G.hb);clearInterval(G.tm);G.net&&G.net.close();G=null}renderQuizMenu()}

// ---- Spieler ----
async function joinGame(code){code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6)return toast('Der Code hat 6 Zeichen');
  G={role:'player',code,snap:null,answered:-1,lastSeen:Date.now()};renderKMsg('🔌 Verbinde mit Spiel '+code+' …');
  const net=new Mqtt((t,raw)=>{let s;try{s=JSON.parse(raw)}catch(e){return}if(s&&s.t==='s'&&G&&s.code===G.code){G.lastSeen=Date.now();applySnap(s)}},()=>{toast('⚠️ Verbindung unterbrochen – verbinde neu …');reconnect(net)});
  if(!await net.connect()){G=null;return renderKMsg('❌ Keine Verbindung zum Spielserver. Prüfe die Internetverbindung.',true)}
  if(!G)return net.close();G.net=net;net.sub(BASE+code+'/h');
  const hello=()=>{if(!G)return;const inList=G.snap&&G.snap.players.some(p=>p.id===meta.pid);if(!inList)net.pub(BASE+code+'/p',{t:'join',id:meta.pid,name:myName()});
    if(!G.snap&&Date.now()-G.lastSeen>9000)renderKMsg('⏳ Spiel '+code+' noch nicht gefunden … Ist der Code richtig und der Host online?',true,true);
    if(G.snap&&G.snap.phase!=='end'&&Date.now()-G.lastSeen>10000)renderKMsg('📡 Keine Daten vom Host seit 10 Sekunden …',true,true)};
  hello();G.hb=setInterval(hello,2000)}
function sendAnswer(c){if(!G||!G.snap||G.snap.phase!=='q'||G.answered===G.snap.qi)return;const ms=Math.max(0,G.snap.dur-Math.max(0,G.deadline-Date.now()));G.answered=G.snap.qi;G.myChoice=c;vib(15);
  const m={t:'ans',id:meta.pid,qi:G.snap.qi,c,ms};if(G.role==='host')hostMsg('',JSON.stringify(m));else{G.net.pub(BASE+G.code+'/p',m);renderQuiz()}}

// ---- Darstellung ----
function applySnap(s){const prev=G.snap;G.snap=s;const force=G.msg;G.msg=false;
  if(s.phase==='q'&&(!prev||prev.qi!==s.qi||prev.phase!=='q')){G.deadline=Date.now()+s.rem;G.myChoice=-1;renderQuiz();clearInterval(G.tm);G.tm=setInterval(kTimer,200);return}
  if(s.phase==='reveal'&&(!prev||prev.phase!=='reveal'||prev.qi!==s.qi)){clearInterval(G.tm);const me=s.players.find(p=>p.id===meta.pid);
    if(me&&s.q){if(me.ok){vib([10,40,10]);activity(5)}else{vib(60);rate(s.q.id,'red')}}renderQuiz();return}
  if(s.phase==='end'&&(!prev||prev.phase!=='end')){clearInterval(G.tm);const r=s.players.findIndex(p=>p.id===meta.pid);if(r>=0&&r<3)confetti(180);renderQuiz();return}
  if(s.phase==='lobby'||(prev&&JSON.stringify(prev.players.map(p=>p.id+p.ans))!==JSON.stringify(s.players.map(p=>p.id+p.ans)))){if(s.phase==='q')kAnsCount();else renderQuiz()}else if(force)renderQuiz()}
function kTimer(){if(!G||!G.snap||G.snap.phase!=='q')return;const left=Math.max(0,G.deadline-Date.now());const e=$('#kSec');if(e)e.textContent=Math.ceil(left/1000);const r=$('#kRing');if(r)r.style.strokeDashoffset=(2*Math.PI*26)*(1-left/G.snap.dur)}
function kAnsCount(){const s=G.snap,e=$('#kAns');if(e)e.textContent=s.answered+' / '+s.players.length+' haben geantwortet'}
function renderKMsg(t,back,keep){if(G)G.msg=true;const b=$('#quizBody');b.innerHTML=`<div class="empty"><p style="font-size:17px">${esc(t)}</p>${back?`<button class="btn" id="kBack">${keep?'Abbrechen':'Zurück'}</button>`:''}</div>`;const k=$('#kBack');if(k)k.onclick=quitGame}
let qSet={n:10,sec:20};
function renderQuizMenu(){const b=$('#quizBody');if(G&&G.snap)return renderQuiz();
  b.innerHTML=`<div style="text-align:center;margin:6px 0 16px"><div style="font-size:54px">🎮</div><h1>Quiz-Battle</h1><p class="muted small">Multiple Choice wie bei Kahoot – allein oder mit Freunden per Sitzungscode.</p></div>
  <div class="card" style="margin-bottom:12px"><label class="small muted">Dein Name</label><input class="search" id="kName" maxlength="16" value="${esc(meta.name||'')}" placeholder="z. B. Malte" style="margin-top:6px"></div>
  <div class="card" style="margin-bottom:12px"><h2>🔑 Spiel beitreten</h2><div class="row"><input class="search" id="kCode" maxlength="6" placeholder="CODE" style="text-transform:uppercase;letter-spacing:4px;font-weight:800;text-align:center;font-size:20px"><button class="btn primary" id="kJoin">Los</button></div></div>
  <div class="card" style="margin-bottom:12px"><h2>🛠️ Neues Spiel</h2><div class="chips" id="kChips" style="padding:0 0 10px"></div>
   <div class="set"><span>Fragen</span><select id="kN">${[5,10,15,20,30].map(n=>`<option ${n===qSet.n?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="set" style="border:0"><span>Zeit pro Frage</span><select id="kS">${[10,15,20,30].map(n=>`<option value="${n}" ${n===qSet.sec?'selected':''}>${n} s</option>`).join('')}</select></div>
   <div class="row" style="margin-top:10px"><button class="btn block" id="kSolo">🎯 Allein spielen</button><button class="btn primary block" id="kHost">📡 Hosten</button></div></div>
  <p class="tiny muted">Mehrspieler braucht Internet. Alle Spieler installieren die App, der Host teilt den 6-stelligen Code. Spielt euch gegenseitig an – Punkte gibt es für richtige UND schnelle Antworten.</p>`;
  const nm=$('#kName');nm.oninput=()=>{meta.name=nm.value.trim();save()};
  chipRow($('#kChips'),meta.filter,function f(k){meta.filter=k;save();chipRow($('#kChips'),k,f)});
  $('#kN').onchange=e=>qSet.n=+e.target.value;$('#kS').onchange=e=>qSet.sec=+e.target.value;
  const need=()=>{if(!myName()||myName()==='Spieler'&&!meta.name){nm.focus();toast('Bitte zuerst einen Namen eingeben');return false}return true};
  $('#kSolo').onclick=()=>{hostCreate({filter:meta.filter,n:qSet.n,sec:qSet.sec,solo:true})};
  $('#kHost').onclick=()=>{if(need())hostCreate({filter:meta.filter,n:qSet.n,sec:qSet.sec,solo:false})};
  $('#kJoin').onclick=()=>{if(need())joinGame($('#kCode').value)};
  $('#kCode').onkeydown=e=>{if(e.key==='Enter')$('#kJoin').click()}}
function kTiles(s,mode){return `<div class="ktiles">${s.q.opts.map((o,i)=>{const [col,sym]=KCOL[i];let cls='kt';if(mode==='rev'){cls+=i===s.correct?' good':' dim'}else if(G.answered===s.qi){cls+=i===G.myChoice?' picked':' dim'}
  const cnt=mode==='rev'&&s.dist?`<span class="kc">${s.dist[i]}</span>`:'';return `<button class="${cls}" data-i="${i}" style="background:${col}"><span class="ks">${sym}</span><span class="kx">${esc(o)}</span>${mode==='rev'&&i===s.correct?'<span class="kc">✔</span>':cnt}</button>`}).join('')}</div>`}
function kBoard(s,max=5){const me=s.players.findIndex(p=>p.id===meta.pid);let rows=s.players.slice(0,max).map((p,i)=>kRow(p,i));if(me>=max)rows.push('<div class="tiny muted" style="text-align:center">…</div>'+kRow(s.players[me],me));return rows.join('')}
function kRow(p,i){return `<div class="krow ${p.id===meta.pid?'me':''}"><span class="kr">${i+1}</span><span style="flex:1">${esc(p.name)}${p.streak>=2?' <span class="tiny" style="color:var(--yel)">🔥'+p.streak+'</span>':''}</span>${p.gain?`<span class="tiny" style="color:var(--grn)">+${p.gain}</span>`:''}<b>${p.score}</b></div>`}
function renderQuiz(){const b=$('#quizBody');if(!G||!G.snap)return renderQuizMenu();const s=G.snap;const isHost=G.role==='host';
  const top=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="pill">${G.solo?'🎯 Solo':'🔑 '+s.code}</span>${s.phase!=='lobby'&&s.phase!=='end'?`<span class="tiny muted">Frage ${s.qi+1} / ${s.n}</span>`:''}<button class="pill" id="kQuit">✕</button></div>`;
  if(s.phase==='lobby'){b.innerHTML=top+`<div class="card" style="text-align:center;margin-bottom:12px"><div class="muted small">Sitzungscode</div><div style="font-size:46px;font-weight:900;letter-spacing:8px;color:var(--acc)">${s.code}</div><div class="tiny muted">${isHost?'Mitspieler öffnen in der App „Quiz“ → Code eingeben':'Du bist drin! Warte, bis der Host startet …'}</div></div>
    <div class="card" style="margin-bottom:12px"><h2>👥 Spieler (${s.players.length})</h2><div class="badges">${s.players.map(p=>`<span class="badge got">${p.id===s.host?'👑 ':''}${esc(p.name)}</span>`).join('')}</div></div>
    ${isHost?`<button class="btn primary block" id="kStart" style="padding:16px;font-size:18px">Spiel starten ▶</button><p class="tiny muted" style="text-align:center">${s.n} Fragen · ${s.dur/1000} s pro Frage</p>`:`<div class="empty" style="padding:10px"><div class="big" style="animation:pulse 1.4s infinite">⏳</div></div>`}`;}
  else if(s.phase==='q'){const done=G.answered===s.qi;const C=2*Math.PI*26;
    b.innerHTML=top+`<div class="row" style="gap:12px;margin-bottom:10px"><div style="position:relative;width:60px;height:60px;flex:none"><svg width="60" height="60" style="transform:rotate(-90deg)"><circle cx="30" cy="30" r="26" stroke="#ffffff1a" stroke-width="6" fill="none"/><circle id="kRing" cx="30" cy="30" r="26" stroke="var(--yel)" stroke-width="6" fill="none" stroke-dasharray="${C}" stroke-linecap="round"/></svg><b id="kSec" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px"></b></div><div class="kq">${esc(s.q.text)}</div></div>
     ${kTiles(s,'q')}<div class="tiny muted" style="text-align:center;margin-top:10px" id="kAns">${s.answered} / ${s.players.length} haben geantwortet</div>${done?'<div style="text-align:center;margin-top:8px;font-weight:700">✅ Antwort eingeloggt – warte auf die anderen …</div>':''}`;
    if(!done)b.querySelectorAll('.kt').forEach(t=>t.onclick=()=>sendAnswer(+t.dataset.i));kTimer()}
  else if(s.phase==='reveal'){const me=s.players.find(p=>p.id===meta.pid);const ans=G.answered===s.qi;
    const banner=me?(me.ok?`<div class="kban ok">✅ Richtig! +${me.gain}${me.streak>=2?' · 🔥 '+me.streak+'er Serie':''}</div>`:`<div class="kban bad">${ans?'❌ Leider falsch':'⏰ Zu langsam'}</div>`):'';
    b.innerHTML=top+banner+`<div class="kq" style="margin:10px 0">${esc(s.q.text)}</div>${kTiles(s,'rev')}<div class="card" style="margin-top:12px"><h2>🏆 Rangliste</h2>${kBoard(s)}</div>
     ${isHost?`<button class="btn primary block" id="kNext" style="margin-top:12px;padding:15px">${s.qi+1>=s.n?'Endergebnis 🏁':'Nächste Frage ▶'}</button>`:'<p class="tiny muted" style="text-align:center">Der Host startet gleich die nächste Frage …</p>'}
     <button class="btn block" id="kCard" style="margin-top:8px">📖 Karte ${s.q.nr} ansehen</button>`;
    const kc=$('#kCard');if(kc)kc.onclick=()=>detail(BYID[s.q.id])}
  else if(s.phase==='end'){const p=s.players;const pod=[1,0,2].filter(i=>p[i]);
    b.innerHTML=top+`<div style="text-align:center"><h1>🏁 Endergebnis</h1></div><div class="podium">${pod.map(i=>`<div class="pd p${i}"><div class="pn">${esc(p[i].name)}</div><div class="pb"><div style="font-size:28px">${['🥇','🥈','🥉'][i]}</div><b>${p[i].score}</b></div></div>`).join('')}</div>
     <div class="card">${p.map((x,i)=>kRow(x,i)).join('')}</div><button class="btn primary block" id="kAgain" style="margin-top:12px">${isHost?'Neues Spiel':'Zurück zum Menü'}</button>`;
    $('#kAgain').onclick=quitGame}
  const q=$('#kQuit');if(q)q.onclick=async()=>{if(s.phase==='end'||await ask(isHost&&!G.solo?'Spiel beenden? Alle Mitspieler fliegen raus.':'Spiel verlassen?','Verlassen'))quitGame()};
  const st=$('#kStart');if(st)st.onclick=hostStart;const nx=$('#kNext');if(nx)nx.onclick=hostNext}

/* ---------- Lernstand-Code (Sicherung & Übertragung) ---------- */
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function zip(u,dir){if(!window.CompressionStream)return null;const cs=dir?new CompressionStream('deflate-raw'):new DecompressionStream('deflate-raw');const r=new Response(new Blob([u]).stream().pipeThrough(cs));return new Uint8Array(await r.arrayBuffer())}
function packState(){const t=day();const s=[];for(const id in state){const e=state[id];s.push([+id,e.rating==='green'?2:e.rating==='yellow'?1:0,e.streak||0,e.count||0,(e.due||t)-t,Math.floor((e.updated||0)/60000)])}
  const dy={};Object.keys(meta.days).sort().slice(-90).forEach(k=>dy[k]=meta.days[k]);
  return {v:3,d:t,s,m:{xp:meta.xp,bb:meta.blitzBest,g:meta.goal,mk:meta.marks,bd:meta.badges,dy,o:meta.order||'smart',n:meta.name||''}}}
async function makeCode(){const raw=TE.encode(JSON.stringify(packState()));const z=await zip(raw,true).catch(()=>null);return z?'AP2Z-'+b64u(z):'AP2J-'+b64u(raw)}
async function readCode(code){code=code.trim().replace(/\s+/g,'');let o;
  if(code.startsWith('AP2Z-')){const u=await zip(unb64u(code.slice(5)),false);o=JSON.parse(TD.decode(u))}
  else if(code.startsWith('AP2J-'))o=JSON.parse(TD.decode(unb64u(code.slice(5))));
  else if(code.startsWith('{')){const j=JSON.parse(code);return {state:j.progress||{},meta:j.meta||{}}}
  else throw new Error('format');
  const st={};const rs=['red','yellow','green'];o.s.forEach(([id,r,sk,c,dd,u])=>{if(BYID[id])st[id]={rating:rs[r],streak:sk,count:c,due:o.d+dd,updated:u*60000}});
  const m=o.m||{};return {state:st,meta:{xp:m.xp||0,blitzBest:m.bb||0,goal:m.g,marks:m.mk||[],badges:m.bd||[],days:m.dy||{},order:m.o,name:m.n}}}
function mergeIn(inc){let n=0;for(const id in inc.state){const a=state[id],b=inc.state[id];if(!a||(b.updated||0)>(a.updated||0)){state[id]=b;n++}}
  const im=inc.meta||{};meta.xp=Math.max(meta.xp||0,im.xp||0);meta.blitzBest=Math.max(meta.blitzBest||0,im.blitzBest||0);
  for(const k in (im.days||{}))meta.days[k]=Math.max(meta.days[k]||0,im.days[k]);
  meta.marks=[...new Set([...(meta.marks||[]),...(im.marks||[])])];meta.badges=[...new Set([...(meta.badges||[]),...(im.badges||[])])];
  if(!meta.name&&im.name)meta.name=im.name;if(im.goal&&!Object.keys(state).length)meta.goal=im.goal;meta.lastBackup=Date.now();save();return n}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>true).catch(()=>legacyCopy(t));return Promise.resolve(legacyCopy(t))}
function legacyCopy(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
async function backupSheet(){const code=await makeCode();const n=Object.keys(state).length;
  const s=openSheet(`<h2>💾 Lernstand-Code</h2><p class="small muted">Dein kompletter Lernstand (${n} Karten, ${meta.xp} XP, Streak, Merkliste) als Text. Speichere ihn z. B. in der Notizen-App oder schick ihn dir selbst. Mit „Code einfügen“ holst du ihn auf jedem Gerät zurück – auch zwischen iPhone und Android.</p>
   <textarea id="bkCode" readonly style="width:100%;height:110px;border-radius:12px;background:#00000040;color:var(--muted);border:1px solid var(--line);padding:10px;font:12px/1.4 ui-monospace,monospace;user-select:text;-webkit-user-select:text">${code}</textarea>
   <div class="row" style="margin-top:10px"><button class="btn primary block" id="bkCopy">📋 Kopieren</button>${navigator.share?'<button class="btn block" id="bkShare">📤 Teilen</button>':''}</div>`);
  s.querySelector('#bkCopy').onclick=async()=>{const ok=await copyText(code);if(ok){meta.lastBackup=Date.now();save();toast('✅ Code kopiert – jetzt in Notizen einfügen')}else{const t=s.querySelector('#bkCode');t.focus();t.select();toast('Bitte den markierten Text manuell kopieren')}};
  const sh=s.querySelector('#bkShare');if(sh)sh.onclick=()=>navigator.share({title:'AP2 Lernstand',text:code}).then(()=>{meta.lastBackup=Date.now();save()}).catch(()=>{});
  s.querySelector('#bkCode').onclick=e=>e.target.select()}
function restoreSheet(){const s=openSheet(`<h2>📥 Lernstand-Code einfügen</h2><p class="small muted">Füge hier deinen gespeicherten Code ein. Er wird mit dem aktuellen Stand <b>zusammengeführt</b> – pro Karte gilt jeweils die neuere Bewertung, nichts geht verloren.</p>
   <textarea id="rsCode" placeholder="AP2Z-…" style="width:100%;height:120px;border-radius:12px;background:#00000040;color:var(--text);border:1px solid var(--line);padding:10px;font:12px/1.4 ui-monospace,monospace;user-select:text;-webkit-user-select:text"></textarea>
   <div class="row" style="margin-top:10px">${navigator.clipboard&&window.isSecureContext?'<button class="btn block" id="rsPaste">📋 Aus Zwischenablage</button>':''}<button class="btn primary block" id="rsGo">Übernehmen</button></div>`);
  const ta=s.querySelector('#rsCode');const p=s.querySelector('#rsPaste');if(p)p.onclick=async()=>{try{ta.value=await navigator.clipboard.readText()}catch(e){toast('Bitte lange ins Feld tippen → Einsetzen')}};
  s.querySelector('#rsGo').onclick=async()=>{try{const inc=await readCode(ta.value);const n=mergeIn(inc);closeSheet();confetti(80);toast(`✅ Lernstand übernommen (${n} Karten aktualisiert)`);if(cur==='home')renderHome();else if(cur==='more')renderSettings()}catch(e){toast('❌ Das ist kein gültiger Lernstand-Code')}}}
function backupDue(){return Object.keys(state).length>=15&&Date.now()-(meta.lastBackup||0)>6*86400000}

/* ---------- Start ---------- */
function fitFeed(){const h=$('#v-feed').clientHeight;if(h)document.documentElement.style.setProperty('--fh',h+'px')}addEventListener('resize',fitFeed);
setupFeedObs();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if(!location.hash)history.replaceState(null,'','#home');
show(location.hash.slice(1)||'home');
if(!meta.onb)setTimeout(()=>onboarding(0),300);
else if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone&&!sessionStorage.getItem('a2hs')){try{sessionStorage.setItem('a2hs','1')}catch(e){}setTimeout(()=>openSheet('<div class="onb"><div class="big">📲</div><h2>Als App installieren</h2><p class="muted">Tippe in Safari unten auf <b>Teilen</b> ⬆️ und dann auf <b>„Zum Home-Bildschirm“</b>. Dann startet der Lerntrainer im Vollbild und offline.</p><p class="small" style="color:var(--yel)">⚠️ Safari und die Home-Bildschirm-App haben getrennte Speicher. Hast du hier schon gelernt? Dann erst unter Mehr → Einstellungen einen <b>Lernstand-Code</b> erstellen und in der App einfügen.</p><button class="btn primary block" onclick="closeSheet()">Verstanden</button></div>',true),800)}
if('serviceWorker' in navigator&&location.protocol==='https:'){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('✅ App aktualisiert – dein Lernstand bleibt erhalten')});navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cur==='home')renderHome()});
</script>
