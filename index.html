e Funktionen, Klassen oder Module isoliert voneinander – funktioniert jede Einheit für sich korrekt? Meist automatisiert durch Entwickler.\n• Integrationstests: prüfen das Zusammenspiel mehrerer Komponenten und deren Schnittstellen – arbeiten sie korrekt zusammen und tauschen Daten richtig aus?\n• Funktionstests: prüfen, ob das System als Ganzes die funktionalen Anforderungen erfüllt – also das gewünschte Verhalten aus Anwendersicht (Black-Box).","nr":80,"cat":3},{"id":80,"question":"Was ist ein End-to-End-Test (E2E-Test) und welches Ziel wird mit seiner Durchführung verfolgt?","answer":"Ein E2E-Test prüft die gesamte Funktionalität einer Anwendung von Anfang bis Ende aus Sicht des Benutzers – über alle beteiligten Komponenten hinweg (Oberfläche, Backend, Datenbank, externe Dienste, Netzwerk).\nBeispiel Onlineshop: Anmelden → Artikel suchen → in den Warenkorb → bezahlen → Bestätigungs-Mail erhalten.\nZiel: sicherstellen, dass alle Systemkomponenten gemeinsam korrekt funktionieren und der gesamte Geschäftsablauf fehlerfrei ist. Oft automatisiert (z. B. Selenium, Playwright).","nr":81,"cat":3},{"id":81,"question":"Erläutern Sie die Methode des Blue-Green Deployments.","answer":"Bereitstellungsmethode mit zwei identischen Produktionsumgebungen („Blue“ und „Green“):\n• Die aktuelle Version läuft live auf Blue.\n• Die neue Version wird auf Green bereitgestellt und dort getestet.\n• Ist alles in Ordnung, wird der Datenverkehr (z. B. per Load Balancer/DNS) auf Green umgeschaltet – Green ist jetzt live.\n• Bei Problemen kann sofort auf Blue zurückgeschaltet werden (schnelles Rollback).\nVorteile: kaum Ausfallzeit, geringes Risiko. Nachteil: doppelte Infrastruktur nötig.","nr":82,"cat":3},{"id":82,"question":"Wofür steht die Abkürzung KVP im Qualitätsmanagement?","answer":"KVP = Kontinuierlicher Verbesserungsprozess.\nEin Ansatz zur permanenten, schrittweisen Verbesserung von Prozessen, Produkten und Dienstleistungen in einer Organisation – statt einmaliger großer Veränderungen viele kleine Verbesserungen.\nZiel: langfristig Effizienz und Qualität steigern, Fehler und Verschwendung reduzieren. Mitarbeitende werden aktiv eingebunden.\nDer KVP wird niemals beendet. Typisches Werkzeug: PDCA-Zyklus. Japanisches Vorbild: Kaizen.","nr":83,"cat":3},{"id":83,"question":"Erklären Sie den Unterschied zwischen den Begriffen Qualitätssicherung und Qualitätskontrolle.","answer":"• Qualitätssicherung (QS): proaktiver, vorbeugender Prozess. Sie zielt darauf ab, Fehler während der Entwicklung bzw. Produktion gar nicht erst entstehen zu lassen – durch definierte Prozesse, Standards, Richtlinien, Schulungen und Reviews. Ziel: Qualität vom Beginn an gewährleisten.\n• Qualitätskontrolle (QK): reaktiver Prozess, bei dem fertige Produkte oder Zwischenergebnisse nach der Herstellung auf Fehler geprüft werden – durch Tests und Inspektionen. Ziel: sicherstellen, dass das Endprodukt den Qualitätsstandards entspricht.","nr":84,"cat":3},{"id":84,"question":"Nennen und erklären Sie die vier Phasen des PDCA-Zyklus.","answer":"PDCA-Zyklus (Deming-Kreis) für kontinuierliche Verbesserung:\n• Plan: Ist-Zustand analysieren, Ziele festlegen und Maßnahmen zur Zielerreichung planen.\n• Do: Maßnahmen umsetzen – oft zunächst im kleinen Rahmen/Test; Daten und Informationen erfassen.\n• Check: Ergebnisse überprüfen und mit den Zielen vergleichen; Abweichungen und Ursachen analysieren.\n• Act: Bei Erfolg Maßnahmen als Standard einführen, sonst anpassen; Erkenntnisse fließen in den nächsten Zyklus ein.","nr":85,"cat":3},{"id":85,"question":"Was bedeutet es, wenn eine Software als barrierefrei bezeichnet wird?","answer":"Barrierefreie Software ist so gestaltet, dass sie von allen Menschen genutzt werden kann – einschließlich Menschen mit Behinderungen (z. B. Seh-, Hör-, motorischen oder kognitiven Einschränkungen).\nBeispiele:\n• Unterstützung von Screenreadern (Bildschirmleseprogrammen) für blinde Menschen\n• Untertitel und Transkriptionen für Gehörlose\n• vollständige Bedienung per Tastatur oder Spracherkennung statt Maus\n• ausreichende Kontraste, skalierbare Schrift, keine Information nur über Farbe\nGrundlagen: WCAG, BITV 2.0, Barrierefreiheitsstärkungsgesetz.","nr":86,"cat":3},{"id":86,"question":"Was versteht man unter Softwareergonomie und welche Prinzipien und Maßnahmen können angewendet werden, um die Benutzerfreundlichkeit von Softwareanwendungen zu verbessern?","answer":"Softwareergonomie bezieht sich auf die Gestaltung von Software, die auf die menschlichen Fähigkeiten und Bedürfnisse abgestimmt ist, um Benutzerfreundlichkeit, Effektivität und Effizienz zu maximieren.\nPrinzipien/Maßnahmen:\n• Nutzerzentrierung: mit Blick auf Bedürfnisse der Endnutzer gestalten\n• Einfachheit und Konsistenz: einheitliche, intuitive Benutzeroberflächen\n• klare und zeitnahe Rückmeldung an den Benutzer\n• Anpassbarkeit an individuelle Bedürfnisse\n• Fehlervermeidung und -behandlung: Design, das Fehler minimiert und bei der Behebung hilft\n• Lernförderlichkeit","nr":87,"cat":3},{"id":87,"question":"Nennen Sie in Bezug auf Softwareergonomie die Grundsätze der Dialoggestaltung.","answer":"Grundsätze der Dialoggestaltung nach DIN EN ISO 9241-110:\n• Aufgabenangemessenheit: unterstützt den Nutzer effizient bei seiner Aufgabe\n• Selbstbeschreibungsfähigkeit: jeder Schritt ist ohne Zusatzerklärung verständlich\n• Steuerbarkeit: Nutzer kann Ablauf, Richtung und Tempo selbst bestimmen\n• Erwartungskonformität: Software verhält sich wie erwartet, entspricht Konventionen\n• Fehlertoleranz: Fehler werden verhindert bzw. sind mit wenig Aufwand korrigierbar\n• Individualisierbarkeit: Anpassung an Bedürfnisse des Nutzers\n• Lernförderlichkeit: unterstützt beim Erlernen der Software\n(Seit 2020 zusätzlich: Benutzerbindung.)","nr":88,"cat":3},{"id":88,"question":"Was sind relationale Datenbanken? Nennen Sie zwei Beispiele für nicht-relationale Datenbanktypen.","answer":"Relationale Datenbanken basieren auf dem relationalen Datenmodell: Daten werden in Tabellen (Relationen) aus Zeilen (Datensätze) und Spalten (Attribute) gespeichert. Beziehungen zwischen Tabellen werden über Primär- und Fremdschlüssel hergestellt; Abfrage mit SQL. Beispiele: MySQL, PostgreSQL, MS SQL Server.\nNicht-relationale (NoSQL-)Datenbanktypen:\n• dokumentenorientierte DB (z. B. MongoDB)\n• Schlüssel-Wert-Datenbanken (z. B. Redis)\n• spaltenorientierte DB (z. B. Cassandra)\n• Graphdatenbanken (z. B. Neo4j)\n• Zeitreihendatenbanken, objektorientierte DB","nr":89,"cat":4},{"id":89,"question":"Welche Datentypen werden in SQL verwendet und welchen Zweck erfüllen sie?","answer":"Gängige SQL-Datentypen:\n• INTEGER (INT): Ganzzahlen, z. B. IDs, Mengen\n• FLOAT / DECIMAL: Gleitkomma- bzw. exakte Dezimalzahlen (DECIMAL für Geldbeträge)\n• VARCHAR(n) / CHAR(n): Zeichenketten variabler bzw. fester Länge\n• DATE, TIME, TIMESTAMP / DATETIME: Datum und Uhrzeit\n• BOOLEAN: Wahrheitswerte (true/false)\n• BINARY / BLOB: Binärdaten (z. B. Dateien)\nZweck: Jeder Datentyp legt Wertebereich, Speicherbedarf und erlaubte Operationen fest. Die richtige Wahl sichert die Datenintegrität (z. B. kein Text im Datumsfeld) und optimiert Speicher und Performance.","nr":90,"cat":4},{"id":90,"question":"Erklären Sie in Bezug auf Datenbanken die Begriffe Primärschlüssel und Fremdschlüssel.","answer":"• Primärschlüssel (Primary Key): Feld oder Kombination von Feldern, das jeden Datensatz einer Tabelle eindeutig identifiziert. Er darf keine Duplikate und keine Nullwerte (NULL) enthalten. Beispiel: Kundennummer.\n• Fremdschlüssel (Foreign Key): Feld in einer Tabelle, das auf den Primärschlüssel einer anderen (oder derselben) Tabelle verweist und so eine Beziehung zwischen Tabellen herstellt. Beispiel: Kundennummer in der Tabelle Bestellung.\nZweck: Beziehungen abbilden und mit referenzieller Integrität die Konsistenz der Daten sichern.","nr":91,"cat":4},{"id":91,"question":"Was ist referenzielle Integrität in Bezug auf Datenbanken?","answer":"Referenzielle Integrität sichert die Konsistenz von Beziehungen zwischen Tabellen: Jeder Fremdschlüsselwert muss auf einen tatsächlich existierenden Primärschlüsselwert in der referenzierten Tabelle verweisen (oder NULL sein).\nDas DBMS verhindert dadurch z. B.:\n• das Anlegen einer Bestellung für einen nicht existierenden Kunden\n• das Löschen eines Kunden, zu dem noch Bestellungen existieren (oder löscht diese per ON DELETE CASCADE mit)\nAuch Änderungen von Primärschlüsseln werden überwacht, damit keine „verwaisten“ Datensätze entstehen.","nr":92,"cat":4},{"id":92,"question":"Was sind Datenbankanomalien und welche Arten von Anomalien können auftreten?","answer":"Datenbankanomalien sind Probleme, die in einer schlecht strukturierten (nicht normalisierten) Datenbank durch Redundanz auftreten und zu Inkonsistenzen führen:\n• Einfügeanomalie: Daten können nicht eingefügt werden, ohne andere (noch nicht vorhandene) Daten mit einzutragen\n• Änderungsanomalie (Aktualisierungsanomalie): Eine Änderung muss an mehreren Stellen erfolgen; wird eine vergessen, entstehen widersprüchliche Daten\n• Löschanomalie: Beim Löschen eines Datensatzes gehen ungewollt weitere Informationen verloren\nVermeidung: Normalisierung (Aufteilen von Tabellen, Redundanz vermeiden) und klare Beziehungen.","nr":93,"cat":4},{"id":93,"question":"Beschreiben Sie die erste, zweite und dritte Normalform in relationalen Datenbanken.","answer":"• 1. Normalform (1NF): Jedes Attribut enthält nur atomare (unteilbare) Werte – keine Listen oder zusammengesetzten Werte in einem Feld (z. B. Adresse in Straße, PLZ, Ort aufteilen).\n• 2. Normalform (2NF): 1NF erfüllt und jedes Nicht-Schlüsselattribut ist voll funktional vom gesamten Primärschlüssel abhängig – nicht nur von einem Teil davon (relevant bei zusammengesetzten Schlüsseln). Sonst in eigene Tabelle auslagern.\n• 3. Normalform (3NF): 2NF erfüllt und keine transitiven Abhängigkeiten – Nicht-Schlüsselattribute dürfen nicht von anderen Nicht-Schlüsselattributen abhängen (z. B. Ort hängt von PLZ ab → auslagern).","nr":94,"cat":4},{"id":94,"question":"Welche Schritte sind notwendig, um Datenstrukturen in einem ER-Diagramm zu modellieren?","answer":"Ein Entity-Relationship-Diagramm wird zur Datenmodellierung so erstellt:\n1. Entitäten identifizieren: die Hauptobjekte bzw. Konzepte (z. B. Kunde, Bestellung, Artikel)\n2. Attribute bestimmen: Eigenschaften und Merkmale der Entitäten, inkl. Schlüsselattribut\n3. Beziehungen identifizieren: Verbindungen und Interaktionen zwischen den Entitäten (z. B. Kunde „gibt auf“ Bestellung)\n4. Kardinalitäten bestimmen: wie viele Instanzen einer Entität mit wie vielen der anderen in Beziehung stehen (1:1, 1:n, n:m)\nAnschließend: Überführung ins relationale Modell (Tabellen).","nr":95,"cat":4},{"id":95,"question":"Welche speziellen Anforderungen in Bezug auf die Beziehungen zwischen den einzelnen Entitätstypen sind bei der Ableitung von Datentabellen aus einem ER-Diagramm zu beachten?","answer":"Je nach Kardinalität:\n• 1:1-Beziehung: Ein Fremdschlüssel in einer der beiden Tabellen (oder Zusammenführen in eine Tabelle).\n• 1:n-Beziehung: Der Primärschlüssel der „1“-Seite wird als Fremdschlüssel in die Tabelle der „n“-Seite übernommen (z. B. KundenNr in Bestellung).\n• n:m-Beziehung: Lässt sich nicht direkt abbilden → zusätzliche Zwischentabelle (Verknüpfungs-/Beziehungstabelle) mit den Fremdschlüsseln beider Tabellen; diese bilden zusammen meist den Primärschlüssel (z. B. Bestellposition mit BestellNr + ArtikelNr).","nr":96,"cat":4},{"id":96,"question":"Wofür steht die Abkürzung ODBC?","answer":"ODBC = Open Database Connectivity.\nEine standardisierte, herstellerunabhängige Schnittstelle (API) für den Zugriff auf verschiedene Datenbankmanagementsysteme.\nAnwendungen können damit SQL-Abfragen ausführen, unabhängig vom verwendeten Datenbanktyp – der passende ODBC-Treiber übersetzt für das jeweilige DBMS (z. B. MySQL, MS SQL, Access).\nVorteil: Die Datenbank kann gewechselt werden, ohne die Anwendung neu zu programmieren. Java-Pendant: JDBC.","nr":97,"cat":4},{"id":97,"question":"Was ist der Unterschied zwischen einem Compiler und einem Interpreter?","answer":"• Compiler: übersetzt den gesamten Quellcode vor der Ausführung einmalig in Maschinencode (ausführbares Programm). Das Programm läuft danach schnell und ohne Compiler. Fehler werden beim Kompilieren gemeldet.\n• Interpreter: übersetzt den Quellcode zur Laufzeit Zeile für Zeile bzw. Anweisung für Anweisung und führt sie direkt aus. Langsamer, dafür plattformunabhängig und einfacher zu testen; Fehler treten erst beim Ausführen der betroffenen Zeile auf.\nMischformen: Java/C# (Bytecode + JIT-Compiler).","nr":98,"cat":4},{"id":98,"question":"Nennen Sie je ein Beispiel für eine Compiler- und eine Interpretersprache.","answer":"Compilersprachen (Quellcode wird vorab in Maschinencode übersetzt):\n• C\n• C++\n• Pascal\n• Go, Rust\nInterpretersprachen (Code wird zur Laufzeit Zeile für Zeile ausgeführt):\n• Python\n• Perl\n• PHP\n• JavaScript, BASIC, Bash-Skripte\nHinweis: Java und C# sind Mischformen – ein Compiler erzeugt Bytecode, der von einer virtuellen Maschine (JVM bzw. .NET CLR) ausgeführt und per JIT-Compiler übersetzt wird.","nr":99,"cat":4},{"id":99,"question":"Welche Vorteile bietet die Verwendung einer Versionsverwaltung in der Softwareentwicklung?","answer":"Eine Versionsverwaltung (z. B. Git, SVN) …\n• ermöglicht die Nachverfolgung aller Änderungen am Quellcode (wer, was, wann, warum)\n• erlaubt einfaches Zurücksetzen auf frühere Versionen, falls Fehler auftreten oder unerwünschte Änderungen vorgenommen wurden\n• ermöglicht die Zusammenarbeit mehrerer Entwickler an einem Projekt, da Änderungen zusammengeführt (Merge) werden können\n• erleichtert das Testen neuer Funktionen oder Experimente in separaten Branches, ohne das Hauptprojekt zu gefährden\n• dient als Backup und macht den Entwicklungsprozess transparent","nr":100,"cat":4},{"id":100,"question":"Was ist JSON und wo wird es verwendet?","answer":"JSON (JavaScript Object Notation) ist ein leichtgewichtiges, textbasiertes Datenformat zur Speicherung und Übertragung strukturierter Daten. Es ist für Menschen lesbar und für Maschinen leicht verarbeitbar.\nAufbau: Objekte in geschweiften Klammern aus Schlüssel-Wert-Paaren, Arrays in eckigen Klammern.\nBeispiel: {\"name\": \"Andreas Müller\", \"age\": 30, \"city\": \"Hamburg\"}\nVerwendung: Datenaustausch in Webanwendungen und bei APIs (REST), Konfigurationsdateien, NoSQL-Datenbanken (MongoDB).","nr":101,"cat":4},{"id":101,"question":"Was sind die Unterschiede zwischen den Datenformaten CSV und XML?","answer":"• CSV (Comma-Separated Values): einfaches textbasiertes Tabellenformat. Jede Zeile ist ein Datensatz, die Werte sind durch Trennzeichen (Komma, Semikolon) getrennt. Keine Hierarchie, keine Datentypen oder Strukturinformationen. Klein und leicht zu verarbeiten, z. B. für Excel-Exporte.\n• XML (Extensible Markup Language): Auszeichnungssprache, die Daten in hierarchischer Struktur mit selbst definierten Tags (<kunde><name>…</name></kunde>) speichert. Kann komplexe, verschachtelte Strukturen und Metadaten abbilden, per Schema validierbar; dafür umfangreicher (mehr Overhead).","nr":102,"cat":4},{"id":102,"question":"Der UML-Standard unterscheidet zwischen Strukturdiagrammen und Verhaltensdiagrammen. Nennen Sie jeweils zwei Beispiele aus diesen beiden Kategorien.","answer":"Strukturdiagramme (statischer Aufbau):\n• Klassendiagramm\n• Objektdiagramm\n• Komponentendiagramm\n• Paketdiagramm\n• Verteilungsdiagramm\n• Kompositionsstrukturdiagramm\nVerhaltensdiagramme (dynamische Abläufe):\n• Anwendungsfalldiagramm (Use Case)\n• Aktivitätsdiagramm\n• Sequenzdiagramm\n• Zustandsdiagramm\n• Kommunikationsdiagramm\n• Zeitdiagramm","nr":103,"cat":4},{"id":103,"question":"Wofür wird das UML-Aktivitätsdiagramm bei der Modellierung genutzt?","answer":"Ein UML-Aktivitätsdiagramm ist ein Verhaltensdiagramm, das die Reihenfolge und Bedingungen für die Ausführung verschiedener Aktivitäten in einem System bzw. Geschäftsprozess darstellt – ähnlich einem Flussdiagramm.\nEinsatz: Arbeitsabläufe und Algorithmen visualisieren, Geschäftsprozesse und Anwendungsfälle verstehen und analysieren, parallele Abläufe darstellen.\nElemente: Start- und Endknoten, Aktionen, Entscheidungs- und Zusammenführungsknoten (Raute), Gabelung/Vereinigung (Synchronisationsbalken), Swimlanes für Zuständigkeiten.","nr":104,"cat":4},{"id":104,"question":"Was stellt ein Sequenzdiagramm in UML dar und in welchen Szenarien wird es typischerweise verwendet?","answer":"Ein Sequenzdiagramm zeigt die Interaktionen zwischen Objekten in der Reihenfolge, in der sie auftreten – also den zeitlichen Ablauf von Nachrichten (Methodenaufrufen) zwischen Objekten.\nAufbau: Objekte stehen oben nebeneinander mit senkrechten Lebenslinien; die Zeit verläuft von oben nach unten; horizontale Pfeile sind Nachrichten (synchron, asynchron, Antworten).\nEinsatz: dynamisches Verhalten eines Anwendungsfalls darstellen, Abläufe zwischen Komponenten/Schnittstellen planen und analysieren (z. B. Login-Ablauf zwischen Client, Server und Datenbank).","nr":105,"cat":4},{"id":105,"question":"Welche Informationen kann man aus dem Klassendiagramm ableiten?","answer":"Ein Klassendiagramm zeigt die statische Struktur eines Systems:\n• Klassen und Objekte: welche Klassen gibt es?\n• Attribute und Operationen: welche Eigenschaften (inkl. Datentyp) und Methoden haben die Klassen?\n• Sichtbarkeit: public (+), private (−), protected (#)\n• Beziehungen: Assoziation, Aggregation, Komposition, Vererbung (Generalisierung)\n• Kardinalitäten (Multiplizitäten): wie viele Instanzen einer Klasse mit einer anderen in Beziehung stehen (z. B. 1..*)","nr":106,"cat":4},{"id":106,"question":"Was ist eine Klasse in der objektorientierten Programmierung?","answer":"Eine Klasse ist ein Bauplan bzw. eine Vorlage für die Erstellung von Objekten. Sie definiert:\n• Eigenschaften (Attribute/Variablen), die den Zustand beschreiben\n• Methoden (Funktionen), die das Verhalten beschreiben\nAus einer Klasse können beliebig viele Objekte (Instanzen) mit eigenen Attributwerten erzeugt werden.\nBeispiel: Klasse „Auto“ mit Attributen farbe, ps und Methoden fahren(), bremsen().\nKlassen ermöglichen Kapselung und bilden die Grundlage für Vererbung und Polymorphie.","nr":107,"cat":4},{"id":107,"question":"Was ist ein Objekt in der objektorientierten Programmierung?","answer":"Ein Objekt ist eine konkrete Instanz einer Klasse. Es besitzt die in der Klasse definierten Attribute und Methoden.\n• Jedes Objekt hat seinen eigenen Satz von Attributwerten (Zustand).\n• Die Methoden definieren, wie das Objekt sich verhält und mit anderen Objekten interagiert.\n• Jedes Objekt hat eine eigene Identität.\nBeispiel: Aus der Klasse „Auto“ entstehen die Objekte „roter Golf mit 110 PS“ und „blauer Polo mit 80 PS“.\nEin Objekt ist also eine Verkapselung von Daten (Zustand) und Operationen (Verhalten).","nr":108,"cat":4},{"id":108,"question":"In UML-Klassendiagrammen wird zwischen den Beziehungstypen Aggregation und Komposition unterschieden. Erläutern Sie den Unterschied.","answer":"Beide sind „Ganzes-Teil“-Beziehungen:\n• Aggregation (leere Raute ◇): lose Beziehung. Die Teile können auch unabhängig vom Ganzen existieren und gehören ggf. zu mehreren Ganzen. Wird das Ganze gelöscht, bleiben die Teile bestehen.\n  Beispiel: Mannschaft – Spieler.\n• Komposition (gefüllte Raute ◆): starke Beziehung. Die Teile sind existenzabhängig vom Ganzen und gehören genau zu einem Ganzen. Wird das Ganze zerstört, werden auch die Teile zerstört.\n  Beispiel: Haus – Raum, Rechnung – Rechnungsposition.","nr":109,"cat":4},{"id":109,"question":"Erklären Sie das Prinzip der Vererbung in der objektorientierten Programmierung.","answer":"Bei der Vererbung werden neue Klassen aus bereits bestehenden Klassen abgeleitet.\n• Die neue Klasse heißt Unterklasse (abgeleitete Klasse, Subklasse), die bestehende Oberklasse (Basisklasse, Superklasse).\n• Die Unterklasse übernimmt Attribute und Methoden der Oberklasse und kann diese erweitern oder überschreiben.\nBeispiel: Oberklasse „Fahrzeug“ → Unterklassen „Auto“ und „Motorrad“.\nVorteile: Wiederverwendung von Code, Vermeidung von Redundanz, bessere Wartbarkeit; Grundlage für Polymorphie. Im UML-Diagramm: Pfeil mit leerer Dreiecksspitze zur Oberklasse.","nr":110,"cat":4},{"id":110,"question":"In welchem Zusammenhang steht das Konzept der Datenkapselung in der objektorientierten Programmierung mit den Prinzipien der Datenintegrität und der Code-Wartbarkeit?","answer":"Datenkapselung bündelt Daten (Attribute) und Methoden in einer Klasse und schützt die Daten vor direktem Zugriff von außen: Attribute sind privat, Zugriff nur über öffentliche Methoden (Getter/Setter).\n• Datenintegrität: Die Daten können nur auf sichere und kontrollierte Weise geändert werden – Methoden können Werte prüfen (z. B. kein negatives Alter). So bleiben die Daten gültig und konsistent.\n• Wartbarkeit: Die interne Implementierung kann geändert werden, ohne dass andere Programmteile angepasst werden müssen, da diese nur die Schnittstelle nutzen. Das macht den Code verständlicher und leichter erweiterbar.","nr":111,"cat":4},{"id":111,"question":"Was ist der Unterschied zwischen Prozeduren und Funktionen in der Programmierung?","answer":"Beides sind benannte, wiederverwendbare Codeblöcke, die eine spezifische Aufgabe ausführen:\n• Funktion: gibt nach der Ausführung einen Wert an die aufrufende Stelle zurück (Rückgabewert, z. B. berechneSumme(a, b) → 5).\n• Prozedur: führt eine Aufgabe aus (z. B. Ausgabe, Daten speichern), gibt aber keinen Wert zurück; danach kehrt sie zur aufrufenden Stelle zurück.\nIn vielen Sprachen wird nicht streng unterschieden – z. B. ist eine Prozedur in Java/C eine Methode mit Rückgabetyp void.","nr":112,"cat":4},{"id":112,"question":"Wie unterscheiden sich prozedurale und objektorientierte Programmierung voneinander?","answer":"• Prozedurale Programmierung: Programm wird als Folge von Anweisungen bzw. Prozeduren/Funktionen aufgebaut, die auf Daten operieren. Daten und Funktionen sind getrennt. Top-down-Vorgehen. Beispiele: C, Pascal.\n• Objektorientierte Programmierung (OOP): Daten und zugehörige Methoden werden in Objekten zusammengefasst, die miteinander interagieren. Zentrale Prinzipien: Kapselung, Vererbung, Polymorphie (und Abstraktion). Bessere Wiederverwendbarkeit, Wartbarkeit und Modellierung realer Dinge. Beispiele: Java, C#, Python.","nr":113,"cat":4},{"id":113,"question":"Was ist eine REST-API (Representational State Transfer)?","answer":"Eine REST-API ist eine Programmierschnittstelle, die nach den Regeln und Konventionen des REST-Architekturstils für Webdienste aufgebaut ist.\n• Sie nutzt die Standard-HTTP-Methoden zur Interaktion mit Ressourcen: GET (lesen), POST (anlegen), PUT/PATCH (ändern), DELETE (löschen).\n• Ressourcen werden durch eindeutige URLs/URIs identifiziert (z. B. /api/kunden/42).\n• Sie ist zustandslos (stateless): Jede Anfrage enthält alle Informationen, die zur Bearbeitung nötig sind; der Server speichert keine Sitzungsdaten.\n• Daten meist im JSON-Format; Antworten mit HTTP-Statuscodes (200, 404 …).","nr":114,"cat":4},{"id":114,"question":"Was ist Künstliche Intelligenz (KI)?","answer":"Künstliche Intelligenz bezeichnet die Entwicklung von Computersystemen, die Aufgaben lösen können, die normalerweise menschliche Intelligenz erfordern – also menschenähnliche Denk- und Entscheidungsprozesse nachahmen.\nKI-Systeme können Informationen verarbeiten, verstehen, aus Daten lernen und Muster erkennen, Probleme lösen und Entscheidungen treffen.\nTeilbereiche: Machine Learning, Deep Learning (neuronale Netze), Sprachverarbeitung (z. B. Chatbots/LLMs), Bilderkennung.\nUnterscheidung: schwache KI (auf eine Aufgabe spezialisiert) vs. starke KI (allgemeine Intelligenz, bisher nicht erreicht).","nr":115,"cat":4},{"id":115,"question":"Was versteht man unter cyber-physischen Systemen?","answer":"Cyber-physische Systeme (CPS) verbinden physische Komponenten (Maschinen, Sensoren, Aktoren, Roboter) mit digitaler Steuerung und Kommunikation über Netzwerke/Internet.\n• Sensoren erfassen Daten aus der realen Umgebung.\n• Software verarbeitet sie und trifft Entscheidungen.\n• Aktoren greifen in Echtzeit in die physische Welt ein.\nBeispiele: Industrie 4.0 (vernetzte Produktionsanlagen), autonome Fahrzeuge, Smart Grid, Smart Home, medizinische Geräte.\nWichtige Basis des Internet of Things (IoT).","nr":116,"cat":4},{"id":116,"question":"Nennen Sie drei Dienstleistungsmodelle im Cloud-Computing.","answer":"• IaaS (Infrastructure as a Service): Bereitstellung virtueller IT-Infrastruktur – Server, Speicher, Netzwerk – über das Internet. Der Kunde verwaltet Betriebssystem und Anwendungen selbst. Beispiel: AWS EC2, Azure VMs.\n• PaaS (Platform as a Service): Bereitstellung einer Entwicklungs- und Laufzeitplattform; der Kunde kümmert sich nur um seine Anwendung. Beispiel: Google App Engine, Azure App Service.\n• SaaS (Software as a Service): fertige Anwendungen werden über das Internet bereitgestellt und genutzt, meist im Browser. Beispiel: Microsoft 365, Salesforce.\nMerksatz: Je weiter von IaaS zu SaaS, desto mehr übernimmt der Anbieter.","nr":117,"cat":4},{"id":219,"question":"Erklären Sie die Bedeutung des Dienstleistungsmodells „Everything-as-a-Service“ (XaaS) im Cloud-Computing.","answer":"„Everything-as-a-Service“ (XaaS) ist ein erweitertes Konzept, bei dem alle IT-Dienstleistungen über das Internet als Service bereitgestellt werden.\n• Es umfasst nicht nur die klassischen Modelle IaaS, PaaS und SaaS,\n• sondern z. B. auch Storage-, Desktop-, Backup-, Security- oder Database-as-a-Service.\n• Abgerechnet wird meist nutzungsabhängig (Pay-per-Use) bzw. im Abo.\nVorteil: Unternehmen müssen keine eigene Hardware und Software kaufen und betreiben, sondern beziehen flexibel genau die Leistung, die sie brauchen. Nachteil: Abhängigkeit vom Anbieter und von der Internetverbindung.","nr":118,"neu":1,"cat":4},{"id":117,"question":"Welche unterschiedlichen Bereitstellungsarten von Cloud-Diensten können unterschieden werden?","answer":"• Public Cloud: Cloud-Umgebung eines Anbieters, die für die breite Öffentlichkeit zugänglich ist; Ressourcen werden mit anderen Kunden geteilt (z. B. AWS, Azure). Günstig und skalierbar.\n• Private Cloud: Cloud-Umgebung exklusiv für ein einzelnes Unternehmen, im eigenen Rechenzentrum oder bei einem Dienstleister betrieben. Mehr Kontrolle und Datenschutz.\n• Hybrid Cloud: Kombination aus Public und Private Cloud; Daten und Anwendungen können zwischen beiden verschoben werden.\n• Community Cloud: von mehreren Organisationen mit gleichen Anforderungen gemeinsam genutzt (z. B. Behörden).","nr":119,"cat":4},{"id":118,"question":"Was bedeutet On-Premises?","answer":"On-Premises (auch „On-Prem“) bedeutet, dass Software, Server oder IT-Systeme direkt im eigenen Unternehmen bzw. Rechenzentrum betrieben werden – also nicht in der Cloud.\n• Vorteile: volle Kontrolle über Daten, Hardware und Sicherheit; Unabhängigkeit vom Internet und Anbieter; Datenschutz.\n• Nachteile: hohe Anschaffungskosten (Investitionen), eigener Aufwand für Betrieb, Wartung, Updates und Personal; weniger flexibel skalierbar.\nGegenteil: Cloud-Computing bzw. Off-Premises.","nr":120,"cat":4},{"id":119,"question":"Erklären Sie den Unterschied zwischen verlustfreier und verlustbehafteter Datenkompression.","answer":"• Verlustfreie Kompression: Daten werden so komprimiert, dass alle ursprünglichen Informationen erhalten bleiben – bei der Dekompression wird das Original exakt und bitgenau wiederhergestellt. Geringere Kompressionsrate. Beispiele: ZIP, PNG, FLAC; nötig für Programme, Texte, Datenbanken.\n• Verlustbehaftete Kompression: Einige (für Menschen kaum wahrnehmbare) Informationen werden entfernt. Deutlich höhere Kompressionsrate, aber die Originaldaten können nicht vollständig wiederhergestellt werden. Beispiele: JPEG, MP3, MP4/H.264 – für Bilder, Audio, Video.","nr":121,"cat":4},{"id":120,"question":"Beschreiben Sie den Unterschied zwischen einer Paketfilter-Firewall und einer Applikationsfilter-Firewall.","answer":"• Paketfilter-Firewall: arbeitet auf Schicht 3/4 des OSI-Modells. Sie prüft die Header-Informationen einzelner Pakete – Quell- und Ziel-IP, Ports, Protokoll – und entscheidet anhand vordefinierter Regeln (ACL), ob ein Paket durchgelassen oder blockiert wird. Den Inhalt sieht sie nicht. Schnell und einfach.\n• Applikationsfilter-Firewall (Application-Level-Gateway/Proxy): arbeitet auf der Anwendungsschicht (7). Sie versteht die Anwendungsprotokolle (HTTP, FTP, SMTP …), kann den Inhalt des Datenverkehrs analysieren und spezifische Angriffsmuster, verdächtige Aktivitäten oder unerwünschte Inhalte erkennen und blockieren. Sicherer, aber langsamer.","nr":122,"cat":5},{"id":121,"question":"Was ist eine Next-Generation Firewall (NGFW)?","answer":"Eine NGFW ist eine fortschrittliche Firewall, die über die Funktionen herkömmlicher Firewalls (Paketfilter, Stateful Inspection) hinausgeht und mehrere Sicherheitsfunktionen kombiniert:\n• Deep Packet Inspection und Anwendungserkennung (welche App erzeugt den Verkehr?)\n• integriertes Intrusion Detection/Prevention System (IDS/IPS)\n• Content-Filtering (URL-Filter), Anwendungssteuerung\n• Bedrohungserkennung, ggf. Malware-Sandboxing und SSL/TLS-Inspection\n• benutzerbasierte Regeln (Anbindung an Verzeichnisdienste)\nErgebnis: umfassende Sicherheitskontrolle und Bedrohungserkennung in einem Gerät.","nr":123,"cat":5},{"id":122,"question":"Was ist unter IDS in Bezug auf Netzwerksicherheit zu verstehen?","answer":"Ein IDS (Intrusion Detection System) überwacht den Netzwerkverkehr bzw. Systemaktivitäten, um verdächtige Aktivitäten, Angriffsmuster und potenzielle Sicherheitsverletzungen zu erkennen.\nFunktionsweise: Es analysiert den Datenverkehr, vergleicht ihn mit bekannten Angriffsmustern (Signaturen) oder erkennt Abweichungen vom Normalverhalten (Anomalien).\nBei einem Verdacht erzeugt es Warnmeldungen bzw. Alarme für Administratoren. Es greift aber nicht aktiv ein (passiv).\nVarianten: NIDS (Netzwerk) und HIDS (Host).","nr":124,"cat":5},{"id":123,"question":"Was bedeutet Deep Packet Inspection (DPI)?","answer":"DPI ist eine Technologie, bei der der Netzwerkverkehr auf tiefer Ebene analysiert wird: Neben den Header-Informationen (IP, Ports) wird auch der Inhalt (Nutzdaten/Payload) der Pakete untersucht.\nMöglichkeiten:\n• Anwendungen und Protokolle erkennen\n• Viren, Malware und Angriffsmuster aufspüren\n• Datenverkehr kontrollieren, filtern und priorisieren\n• Einhaltung von Richtlinien durchsetzen\nEinsatz in NGFW und IPS. Kritisch: Datenschutz, und verschlüsselter Verkehr kann nur mit TLS-Inspection geprüft werden.","nr":125,"cat":5},{"id":124,"question":"Worin unterscheidet sich ein Intrusion Prevention System (IPS) von einem Intrusion Detection System (IDS)?","answer":"• IDS (Intrusion Detection System): erkennt verdächtige Aktivitäten und Angriffe und meldet sie (Alarm, Log). Passiv – es greift nicht in den Datenverkehr ein; meist an einem Spiegelport angeschlossen.\n• IPS (Intrusion Prevention System): bietet eine proaktive Verteidigung. Es überwacht ebenfalls den Netzwerkverkehr, erkennt Anomalien und Angriffsmuster, ergreift aber automatisch Gegenmaßnahmen: verdächtige Pakete verwerfen, Verbindungen blockieren oder umleiten. Es sitzt inline im Datenstrom.\nNachteil IPS: Fehlalarme (False Positives) können legitimen Verkehr blockieren.","nr":126,"cat":5},{"id":125,"question":"Was ist Stateful Packet Inspection (SPI) und wie funktioniert es?","answer":"SPI ist eine Firewall-Technologie, die den Zustand (State) von Netzwerkverbindungen verfolgt.\nIm Gegensatz zu einfachen Paketfiltern, die jedes Paket einzeln bewerten, führt SPI eine Zustandstabelle über alle aktiven Verbindungen (z. B. TCP-Handshake, Quell-/Ziel-IP, Ports, Sequenznummern).\nSo kann die Firewall erkennen, ob ein eingehendes Paket zu einer bestehenden, erlaubten Verbindung gehört (z. B. Antwort auf eine eigene Anfrage). Pakete, die zu keiner etablierten Verbindung passen, werden blockiert.\nVorteil: mehr Sicherheit, einfachere Regeln (Rückverkehr muss nicht extra freigegeben werden).","nr":127,"cat":5},{"id":126,"question":"Was besagt das Zero-Trust-Prinzip?","answer":"Zero Trust basiert auf der Annahme, dass niemandem und nichts automatisch vertraut wird – weder innerhalb noch außerhalb des Netzwerks. Jede Zugriffsanfrage wird stets überprüft und verifiziert, bevor Zugriff gewährt wird.\nKernpunkte:\n• „Vertraue niemandem, überprüfe alles“ (Never trust, always verify)\n• strenge Authentifizierung (z. B. MFA) und Autorisierung bei jedem Zugriff\n• Minimierung von Zugriffsrechten (Least Privilege)\n• Mikrosegmentierung des Netzwerks\n• kontinuierliche Überwachung und Kontrolle\nGegensatz zum klassischen Perimeter-Modell („innen = vertrauenswürdig“).","nr":128,"cat":5},{"id":127,"question":"Was ist eine DMZ (Demilitarisierte Zone) in Bezug auf Netzwerksicherheit?","answer":"Eine DMZ ist ein isolierter Netzwerkbereich zwischen dem internen Netzwerk (LAN) und dem externen Netzwerk (Internet), abgesichert durch eine oder zwei Firewalls.\nZweck: Öffentlich zugängliche Dienste (Webserver, Mailserver, FTP-Server) werden in der DMZ platziert. Sie sind aus dem Internet erreichbar, aber vom internen Netz getrennt.\nWird ein Server in der DMZ kompromittiert, hat der Angreifer trotzdem keinen direkten Zugriff auf das interne Netzwerk – die DMZ dient als zusätzliche Sicherheitsebene.","nr":129,"cat":5},{"id":128,"question":"Was ist ein Penetrationstest und wie wird er durchgeführt?","answer":"Ein Penetrationstest ist ein proaktiver, autorisierter Sicherheitstest, bei dem ein System, Netzwerk oder eine Anwendung gezielt angegriffen wird, um Schwachstellen und Sicherheitslücken zu identifizieren, bevor echte Angreifer sie ausnutzen. Potenzielle Angriffsszenarien werden simuliert.\nAblauf in Phasen:\n1. Informationsbeschaffung (Reconnaissance)\n2. Aufdeckung von Schwachstellen (Scanning)\n3. Ausnutzung der Schwachstellen (Exploitation)\n4. Ergebnisanalyse\n5. Berichterstattung mit Empfehlungen\nWichtig: nur mit schriftlicher Genehmigung und festgelegtem Umfang.","nr":130,"cat":5},{"id":129,"question":"Welche Aspekte werden bei einem Device Security Check überprüft?","answer":"Ein Device Security Check überprüft die Sicherheitsmaßnahmen und -einstellungen eines Geräts, um Schwachstellen zu finden und die Sicherheit zu verbessern. Geprüft werden in der Regel:\n• Betriebssystem und Firmware (aktuelle Patches?)\n• Benutzerkonten und Zugriffsrechte\n• Netzwerkkonfiguration (offene Ports, Firewall)\n• Anwendungen und Dienste\n• physische Sicherheit\n• Verschlüsselung\nNach Abschluss werden Ergebnisse und Empfehlungen zur Verbesserung der Gerätesicherheit dokumentiert.","nr":131,"cat":5},{"id":130,"question":"Wofür steht die Abkürzung RADIUS in der Netzwerktechnik?","answer":"RADIUS = Remote Authentication Dial-In User Service.\nEin Client-Server-Protokoll zur zentralen Authentifizierung, Autorisierung und Abrechnung (AAA) von Netzwerkzugriffen.\nEinsatz: WLAN mit WPA2/WPA3-Enterprise, 802.1X am Switchport (LAN), VPN-Zugänge.\nAblauf: Der Netzwerkzugangspunkt (Switch, Access Point = RADIUS-Client) leitet die Anmeldedaten an den RADIUS-Server weiter; dieser prüft sie (z. B. gegen LDAP/Active Directory) und erlaubt oder verweigert den Zugang.\nPorts: UDP 1812 (Authentifizierung), 1813 (Accounting).","nr":132,"cat":5},{"id":131,"question":"Im Zusammenhang mit RADIUS wird auch oft von RADIUS (AAA) gesprochen. Wofür stehen die drei A in der Abkürzung? Erläutern Sie diese drei Komponenten.","answer":"• Authentifizierung (Authentication): RADIUS verifiziert die Identität von Benutzern, bevor sie Zugang zum Netzwerk erhalten – durch Prüfung von Benutzername und Passwort, Zertifikat etc. Frage: „Wer bist du?“\n• Autorisierung (Authorization): Nachdem ein Benutzer authentifiziert wurde, legt RADIUS fest, welche Ressourcen er nutzen darf und welche Dienste ihm zustehen – z. B. VLAN-Zuweisung oder Zugriffsbeschränkungen. Frage: „Was darfst du?“\n• Accounting (Abrechnung): RADIUS protokolliert die Aktivitäten der Benutzer – wann sie verbunden waren, wie lange, welche Datenmenge übertragen wurde. Frage: „Was hast du gemacht?“","nr":133,"cat":5},{"id":132,"question":"Welche Bedeutung hat die Berechtigungsstruktur AGDLP (RBAC)?","answer":"AGDLP steht für Account, Global, Domain Local, Permission – eine Methode zur Vergabe von Berechtigungen in einem Role Based Access Control (RBAC) System, v. a. im Active Directory.\nPrinzip: Berechtigungen werden nicht einzelnen Benutzern zugewiesen, sondern Rollen bzw. Gruppen:\n• Accounts (Benutzerkonten) kommen in Globale Gruppen (Rollen, z. B. „Vertrieb“)\n• Globale Gruppen kommen in Domänenlokale Gruppen (Ressourcenzugriff, z. B. „Vertrieb-Ordner-Lesen“)\n• Die Domänenlokalen Gruppen erhalten die Permissions (Berechtigungen) auf die Ressource\nVorteil: übersichtliche, skalierbare und leicht änderbare Rechteverwaltung.","nr":134,"cat":5},{"id":133,"question":"Erklären Sie die Umsetzung des AGDLP-Prinzips in Windows-Umgebungen.","answer":"Umsetzung im Active Directory:\n1. Account: Für jeden Mitarbeiter wird ein Benutzerkonto angelegt.\n2. Global: Benutzer erhalten Mitgliedschaft in einer globalen Gruppe, die ihre Rolle/Abteilung abbildet (z. B. GG_Buchhaltung).\n3. Domain Local: Globale Gruppen werden in domänenlokale Gruppen aufgenommen, die für eine Ressource und Zugriffsart stehen (z. B. DL_Finanzen_Ändern).\n4. Permission: Die Zugriffsrechte (NTFS-/Freigabeberechtigungen) auf Ressourcen werden ausschließlich den domänenlokalen Gruppen zugewiesen.\nWechselt jemand die Abteilung, ändert man nur die Gruppenmitgliedschaft.","nr":135,"cat":5},{"id":134,"question":"Was versteht man unter dem Least-Privilege-Prinzip?","answer":"Das Least-Privilege-Prinzip (Prinzip der minimalen Rechte) besagt, dass jeder Benutzer, jedes Programm oder System nur die minimal notwendigen Zugriffsrechte erhält, die es für seine Aufgaben braucht – und nur so lange wie nötig.\nZiele:\n• Kontrolle und Nachvollziehbarkeit von Zugriffen\n• Erhöhung der Systemsicherheit, kleinere Angriffsfläche\n• Begrenzung von Schäden bei Fehlern oder Angriffen (z. B. kann Malware mit Benutzerrechten weniger anrichten)\nBeispiel: Administratoren arbeiten im Alltag mit normalem Benutzerkonto.","nr":136,"cat":5},{"id":135,"question":"Welche Funktion erfüllt LDAP in einer Verzeichnisstruktur?","answer":"LDAP (Lightweight Directory Access Protocol) ist ein standardisiertes Protokoll für den Zugriff auf Verzeichnisdienste, in denen Informationen über Benutzer, Gruppen, Computer, Ressourcen und Berechtigungen hierarchisch gespeichert sind.\nLDAP dient als Kommunikationsprotokoll zwischen LDAP-Client und LDAP-Server: Der Client kann Suchanfragen durchführen, Daten lesen, hinzufügen, ändern und löschen sowie Benutzer authentifizieren.\nBeispiele: Active Directory, OpenLDAP, FreeIPA.\nPorts: 389 (LDAP), 636 (LDAPS, verschlüsselt).","nr":137,"cat":5},{"id":136,"question":"Was ist das Domänenkonzept in der Netzwerkarchitektur?","answer":"Das Domänenkonzept ist ein grundlegendes Prinzip der zentralen Netzwerkverwaltung: Ein Netzwerk wird in logische Gruppen (Domänen) eingeteilt, in denen Benutzer, Computer, Ressourcen und Sicherheitseinstellungen zentral organisiert und verwaltet werden.\n• Ein Domänencontroller (z. B. Active Directory) speichert alle Konten und Richtlinien.\n• Benutzer melden sich einmal an der Domäne an und erhalten Zugriff auf freigegebene Ressourcen (Single Sign-On).\n• Gruppenrichtlinien (GPO) werden zentral auf alle Rechner verteilt.\nVorteile: zentrale Verwaltung, Skalierbarkeit, Sicherheit, Zusammenarbeit.","nr":138,"cat":5},{"id":137,"question":"Was sind ACLs (Access Control Lists)?","answer":"ACLs sind Zugriffskontrolllisten, die den Zugriff auf Ressourcen in einem Computersystem oder Netzwerk steuern.\nEine ACL enthält eine Liste von Einträgen (ACEs), die festlegen, welche Benutzer oder Gruppen welche Berechtigungen auf eine Ressource haben (z. B. Lesen, Schreiben, Ausführen). Bei jedem Zugriff prüft das System die ACL und gewährt oder verweigert den Zugriff.\nEinsatzbereiche:\n• Dateisysteme (z. B. NTFS-Berechtigungen)\n• Netzwerkgeräte: Router-/Firewall-ACLs filtern Pakete nach IP, Port, Protokoll (permit/deny, Abarbeitung von oben nach unten, implizites deny am Ende)","nr":139,"cat":5},{"id":138,"question":"Erklären Sie das Authentifizierungsverfahren „Single Sign-On“ (SSO).","answer":"SSO ist ein Authentifizierungsverfahren, bei dem sich ein Benutzer nur einmal anmeldet und danach Zugriff auf mehrere Anwendungen oder Systeme erhält, ohne sich erneut anmelden zu müssen.\nFunktionsweise: Nach erfolgreicher Anmeldung bei einem zentralen Identity Provider (IdP) erhält der Benutzer ein Token bzw. Ticket. Die angeschlossenen Anwendungen (Service Provider) vertrauen dem IdP und akzeptieren dieses Token als Identitätsnachweis.\nTechniken: Kerberos (Windows-Domäne), SAML, OpenID Connect.","nr":140,"cat":5},{"id":139,"question":"Welche Grundidee liegt der Multi-Faktor-Authentifizierung (MFA) zugrunde?","answer":"MFA beruht auf dem Prinzip, dass die Identität eines Benutzers durch mindestens zwei unabhängige Faktoren aus verschiedenen Kategorien nachgewiesen wird:\n• Wissen: etwas, das der Benutzer weiß – Passwort, PIN, Sicherheitsfrage\n• Besitz: etwas, das der Benutzer besitzt – Smartphone (App/SMS-Code), Hardware-Token, Chipkarte\n• Inhärenz (Sein): etwas, das der Benutzer ist – Fingerabdruck, Gesichtserkennung\nWird ein Faktor kompromittiert (z. B. Passwort gestohlen), reicht er allein nicht für den Zugriff. Wichtig: zwei Passwörter = nur ein Faktor (Wissen).","nr":141,"cat":5},{"id":140,"question":"Was ist ein Pre-Shared Key (PSK) und wo wird er verwendet?","answer":"Ein Pre-Shared Key ist ein vorab vereinbarter geheimer Schlüssel, der den Kommunikationspartnern bereits vor der Verbindung bekannt ist. Er wird zur Authentifizierung und zum sicheren Zugriff verwendet.\nEinsatz:\n• WLAN mit WPA2/WPA3-Personal: alle Geräte nutzen dasselbe WLAN-Passwort\n• VPNs (z. B. IPsec Site-to-Site): Client und Server bzw. beide Gateways authentifizieren sich gegenseitig mit dem PSK\nNachteil: Der Schlüssel muss sicher verteilt werden, und alle Nutzer teilen ihn – wird er bekannt, muss er überall geändert werden. Alternative: Zertifikate bzw. 802.1X/RADIUS.","nr":142,"cat":5},{"id":141,"question":"Beschreiben Sie den Aufbau einer IPv4- und einer IPv6-Adresse.","answer":"IPv4:\n• 32 Bit, aufgeteilt in vier Oktette zu je 8 Bit\n• Darstellung dezimal, durch Punkte getrennt; jedes Oktett 0–255 (z. B. 192.168.1.10)\n• besteht aus Netz- und Hostanteil (festgelegt durch die Subnetzmaske)\n• ca. 4,3 Mrd. Adressen\nIPv6:\n• 128 Bit, acht Blöcke zu je 16 Bit\n• Darstellung hexadezimal, durch Doppelpunkte getrennt (z. B. 2001:0db8:0000:0000:0000:ff00:0042:8329)\n• Kürzungen: führende Nullen weglassen, einmal aufeinanderfolgende Nullblöcke durch :: ersetzen → 2001:db8::ff00:42:8329\n• Aufbau: Präfix (Standortpräfix + Subnetz-ID) und 64-Bit-Interface-ID","nr":143,"cat":6},{"id":220,"question":"Was ist die CIDR-Notation in der Netzwerktechnik?","answer":"Die CIDR-Notation (Classless Inter-Domain Routing) ist eine Schreibweise, um eine IP-Adresse inklusive Subnetzmaske kompakt darzustellen. Sie besteht aus der IP-Adresse und einem Schrägstrich mit einer Zahl, z. B. 192.168.1.0/24.\n• Der Wert nach dem Slash (Präfixlänge) gibt an, wie viele Bits für die Netzwerkkennung verwendet werden.\n• /24 = 255.255.255.0 → 32 − 24 = 8 Host-Bits → 2⁸ − 2 = 254 nutzbare Hostadressen\n• /26 = 255.255.255.192 → 6 Host-Bits → 62 Hosts\nCIDR ermöglicht eine klassenlose, flexible Netzaufteilung (Subnetting) statt der alten festen Klassen A/B/C und fasst Routen zusammen (Supernetting).","nr":144,"neu":1,"cat":6},{"id":142,"question":"Welche IP-Adresse repräsentiert die Adresse „127.0.0.1“ und was ist ihre Bedeutung?","answer":"127.0.0.1 ist die Loopback-Adresse des IPv4-Protokolls, auch „localhost“ genannt. Diese IP-Adresse ist ein Standard-Adressraum für Loopback- bzw. lokale Host-Kommunikation – der Computer kommuniziert mit sich selbst.\nPakete an diese Adresse verlassen das Gerät nie; sie werden nicht über die Netzwerkkarte gesendet.\nNutzen: den Netzwerk-Stack eines Systems testen (ping 127.0.0.1) und lokale Dienste ansprechen (z. B. Webserver bei der Entwicklung).\nGanzer reservierter Bereich: 127.0.0.0/8. IPv6-Pendant: ::1.","nr":145,"cat":6},{"id":221,"question":"Welche Aufgabe hat die Broadcast-Adresse in einem IP-Netzwerk?","answer":"Die Broadcast-Adresse in einem IP-Netzwerk wird verwendet, um eine Nachricht gleichzeitig an alle Geräte innerhalb eines Netzes zu senden.\n• Es ist die letzte Adresse eines Netzes: Alle Host-Bits sind 1 (z. B. 192.168.1.255 bei 192.168.1.0/24). Sie kann keinem Gerät zugewiesen werden.\n• 255.255.255.255 ist der limitierte Broadcast (nur im eigenen Segment).\n• Genutzt u. a. von ARP-Anfragen und DHCP-Discover.\n• Router leiten Broadcasts nicht weiter – sie begrenzen die Broadcastdomäne.\nIPv6 kennt keinen Broadcast, dort wird Multicast verwendet.","nr":146,"neu":1,"cat":6},{"id":143,"question":"Nennen Sie die Ports für die folgenden Protokolle: HTTP, HTTPS, SMTP, POP3, IMAP, FTP, SFTP.","answer":"• HTTP: Port 80\n• HTTPS: Port 443\n• SMTP: Port 25 (Submission mit Auth: 587; SMTPS: 465)\n• POP3: Port 110 (POP3S: 995)\n• IMAP: Port 143 (IMAPS: 993)\n• FTP: Port 21 (Steuerung), 20 (Daten im aktiven Modus)\n• SFTP: Port 22 (läuft über SSH)\nWeitere wichtige: DNS 53, DHCP 67/68, SSH 22, Telnet 23, RDP 3389, LDAP 389/LDAPS 636.","nr":147,"cat":6},{"id":144,"question":"Erläutern Sie die Rückgabewerte, welche ein „ping“ auf eine IP-Adresse ohne weitere Parameter liefert.","answer":"Typische Rückgabewerte von ping:\n• gesendete Pakete: Anzahl der gesendeten Ping-Anfragen (Windows standardmäßig 4)\n• empfangene Pakete: Anzahl der erhaltenen Antworten (Echo Replies)\n• verlorene Pakete: Anzahl und Prozentsatz der unbeantworteten Pakete\n• Latenzzeit (Antwortzeit): Zeit in ms für Hin- und Rückweg (Round-Trip-Time) – minimal, maximal und Durchschnitt\n• TTL (Time to Live): Restwert im Paket; begrenzt die Anzahl der Netzwerk-Hops, bevor ein Paket verworfen wird – lässt Rückschlüsse auf Entfernung und Betriebssystem zu\nGrundlage: ICMP Echo Request / Echo Reply.","nr":148,"cat":6},{"id":145,"question":"Erläutern Sie die Bedeutung der Abkürzungen NAT und PAT.","answer":"• NAT (Network Address Translation): ändert IP-Adressen von Paketen, wenn sie zwischen Netzwerken übertragen werden – meist werden private IP-Adressen in öffentliche umgesetzt und umgekehrt. Ermöglicht die Nutzung privater Adressen und spart öffentliche IPv4-Adressen.\n• PAT (Port Address Translation, auch NAT-Overload/Masquerading): spezielle Form von NAT, bei der mehrere Geräte mit privaten Adressen über dieselbe öffentliche IP-Adresse kommunizieren. Unterschieden werden die Verbindungen anhand unterschiedlicher Portnummern. Standard in jedem Heimrouter.","nr":149,"cat":6},{"id":146,"question":"Erklären Sie die Funktion des Standortpräfixes, der Teilnetz-ID und der Interface-ID einer IPv6-Adresse.","answer":"Eine (globale) IPv6-Adresse ist dreigeteilt:\n• Standortpräfix (globales Routing-Präfix, meist 48 Bit): identifiziert das Netzwerk bzw. den Standort einer Organisation; wird vom Internetdienstanbieter (ISP) zugewiesen.\n• Teilnetz-ID (Subnetz-ID, meist 16 Bit): unterteilt das Netz einer Organisation in Subnetze; wird von den Administratoren intern vergeben (bis zu 65.536 Subnetze bei /48).\n• Interface-ID (64 Bit): identifiziert ein bestimmtes Gerät bzw. eine Schnittstelle im Subnetz; wird automatisch (SLAAC, EUI-64 aus MAC oder zufällig) oder manuell vergeben.","nr":150,"cat":6},{"id":147,"question":"Nennen Sie drei Vorteile vom Protokoll IPv6 gegenüber dem Protokoll IPv4.","answer":"• Größerer Adressraum: 128 statt 32 Bit (ca. 3,4 × 10³⁸ Adressen) – kein Adressmangel, NAT nicht mehr nötig\n• Automatische Adresskonfiguration (SLAAC) ohne DHCP-Server\n• Verbesserte Sicherheit: IPsec ist fester Bestandteil des Standards\n• Unterstützung für Quality of Service (Flow Label)\n• Vereinfachtes, effizienteres Routing: schlankerer Header mit fester Länge, keine Fragmentierung durch Router, hierarchische Adressierung\n• Multicast statt Broadcast","nr":151,"cat":6},{"id":148,"question":"Was ist SLAAC und wie hilft es bei der automatischen IPv6-Adressvergabe?","answer":"SLAAC (Stateless Address Autoconfiguration) ist ein Verfahren im IPv6-Netz, bei dem Geräte ohne DHCP-Server automatisch eine eigene IP-Adresse erhalten.\nAblauf:\n• Ein IPv6-Router sendet regelmäßig Router Advertisements (RA) mit dem Netzwerkpräfix ins Netz (bzw. auf Anfrage per Router Solicitation).\n• Das Gerät erzeugt daraus selbstständig seine IPv6-Adresse: Präfix + eigene Interface-ID (aus MAC-Adresse per EUI-64 oder zufällig für Privacy).\n• Per Duplicate Address Detection wird geprüft, ob die Adresse eindeutig ist.\n„Stateless“, weil kein Server die Vergaben speichert.","nr":152,"cat":6},{"id":149,"question":"Was ist der Unterschied zwischen den Protokollen TCP (Transmission Control Protocol) und UDP (User Datagram Protocol)?","answer":"Beides sind Transportprotokolle (OSI-Schicht 4):\n• TCP: verbindungsorientiert – vor der Übertragung wird eine Verbindung aufgebaut (3-Way-Handshake). Gewährleistet zuverlässige Übertragung: Bestätigungen (ACK), Reihenfolge, Neuübertragung verlorener Pakete, Fluss- und Überlastkontrolle. Dafür mehr Overhead und langsamer. Einsatz: HTTP(S), E-Mail, FTP.\n• UDP: verbindungslos – keine Bestätigung, keine Garantie für Zustellung oder Reihenfolge. Dafür schnell mit geringem Overhead. Einsatz: Echtzeitanwendungen, bei denen geringe Latenz wichtiger ist als vollständige Übertragung – VoIP, Videostreaming, Online-Gaming, DNS.","nr":153,"cat":6},{"id":222,"question":"Was versteht man unter Dual-Stack bei der Internetanbindung?","answer":"Dual-Stack bezeichnet den gleichzeitigen Betrieb von IPv4 und IPv6 auf einem System oder in einem Netzwerk.\nFunktionsweise:\n• Geräte erhalten eine IPv4- und eine IPv6-Adresse.\n• Die Kommunikation erfolgt je nach Ziel entweder über IPv4 oder IPv6 (meist wird IPv6 bevorzugt, wenn das Ziel es unterstützt).\nVorteile: sanfter Übergang zu IPv6, alle Ziele bleiben erreichbar.\nNachteile: doppelter Aufwand bei Konfiguration, Betrieb und Sicherheit (z. B. zwei Firewall-Regelwerke); IPv4-Adressknappheit bleibt bestehen.\nAbgrenzung: „DS-Lite“ = nur echte IPv6-Adresse, IPv4 wird über einen Tunnel beim Provider geführt.","nr":154,"neu":1,"cat":6},{"id":150,"question":"Was sind die Unterschiede und Gemeinsamkeiten zwischen Baum- und Sterntopologie in Computernetzwerken?","answer":"• Sterntopologie: Alle Knoten sind an einen zentralen Knotenpunkt (Switch) angeschlossen; dieser leitet die Kommunikation an die jeweiligen Zielknoten weiter. Vorteil: Ausfall eines Endgeräts beeinträchtigt die anderen nicht, leicht erweiterbar. Nachteil: Die gesamte Netzleistung hängt stark vom zentralen Knoten ab (Single Point of Failure).\n• Baumtopologie: erweiterte Form der Sterntopologie – mehrere Sterne werden hierarchisch über weitere Verteiler miteinander verbunden (Wurzel → Äste). Gut skalierbar für große Netze, aber fällt ein Verteiler aus, ist der ganze Ast betroffen.\nGemeinsam: zentrale Verteiler, einfache Fehlersuche; typisch für strukturierte Verkabelung.","nr":155,"cat":6},{"id":151,"question":"Was ist eine vermaschte Netzwerktopologie und welche Vor- und Nachteile hat sie?","answer":"In einer vermaschten Topologie ist jeder Knoten mit einem oder mehreren anderen Knoten verbunden, sodass es mehrere Wege zwischen den Knoten gibt. Vollvermascht: jeder mit jedem – n·(n − 1)/2 Verbindungen.\nVorteile:\n• Redundanz und hohe Ausfallsicherheit: Fällt eine Verbindung aus, wird über einen anderen Pfad umgeleitet\n• hohe Leistung, Lastverteilung über mehrere Pfade\nNachteile:\n• hohe Komplexität und Kosten (viele Leitungen/Ports)\n• schwierige Konfiguration und Verwaltung, Routing nötig\nEinsatz: Internet-Backbone, WAN-Verbindungen, WLAN-Mesh.","nr":156,"cat":6},{"id":152,"question":"Erläutern Sie, wofür das Spanning Tree Protocol (STP) in einem Netzwerk eingesetzt wird.","answer":"STP (IEEE 802.1D) wird in geswitchten Netzwerken mit redundanten Verbindungen eingesetzt, um eine stabile, schleifenfreie Kommunikation sicherzustellen.\nProblem: Redundante Verbindungen erhöhen die Ausfallsicherheit, erzeugen aber Schleifen (Loops) → Broadcast-Stürme und instabile MAC-Tabellen.\nFunktion:\n• Die Switches wählen eine Root Bridge und berechnen den optimalen Pfad für den Datenverkehr.\n• Redundante Pfade werden logisch blockiert, sodass ein schleifenfreier Baum entsteht.\n• Fällt ein aktiver Pfad aus, aktiviert STP automatisch einen blockierten Ersatzpfad.\nSchnellere Variante: RSTP (802.1w).","nr":157,"cat":6},{"id":153,"question":"Anstelle des Spanning Tree Protocols kann in Netzwerken mit redundanten Verbindungen auch Link-Aggregation eingesetzt werden. Erklären Sie das Grundprinzip von Link-Aggregation.","answer":"Link-Aggregation (Link-Bündelung, Port-Trunking, LACP nach IEEE 802.3ad) fasst mehrere physische Netzwerkverbindungen zwischen zwei Geräten zu einer logischen Hochgeschwindigkeitsverbindung zusammen.\nVorteile:\n• Bündelung erhöht die Gesamtbandbreite (z. B. 4 × 1 Gbit/s ≈ 4 Gbit/s)\n• Ausfallsicherheit: Fällt ein Link aus, läuft der Verkehr über die anderen weiter\n• Lastverteilung über die einzelnen Links\nIm Gegensatz zu STP werden die redundanten Leitungen nicht blockiert, sondern alle aktiv genutzt.","nr":158,"cat":6},{"id":223,"question":"Was versteht man unter einer Shared-Medium-Verbindung?","answer":"Eine Shared-Medium-Verbindung ist eine Verbindung, bei der sich mehrere Teilnehmer eine gemeinsame physische Übertragungsleitung teilen. Die Bandbreite wird von allen Teilnehmern gemeinsam genutzt.\n• Es kann immer nur ein Teilnehmer gleichzeitig senden → Kollisionen sind möglich.\n• Ein Zugriffsverfahren regelt das Senden: CSMA/CD (Bus, Hub), CSMA/CA (WLAN).\n• Je mehr Teilnehmer, desto weniger Bandbreite pro Teilnehmer.\nBeispiele: Hub, Bus-Topologie, WLAN, Kabelinternet (Koax).\nGegenstück: Switch – jeder Port ist eine eigene Kollisionsdomäne mit voller Bandbreite (Vollduplex).","nr":159,"neu":1,"cat":6},{"id":154,"question":"Wofür stehen die Abkürzungen UTP, FTP und S-FTP im Zusammenhang mit Twisted-Pair-Kabeln?","answer":"Die Abkürzungen beschreiben die Abschirmung von Twisted-Pair-Kabeln (Format: Gesamtschirm/Paarschirm):\n• UTP (Unshielded Twisted Pair): keine Abschirmung – günstig, aber anfällig für elektromagnetische Störungen\n• FTP (Foiled Twisted Pair): eine Gesamtabschirmung aus Metallfolie um alle Adernpaare\n• S-FTP (Screened Foiled Twisted Pair): zusätzlich zur Folie ein Geflechtschirm (Gesamtschirm) – besserer Schutz\nNach ISO/IEC 11801: U/UTP, F/UTP, S/FTP (S/FTP = Geflecht gesamt + jedes Paar einzeln mit Folie geschirmt). Je besser die Schirmung, desto weniger Störungen und Übersprechen.","nr":160,"cat":6},{"id":155,"question":"Nennen Sie jeweils zwei Vor- und Nachteile von Lichtwellenleitern.","answer":"Vorteile:\n• sehr hohe Übertragungsraten (Gbit/s bis Tbit/s)\n• sehr große Reichweiten (km) bei geringer Dämpfung\n• keine Beeinflussung durch elektrische oder elektromagnetische Störfelder\n• keine Funkenbildung/Brandgefahr, galvanische Trennung, schwer abhörbar\nNachteile:\n• Installation von Lichtwellenleitern erfordert Fachkenntnisse und spezielle Ausrüstung (Spleißen)\n• Stecker sind empfindlich gegen Verschmutzung\n• hohe Kosten für Kabel und Komponenten\n• Fasern können bei zu starker Krümmung brechen\n• kein Power over Ethernet möglich","nr":161,"cat":6},{"id":156,"question":"Worin liegt der Unterschied zwischen der Multimode- und der Singlemode-Technologie bei Lichtwellenleitern?","answer":"• Multimode-LWL: größerer Kerndurchmesser (50 oder 62,5 µm). Mehrere Lichtstrahlen (Moden) breiten sich gleichzeitig auf unterschiedlichen Wegen aus → Laufzeitunterschiede (Modendispersion). Daher kürzere Übertragungsdistanzen (bis einige hundert Meter), günstiger (LED/VCSEL). Einsatz: im Gebäude, Rechenzentrum.\n• Singlemode-LWL: sehr kleiner Kerndurchmesser (ca. 9 µm). Nur ein einziger Lichtstrahl wird geführt → kaum Dispersion, sehr große Reichweiten (viele km) und höhere Übertragungsraten. Teurer (Laser). Einsatz: Campus, WAN, Provider.","nr":162,"cat":6},{"id":157,"question":"Erläutern Sie in Bezug auf Übertragungsmedien die Kenngröße Dämpfung.","answer":"Dämpfung bezeichnet den Verlust bzw. die Abschwächung der Signalstärke (Leistung) während der Übertragung über ein Medium – bei elektrischen und optischen Signalen. Angabe in Dezibel (dB), oft pro Länge (dB/100 m bzw. dB/km).\nUrsachen: Leitungswiderstand, Material, Steckverbindungen, Spleiße, Kabellänge, Frequenz (höhere Frequenz → höhere Dämpfung).\nFolgen: Die Dämpfung wirkt sich direkt auf die Signalqualität und die maximale Übertragungsdistanz aus. Zu hohe Dämpfung führt zu Übertragungsfehlern oder Verbindungsabbrüchen; Abhilfe: Repeater/Verstärker, bessere Kabel, kürzere Strecken.","nr":163,"cat":6},{"id":158,"question":"WLAN können im Infrastrukturmodus oder im Ad-hoc-Modus betrieben werden. Erklären Sie beide Betriebsmodi.","answer":"• Infrastrukturmodus: Das WLAN wird durch einen zentralen Zugriffspunkt (Access Point) verwaltet. Alle Geräte kommunizieren über den Access Point, der auch die Verbindung zum kabelgebundenen Netzwerk bzw. Internet herstellt und Authentifizierung/Verschlüsselung steuert. Standard in Unternehmen und Haushalten.\n• Ad-hoc-Modus (Peer-to-Peer, IBSS): Drahtlose Geräte kommunizieren direkt miteinander, ohne zentralen Access Point. Schnell für spontane Verbindungen (z. B. Dateiaustausch), aber geringe Reichweite, keine zentrale Verwaltung und meist weniger Sicherheit; alle Geräte sind gleichberechtigt.","nr":164,"cat":6},{"id":159,"question":"Erläutern Sie die beiden Varianten „WPA2 (Personal)“ und „WPA2 (Enterprise)“ zur Absicherung eines WLANs.","answer":"• WPA2-Personal (WPA2-PSK): für kleinere Umgebungen (Privat, kleine Büros). Ein gemeinsamer Pre-Shared Key (WLAN-Passwort) sichert das Netz; alle Geräte müssen denselben Schlüssel eingeben. Einfach, aber: Wer das Passwort kennt, hat Zugang; Änderung betrifft alle.\n• WPA2-Enterprise (802.1X): für größere Netzwerke. Nutzt einen Authentifizierungsserver (meist RADIUS). Jeder Benutzer meldet sich mit eigenem Benutzernamen und Passwort oder Zertifikat (EAP-TLS) an. Vorteile: individuelle Zugänge, einzeln sperrbar, protokollierbar, VLAN-Zuweisung möglich.\nBeide nutzen AES-Verschlüsselung (CCMP). Nachfolger: WPA3.","nr":165,"cat":6},{"id":160,"question":"Accesspoints und moderne Betriebssysteme unterstützen die „WPS-Funktion“ (Wi-Fi Protected Setup). Erklären Sie diese Funktion.","answer":"WPS (Wi-Fi Protected Setup) ist eine Methode, um die Einrichtung und Konfiguration einer sicheren WLAN-Verbindung zu vereinfachen. Der Benutzer muss kein langes Passwort (Pre-Shared Key) eintippen.\nVarianten:\n• Push-Button (PBC): Taste am Router und am Gerät innerhalb kurzer Zeit drücken\n• PIN-Verfahren: 8-stellige PIN eingeben\nAufgaben: Authentifizierung des WLAN-Clients gegenüber dem Access Point und automatische Konfiguration des WLAN-Clients mit dem Passwort.\nSicherheitsrisiko: Die PIN-Methode ist per Brute-Force angreifbar → WPS am besten deaktivieren.","nr":166,"cat":6},{"id":161,"question":"Erklären Sie die Begriffe Routing und Switching.","answer":"• Routing: Prozess des Weiterleitens von Datenpaketen zwischen verschiedenen Netzwerken (OSI-Schicht 3). Ein Router analysiert die Ziel-IP-Adresse jedes Pakets und entscheidet anhand seiner Routing-Tabelle, über welchen Weg das Paket sein Ziel am besten erreicht. Kriterien: Netzwerkauslastung, Pfadkosten/Metrik, Priorität usw.\n• Switching: Prozess des Weiterleitens von Datenpaketen (Frames) innerhalb desselben Netzwerks (OSI-Schicht 2). Ein Switch analysiert die Ziel-MAC-Adresse jedes Frames und verwendet seine MAC-Adresstabelle (Switching-Tabelle), um das Paket an den richtigen Port weiterzuleiten.","nr":167,"cat":6},{"id":162,"question":"Für dynamisches Routing können Distance-Vector-Protokolle verwendet werden. Beschreiben Sie die Arbeitsweise von Distance-Vector-Protokollen.","answer":"Distance-Vector-Protokolle verwenden den Ansatz der Distanzvektoren, um Routing-Informationen zu berechnen und weiterzugeben:\n• Jeder Router sendet periodisch seine gesamte Routing-Tabelle an seine direkten Nachbarn.\n• Die Tabelle enthält Informationen über die Entfernung (Metrik, z. B. Anzahl der Hops) zu Zielnetzen und die Richtung (nächster Router).\n• Die Nachbarn kombinieren die erhaltenen Informationen mit ihren eigenen Routing-Tabellen und aktualisieren diese entsprechend („Routing by Rumor“ – kein Router kennt die gesamte Topologie).\nNachteile: langsame Konvergenz, Gefahr von Routing-Schleifen (Count to Infinity).\nBeispiel: RIP (max. 15 Hops).","nr":168,"cat":6},{"id":163,"question":"Link-State-Protokolle sind eine Alternative zu den Distance-Vector-Protokollen. Erklären Sie die grundlegende Funktion von Link-State-Protokollen.","answer":"Link-State-Protokolle verwenden den Ansatz des Link-Zustands, um Routing-Informationen zu berechnen und zu verteilen:\n• Jeder Router erfasst den Zustand seiner direkten Verbindungen (Links) und verteilt diese Informationen per Link-State-Advertisements an alle Router im Netzwerk.\n• Jeder Router erstellt daraus eine Link-State-Datenbank – eine detaillierte Karte der gesamten Netzwerktopologie.\n• Jeder Router berechnet unabhängig den kürzesten Pfad zu jedem Ziel (Dijkstra-/SPF-Algorithmus).\nVorteile: schnelle Konvergenz, keine Schleifen, gute Skalierung. Nachteil: mehr Rechenleistung/Speicher.\nBeispiele: OSPF, IS-IS.","nr":169,"cat":6},{"id":164,"question":"Was sind die Unterschiede und Funktionen von Core Switch, Distribution Switch und Access Switch in einem hierarchischen Netzwerkdesign?","answer":"Drei-Schichten-Modell (hierarchisches Netzwerkdesign):\n• Core Switch (Kernschicht): zentraler Knotenpunkt/Backbone. Core Switches sind in der Regel leistungsfähiger und schneller als andere Switches, da sie eine große Menge an Netzwerkverkehr bewältigen müssen. Fokus: hohe Geschwindigkeit und Redundanz.\n• Distribution Switches (Verteilerschicht): dienen als Schnittstelle zwischen den Core Switches und den Access Switches. Sie steuern den Datenverkehr zwischen verschiedenen Subnetzen/VLANs (Routing, ACLs, QoS).\n• Access Switches (Zugangsschicht): verwalten den Verkehr zwischen Endgeräten (PCs, Drucker, Access Points) und dem Netzwerk; bieten Funktionen wie Port-Security, VLAN-Zuweisung, PoE und QoS.","nr":170,"cat":6},{"id":165,"question":"Was ist eine MAC-Adresse?","answer":"Die MAC-Adresse (Media Access Control Address) ist eine eindeutige Kennung, die Netzwerkkarten und anderen Netzwerkgeräten zugewiesen ist. Sie wird verwendet, um ein Gerät eindeutig zu identifizieren und zu adressieren – auf OSI-Schicht 2 im lokalen Netz.\nAufbau: 48 Bit, in der Regel in hexadezimaler Notation dargestellt (z. B. 00:1A:2B:3C:4D:5E).\nSie besteht aus zwei Teilen:\n• die ersten 24 Bit: OUI (Organizationally Unique Identifier) – identifiziert den Hersteller\n• die letzten 24 Bit: eindeutige Gerätenummer des Herstellers (NIC-spezifisch)\nBroadcast-MAC: FF:FF:FF:FF:FF:FF.","nr":171,"cat":6},{"id":166,"question":"Wofür steht die Abkürzung ARP im Bereich der Netzwerktechnik?","answer":"ARP steht für Address Resolution Protocol. Es ist ein Netzwerkprotokoll, das verwendet wird, um die IP-Adressen von Geräten in einem lokalen Netzwerk (LAN) in deren MAC-Adressen aufzulösen.\nARP wird hauptsächlich in IPv4-Netzwerken eingesetzt. Ablauf:\n1. Will ein Gerät ein anderes Gerät im LAN erreichen, kennt aber nur dessen IP-Adresse, sendet es eine ARP-Anfrage als Broadcast („Wer hat 192.168.1.20?“).\n2. Das Gerät mit dieser IP antwortet per Unicast mit seiner MAC-Adresse.\n3. Die Zuordnung wird im ARP-Cache zwischengespeichert.\nIn IPv6 übernimmt NDP (Neighbor Discovery) diese Aufgabe. Angriff: ARP-Spoofing.","nr":172,"cat":6},{"id":224,"question":"Was ist in Bezug auf Port-Security der Unterschied zwischen „Sticky MAC Addresses“ und „Configured MAC Addresses“?","answer":"Port-Security legt fest, welche MAC-Adressen an einem Switchport erlaubt sind; bei Verstoß wird der Port je nach Einstellung gesperrt (shutdown) oder der Verkehr verworfen.\nSticky MAC Addresses:\n• Der Switch lernt die MAC-Adresse automatisch, sobald ein Gerät am Port sendet.\n• Diese gelernte MAC wird automatisch in die Konfiguration übernommen („sticky“).\n• Vorteil: kein manuelles Eintragen nötig.\n• Risiko: Wird zuerst ein falsches Gerät angeschlossen, wird dessen MAC übernommen.\nConfigured (statische) MAC Addresses:\n• Die MAC-Adresse wird manuell vom Administrator eingetragen; nur genau diese ist am Port erlaubt.\n• Kein automatisches Lernen.\n• Vorteil: höchste Kontrolle und Sicherheit. Nachteil: mehr Verwaltungsaufwand.","nr":173,"neu":1,"cat":6},{"id":167,"question":"Erläutern Sie die Aufgabe des Simple Network Management Protocol (SNMP). Gehen Sie hierbei auch kurz auf die Begriffe Management Information Base (MIB), Community-String und GetRequest ein.","answer":"SNMP ermöglicht die Kommunikation zwischen Netzwerkgeräten und einem zentralen Management-System (z. B. zur Überwachung, Konfiguration und Fehlerbehebung von Routern, Switches, Servern, Druckern). Die Geräte (Agenten) liefern Statusinformationen an die Management-Station oder senden selbst Alarme (Traps).\n• MIB (Management Information Base): Jedes SNMP-fähige Gerät speichert seine Informationen in einer hierarchisch strukturierten Datenbank (MIB); jeder Wert ist über eine OID adressierbar.\n• Community-String: ist ein Kennwort zur Authentifizierung in SNMP v1/v2c (z. B. „public“) – unverschlüsselt; sicherer ist SNMPv3.\n• GetRequest: ein SNMP-Nachrichtentyp, mit dem der Manager einen bestimmten Wert aus der MIB abfragt.\nPorts: UDP 161 (Anfragen), 162 (Traps).","nr":174,"cat":6},{"id":168,"question":"Beschreiben Sie den Begriff der Latenz.","answer":"Latenz bezeichnet die Verzögerungszeit, die beim Senden von Daten von einem Punkt zum anderen in einem Netzwerk auftritt – also die Zeit, die ein Signal oder Datenpaket vom Sender zum Empfänger benötigt. Angabe in Millisekunden (ms); häufig als Round-Trip-Time (Hin und zurück, z. B. per ping).\nUrsachen: Übertragungsweg (Entfernung), Verarbeitung in Routern/Switches, Warteschlangen bei Überlast, Medium (z. B. Satellit).\nEine hohe Latenz kann sich negativ auf die Netzwerkleistung auswirken – besonders bei Echtzeitanwendungen wie VoIP, Videokonferenzen und Online-Gaming. Nicht verwechseln mit Bandbreite (Datenmenge pro Zeit).","nr":175,"cat":6},{"id":169,"question":"Erklären Sie die Bedeutung der Abkürzung MTU und ihre Bedeutung für die Übertragung von Daten in einem Netzwerk.","answer":"MTU steht für Maximum Transmission Unit und bezeichnet die maximale Größe eines Datenpakets (in Byte), das in einem Netzwerk ohne Aufteilung übertragen werden kann. Bei Ethernet standardmäßig 1500 Byte.\nBedeutung:\n• Ist ein Paket größer als die MTU einer Strecke, muss es fragmentiert (zerlegt) werden, was zusätzliche Rechenleistung und Zeit kostet – oder es wird verworfen.\n• Größere MTU = weniger Overhead, effizientere Übertragung (Jumbo Frames ~9000 Byte im Rechenzentrum).\n• Zu große MTU auf Teilstrecken (z. B. VPN-Tunnel, PPPoE mit 1492) führt zu Verbindungsproblemen.\nEine falsch konfigurierte MTU kann zu Fragmentierung, Verzögerungen und Paketverlust führen.","nr":176,"cat":6},{"id":170,"question":"Beschreiben Sie die Aufgabe des DHCP-Protokolls und nennen Sie drei Informationen, welche mittels DHCP übertragen werden können.","answer":"DHCP steht für Dynamic Host Configuration Protocol. Die Aufgabe des DHCP-Protokolls besteht darin, die automatische Zuweisung von Netzwerkkonfigurationen an Geräte in einem Netzwerk zu ermöglichen. Das erleichtert die Verwaltung, vermeidet Tippfehler und doppelt vergebene Adressen.\nMittels DHCP können u. a. übertragen werden:\n• IP-Adresse\n• Subnetzmaske\n• Standardgateway\n• DNS-Server\n• Lease-Dauer (Gültigkeitsdauer der Adresse)\n• NTP-Server, Domänenname\nPorts: UDP 67 (Server), 68 (Client).","nr":177,"cat":6},{"id":171,"question":"Erklären Sie den Ablauf der DHCP-Kommunikation nach dem DORA-Prinzip.","answer":"DORA beschreibt die vier Schritte der DHCP-Adressvergabe:\n• D – DHCP-Discover: Ein Client ohne IP-Adresse sendet eine Broadcast-Nachricht ins Netzwerk, um verfügbare DHCP-Server zu finden.\n• O – DHCP-Offer: Ein (oder mehrere) DHCP-Server antworten mit einem Angebot, das eine IP-Adresse und weitere Konfigurationsinformationen enthält.\n• R – DHCP-Request: Der Client wählt ein Angebot aus und sendet per Broadcast eine Anfrage, um dieses anzufordern – damit wissen auch die anderen Server, dass ihr Angebot nicht gewählt wurde.\n• A – DHCP-Acknowledgement: Der gewählte Server bestätigt die Vergabe; der Client darf die Adresse für die Lease-Dauer nutzen.","nr":178,"cat":6},{"id":172,"question":"Was ist der Zweck des DHCP-Relay und der „ip helper-address“-Konfiguration in Netzwerkgeräten?","answer":"Problem: DHCP-Discover ist ein Broadcast – und Router leiten Broadcasts nicht in andere Netze weiter. Steht der DHCP-Server in einem anderen Subnetz/VLAN, erreicht ihn die Anfrage nicht.\n• DHCP-Relay (Relay Agent): Ein Router oder L3-Switch nimmt die DHCP-Broadcasts von Clients in einem Subnetz entgegen und leitet sie als Unicast an einen DHCP-Server in einem anderen Netz weiter – und die Antworten zurück.\n• „ip helper-address“ ist der Befehl (z. B. bei Cisco), mit dem diese Funktion auf dem Router-Interface des Client-Netzes konfiguriert wird: Angabe der IP des DHCP-Servers.\nVorteil: ein zentraler DHCP-Server für viele Subnetze.","nr":179,"cat":6},{"id":173,"question":"Geben Sie für die Abkürzung DNS die vollständige Schreibweise an und erklären Sie die Hauptaufgabe von DNS.","answer":"DNS steht für Domain Name System. Es ist ein dezentrales, hierarchisches System zur Auflösung von Domainnamen in IP-Adressen und umgekehrt – das „Telefonbuch des Internets“ (z. B. www.beispiel.de → 93.184.216.34).\nHierarchie:\n• Root-Server (Wurzel „.“)\n• Top-Level-Domains (TLD) wie .de, .com\n• Second-Level-Domains (z. B. beispiel.de) mit autoritativen DNS-Servern\nWichtige Record-Typen: A (IPv4), AAAA (IPv6), CNAME (Alias), MX (Mailserver), PTR (Reverse), NS.\nPort: 53 (UDP, bei großen Antworten TCP).","nr":180,"cat":6},{"id":174,"question":"Was ist ein Proxy-Server und wozu wird er verwendet?","answer":"Ein Proxy-Server agiert als Vermittler zwischen einem Client und dem Zielserver (z. B. im Internet). Wenn ein Client eine Anfrage stellt, leitet der Proxy-Server diese Anfrage im Namen des Clients weiter und empfängt die Antwort, die er dann an den Client zurückgibt.\nEinsatzzwecke:\n• Datenverkehr überwachen, filtern und protokollieren (z. B. Webseiten sperren, Virenscan)\n• Zwischenspeicherung (Caching) häufig abgerufener Inhalte → schneller, spart Bandbreite\n• Anonymisierung: die interne IP des Clients bleibt verborgen\n• Zugangskontrolle und Authentifizierung für den Internetzugriff\nSo verbessert er Sicherheit und Effizienz der Verbindung.","nr":181,"cat":6},{"id":175,"question":"Für welche Aufgaben wird ein Reverse-Proxy-Server eingesetzt?","answer":"Ein Reverse-Proxy-Server ist ein Server, der als Vermittler zwischen Clients (aus dem Internet) und einem oder mehreren Back-End-Servern fungiert. Er nimmt Anfragen von Clients entgegen und leitet diese an die entsprechenden Server weiter; die Clients sehen nur den Reverse Proxy.\nAufgaben:\n• Lastverteilung (Load Balancing) auf mehrere Server\n• Caching statischer Inhalte\n• Verschlüsselung (TLS-Terminierung/SSL-Offloading)\n• Schutz der Identität und Struktur der Back-End-Server, Abwehr von Angriffen (z. B. als Web Application Firewall)\n• Kompression eingehender und ausgehender Daten\nBeispiele: nginx, HAProxy, Apache.","nr":182,"cat":6},{"id":176,"question":"Was ist die Datenübertragungsrate und wie wird sie berechnet?","answer":"Die Datenübertragungsrate bezieht sich auf die Menge an Daten, die innerhalb einer bestimmten Zeitspanne übertragen werden. Sie gibt an, wie schnell Daten von einem Punkt zum anderen übertragen werden können. Einheit: Bit pro Sekunde (bit/s, Mbit/s, Gbit/s).\nFormel: Datenübertragungsrate = Datenmenge / Zeitintervall\nUmgestellt: Übertragungszeit = Datenmenge / Übertragungsrate\nBeispiel: 500 MB über 100 Mbit/s → 500 × 8 = 4000 Mbit → 4000 / 100 = 40 s.\nAchtung: Byte (B) vs. Bit (b) – Faktor 8; Dezimal- (MB = 10⁶) vs. Binärpräfixe (MiB = 2²⁰).","nr":183,"cat":6},{"id":225,"question":"Was versteht man unter dem Round-Robin-Verfahren in der Informatik?","answer":"Round Robin ist ein Verfahren zur gleichmäßigen Verteilung von Aufgaben oder Anfragen auf mehrere Systeme oder Ressourcen, bei dem jeder Teilnehmer der Reihe nach an die Reihe kommt. Nach dem letzten Teilnehmer beginnt die Reihenfolge wieder von vorne – ohne Priorisierung.\nEinsatz: Load Balancing (Server A → B → C → A …), DNS-Round-Robin, CPU-Scheduling (Zeitscheiben).\nVorteile:\n• gleichmäßige Lastverteilung\n• keine Bevorzugung einzelner Server\n• einfache Umsetzung\nNachteil: berücksichtigt weder die aktuelle Auslastung noch die unterschiedliche Leistung der Server (→ Weighted Round Robin).","nr":184,"neu":1,"cat":6},{"id":226,"question":"Welchen Zweck erfüllt das IP-Hashing in der Netzwerktechnik?","answer":"IP-Hashing dient der Lastverteilung (Load Balancing), indem Anfragen anhand der Client-IP-Adresse gezielt einem bestimmten Server zugewiesen werden.\nDabei wird aus der IP-Adresse (oft zusammen mit weiteren Feldern wie dem Port) ein Hashwert berechnet, der bestimmt, welcher Server eine Anfrage erhält.\nVorteile:\n• gleichmäßige Verteilung von Anfragen auf mehrere Server\n• Wiedererkennung von Clients: Derselbe Client landet immer auf demselben Server (Session-Persistenz)\n• Vermeidung einer zentralen Sitzungsverwaltung (Session Handling)\nNachteile: Viele Clients hinter einer NAT-Adresse landen alle auf demselben Server; fällt ein Server weg, ändert sich die Zuordnung.","nr":185,"neu":1,"cat":6},{"id":227,"question":"Was versteht man unter dem Least-Connection-Verfahren in der Netzwerktechnik?","answer":"Das Least-Connection-Verfahren ist ein Lastverteilungsverfahren (Load Balancing), bei dem eingehende Anfragen an den Server weitergeleitet werden, der aktuell die wenigsten aktiven Verbindungen hat.\nVorteile:\n• gleichmäßige Auslastung der Server\n• Vermeidung von Überlastung einzelner Systeme\n• bessere Performance bei unterschiedlich langen Sitzungen (z. B. Downloads neben kurzen Webseitenaufrufen)\nNachteil: Der Load Balancer muss die Verbindungen laufend mitzählen; unterschiedliche Serverleistung berücksichtigt erst die Variante Weighted Least Connection.\nVergleich: Round Robin verteilt stur reihum, Least Connection reagiert auf die tatsächliche Last.","nr":186,"neu":1,"cat":6},{"id":177,"question":"Was sind die Unterschiede zwischen LAN, MAN, WAN und GAN?","answer":"Netzwerke nach Ausdehnung:\n• LAN (Local Area Network): lokales Netzwerk in einem begrenzten geografischen Bereich – Gebäude, Büro, Campus.\n• MAN (Metropolitan Area Network): Netzwerk, das sich über eine Stadt oder Metropolregion erstreckt. Größere Reichweite als ein LAN, aber kleiner als ein WAN (z. B. Stadtnetz).\n• WAN (Wide Area Network): weitläufiges Netzwerk, das über große Entfernungen verteilt ist – Länder, Kontinente. Ermöglicht die Kommunikation zwischen entfernten Standorten (z. B. Firmen-WAN).\n• GAN (Global Area Network): weltumspannendes Netzwerk, das mehrere WANs verbindet und die globale Kommunikation ermöglicht (z. B. Internet, Satellitennetze).","nr":187,"cat":6},{"id":178,"question":"PAN (Personal Area Network) und WLAN (Wireless Local Area Network) sind zwei verschiedene Arten von Netzwerken mit unterschiedlichen Anwendungsbereichen und Funktionalitäten. Erklären Sie diese.","answer":"• PAN (Personal Area Network): Netzwerk, das sich auf den persönlichen Bereich einer Person beschränkt (wenige Meter). Es ermöglicht die Verbindung zwischen Geräten in unmittelbarer Nähe, wie z. B. Smartphones, Tablets, Smartwatches, Kopfhörer, Laptops oder Druckern. Technologien: Bluetooth, NFC, USB (kabelgebunden).\n• WLAN (Wireless Local Area Network): drahtloses lokales Netzwerk mit größerer Reichweite als ein PAN (ca. 30–100 m). Es ermöglicht die drahtlose Verbindung zahlreicher Geräte in Gebäuden und den Zugang zum LAN/Internet. Basiert auf dem Wi-Fi-Standard (IEEE 802.11) und wird über Access Points betrieben.","nr":188,"cat":6},{"id":179,"question":"Nennen Sie zwei Vorteile, die für den Einsatz von VLANs sprechen.","answer":"Vorteile des Einsatzes von VLANs:\n• VLANs ermöglichen die logische Segmentierung eines physischen Netzwerks in mehrere virtuelle Netzwerke – unabhängig vom Standort der Geräte\n• höhere Sicherheit: Verkehr zwischen VLANs ist getrennt und kann nur über einen Router/L3-Switch mit Regeln fließen\n• in VLANs kann der Datenverkehr priorisiert und optimiert werden (QoS)\n• kleinere Broadcastdomänen → weniger Broadcast-Last, bessere Performance\n• bessere Verwaltung und flexible Konfiguration des Netzwerks, weniger Hardware nötig","nr":189,"cat":6},{"id":180,"question":"Was ist der Unterschied zwischen statischen und dynamischen VLANs?","answer":"• Statische VLANs (portbasiert): werden manuell konfiguriert. Jeder Port am Switch wird einem bestimmten VLAN fest zugeordnet. Diese Zuordnung bleibt unverändert – egal welches Gerät angeschlossen wird. Einfach und verbreitet, aber Aufwand bei Umzügen.\n• Dynamische VLANs: verwenden eine dynamische Zuordnung von Geräten zu VLANs. Die Zuordnung basiert auf bestimmten Merkmalen der Geräte, wie z. B. der MAC-Adresse, dem Benutzer oder einer Authentifizierung (802.1X/RADIUS). Wenn ein Gerät angeschlossen wird, identifiziert der Switch es und weist den Port automatisch dem passenden VLAN zu. Flexibel, aber aufwendigere Einrichtung.","nr":190,"cat":6},{"id":181,"question":"Was sind tagged Ports?","answer":"Tagged Ports (Trunk-Ports) sind Switchports, die den Datenverkehr von mehreren VLANs gleichzeitig über eine einzige Verbindung übertragen können – typischerweise zwischen Switches oder zwischen Switch und Router/Server.\nFunktion (IEEE 802.1Q): Damit der Empfänger weiß, zu welchem VLAN ein Frame gehört, wird ein VLAN-Tag (4 Byte, enthält die VLAN-ID) in den Ethernet-Frame eingefügt. Der empfangende Switch liest das Tag und ordnet den Frame dem richtigen VLAN zu.\nIm Gegensatz dazu gehören untagged Ports (Access-Ports) zu genau einem VLAN; Endgeräte senden ungetaggte Frames.","nr":191,"cat":6},{"id":182,"question":"Erläutern Sie, warum Quality of Service (QoS) bei der Übertragung von Telefonie- und Videodaten eine wichtige Rolle spielt.","answer":"Quality of Service bezieht sich auf die Fähigkeit eines Netzwerks, unterschiedliche Datenarten unterschiedlich zu behandeln. Mit QoS werden bestimmte Datenpakete priorisiert, um eine bessere und vorhersehbarere Übertragungsqualität zu gewährleisten.\nWarum wichtig für Telefonie/Video: Diese Echtzeitanwendungen reagieren sehr empfindlich auf Verzögerungen (Latenz), Paketverlust und Schwankungen der Laufzeit (Jitter). Schon kurze Störungen führen zu Aussetzern, Echo oder ruckelndem Bild. Verlorene Pakete können nicht sinnvoll neu gesendet werden.\nQoS sorgt dafür, dass Sprach- und Videopakete bevorzugt weitergeleitet werden, z. B. vor Downloads oder E-Mails (Markierung per DSCP/802.1p, eigene Warteschlangen, Bandbreitenreservierung).","nr":192,"cat":6},{"id":183,"question":"Welche verschiedenen VPN-Modelle gibt es?","answer":"• End-to-Site-VPN (Remote-Access-VPN, Client-to-Site): Ermöglicht es einem einzelnen Benutzer oder einem entfernten Endgerät (z. B. Laptop im Homeoffice), eine sichere Verbindung zu einem privaten Netzwerk (Firmennetz) herzus
