tellen. Auf dem Endgerät läuft ein VPN-Client.\n• Site-to-Site-VPN (LAN-to-LAN): verbindet zwei oder mehrere komplette Netzwerke an unterschiedlichen Standorten (z. B. Zentrale und Filiale) dauerhaft über das Internet; die VPN-Gateways bauen den Tunnel auf, die Endgeräte merken nichts davon.\n• End-to-End-VPN: Verbindung direkt zwischen zwei Endgeräten bzw. Endpunkten, die gesamte Strecke ist verschlüsselt (z. B. Admin-PC zu einem einzelnen Server).","nr":193,"cat":6},{"id":184,"question":"Was ist der Unterschied zwischen Tunnelmodus und Transportmodus bei VPNs?","answer":"Beide Modi gibt es bei IPsec:\n• Tunnelmodus: Das gesamte ursprüngliche IP-Paket (Header + Nutzdaten) wird verschlüsselt und in ein neues IP-Paket mit neuem Header gekapselt. Die echten Adressen der internen Kommunikationspartner bleiben verborgen. Einsatz: Site-to-Site- und Remote-Access-VPN zwischen Gateways.\n• Transportmodus: Nur die Nutzdaten (Payload) des IP-Pakets werden verschlüsselt; der ursprüngliche IP-Header bleibt erhalten und sichtbar. Weniger Overhead. Einsatz: direkte End-to-End-Verbindung zwischen zwei Hosts.","nr":194,"cat":6},{"id":185,"question":"Erklären Sie die beiden Betriebsarten Routing und Bridging in einer VPN-Konfiguration.","answer":"• Routing (Layer-3-VPN, z. B. OpenVPN „tun“): Der VPN-Server arbeitet wie ein Router. Die VPN-Clients erhalten IP-Adressen aus einem eigenen Subnetz; die Pakete werden auf Basis der IP-Adressen zwischen VPN-Netz und Firmennetz geroutet. Nur IP-Verkehr, kein Broadcast. Effizient und gut skalierbar – Standardfall.\n• Bridging (Layer-2-VPN, z. B. „tap“): Das VPN verbindet zwei Netzwerke auf Schicht 2 so, als wären sie ein einziges lokales Netz. Der Client bekommt eine IP aus dem Firmen-LAN; alle Frames inkl. Broadcasts (z. B. für DHCP, Netzwerkspiele, NetBIOS) werden übertragen. Nachteil: mehr Datenverkehr, schlechter skalierbar.","nr":195,"cat":6},{"id":186,"question":"Beschreiben Sie die zusätzlichen Sicherheitsvorteile, die Zero Trust Network Access (ZTNA) im Vergleich zu traditionellen VPN-Verbindungen bietet.","answer":"Ein klassisches VPN gewährt nach der Anmeldung meist Zugriff auf das gesamte interne Netz. ZTNA verbessert die Sicherheit durch:\n• Mikrosegmentierung: Der Zugriff wird nur auf genau die benötigten Anwendungen gewährt, nicht auf das ganze Netzwerk → minimaler Zugriff (Least Privilege)\n• kontinuierliche Prüfung: Identität, Gerätezustand (Patches, Virenschutz), Standort und Kontext werden bei jedem Zugriff verifiziert, nicht nur einmal beim Verbindungsaufbau\n• reduzierte Angriffsfläche: Anwendungen sind nach außen unsichtbar, keine offenen VPN-Ports\n• Angreifer können sich nach einer Kompromittierung nicht seitlich im Netz bewegen (Lateral Movement)\n• bessere Echtzeitüberwachung und adaptive Reaktionen","nr":196,"cat":6},{"id":187,"question":"Erklären Sie die Aufgaben des IPsec Protokolls.","answer":"IPsec (Internet Protocol Security) ist eine Protokollsuite, die auf der Vermittlungsschicht (Schicht 3) des OSI-Modells arbeitet und die Sicherheit der IP-Kommunikation gewährleistet – vor allem in VPNs.\nAufgaben:\n• Vertraulichkeit: Verschlüsselung der Daten (ESP – Encapsulating Security Payload)\n• Integrität: Schutz vor unbemerkter Veränderung der Pakete\n• Authentizität: Nachweis der Herkunft/Authentifizierung der Kommunikationspartner (AH – Authentication Header, PSK oder Zertifikate)\n• Schutz vor Replay-Angriffen\n• Schlüsselaustausch und Aushandlung der Sicherheitsparameter über IKE (Internet Key Exchange)\nBetriebsarten: Tunnel- und Transportmodus.","nr":197,"cat":6},{"id":188,"question":"Nennen Sie die 7 Schichten des OSI-Modells in aufsteigender Reihenfolge.","answer":"Die 7 Schichten des OSI-Modells (Open Systems Interconnection) von unten nach oben:\n1. Bitübertragungsschicht (Physical Layer)\n2. Sicherungsschicht (Data Link Layer)\n3. Vermittlungsschicht (Network Layer)\n4. Transportschicht (Transport Layer)\n5. Sitzungsschicht (Session Layer)\n6. Darstellungsschicht (Presentation Layer)\n7. Anwendungsschicht (Application Layer)\nEselsbrücke (von unten): „Please Do Not Throw Salami Pizza Away“.","nr":198,"cat":6},{"id":189,"question":"Welche Schichten des OSI-Modells gehören zu den transportorientierten Schichten? Erklären Sie auch kurz die Aufgaben dieser Schichten.","answer":"Transportorientiert sind die Schichten 1–4:\n• Bitübertragungsschicht (1): beschäftigt sich mit der physischen Übertragung von Datenbits über das Übertragungsmedium (Kabel, Funk, Licht); Stecker, Spannungen, Signale.\n• Sicherungsschicht (2): kümmert sich um die fehlerfreie Übertragung von Datenframes zwischen benachbarten Netzwerkgeräten; MAC-Adressierung, Fehlererkennung (Prüfsumme), Zugriffssteuerung.\n• Vermittlungsschicht (3): ist für die Adressierung (IP), das Routing und die Weiterleitung von Datenpaketen über verschiedene Netze verantwortlich.\n• Transportschicht (4): regelt die Ende-zu-Ende-Zuordnung der Datenpakete zu Anwendungen (Ports), Segmentierung, Flusskontrolle; stellt sicher, dass Daten zuverlässig (TCP) oder schnell (UDP) ankommen.","nr":199,"cat":6},{"id":190,"question":"Welche Schichten des OSI-Modells gehören zu den anwendungsorientierten Schichten? Erklären Sie auch kurz die Aufgaben dieser Schichten.","answer":"Anwendungsorientiert sind die Schichten 5–7:\n• Sitzungsschicht (5): etabliert, verwaltet und beendet Sitzungen zwischen Anwendungen. Sie ermöglicht die Synchronisierung von Datenübertragungen (Wiederaufsetzpunkte) und bietet Mechanismen für den Aufbau und das Beenden von Verbindungen.\n• Darstellungsschicht (6): kümmert sich um die Datenrepräsentation: Übersetzung zwischen Datenformaten (z. B. Zeichensätze), Komprimierung und Verschlüsselung, damit Daten systemunabhängig verstanden werden.\n• Anwendungsschicht (7): ist die oberste Schicht und stellt Netzwerkdienste und Protokolle für Endanwendungen bereit (z. B. HTTP, SMTP, DNS, FTP); sie ermöglicht die Interaktion zwischen Benutzer bzw. Anwendung und dem Netzwerk.","nr":200,"cat":6},{"id":191,"question":"Nennen Sie Beispiele für Protokolle, welche auf der Vermittlungsschicht und der Transportschicht des OSI-Modells arbeiten.","answer":"Vermittlungsschicht (Schicht 3) – Adressierung und Routing zwischen Netzen:\n• IP (IPv4, IPv6)\n• IPsec (Absicherung von IP-Verbindungen)\n• ICMP (Fehler- und Diagnosemeldungen, z. B. ping)\n• Routingprotokolle wie OSPF (RIP/BGP setzen technisch auf höheren Schichten auf, steuern aber Schicht 3)\nTransportschicht (Schicht 4) – Ende-zu-Ende-Transport zwischen Anwendungen (Ports):\n• TCP: verbindungsorientiert, zuverlässig (z. B. HTTP, E-Mail)\n• UDP: verbindungslos, schnell (z. B. DNS, VoIP)\n• (SCTP; QUIC baut auf UDP auf)","nr":201,"cat":6},{"id":192,"question":"Ordnen Sie Hub, Bridge, Router, Switch und Repeater den entsprechenden Schichten des OSI-Modells zu.","answer":"• Bitübertragungsschicht (1): Hub, Repeater – arbeiten nur mit elektrischen Signalen, ohne Adressen auszuwerten\n• Sicherungsschicht (2): Bridge, (Layer-2-)Switch – werten MAC-Adressen aus\n• Vermittlungsschicht (3): Router, Layer-3-Switch – werten IP-Adressen aus\nErgänzung: Gateways/Firewalls mit Applikationsfilter arbeiten bis Schicht 7.","nr":202,"cat":6},{"id":193,"question":"Welche Aufgaben übernehmen Switch, Bridge und Router im Netzwerk und worin unterscheiden sie sich? Gehen Sie hierbei auch auf die Einordnung der richtigen Schicht des OSI-Modells ein.","answer":"• Switch (Schicht 2): verbindet mehrere Geräte in einem lokalen Netzwerk (LAN). Er lernt die MAC-Adressen der angeschlossenen Geräte und leitet Frames gezielt nur an den Port des Zielgeräts weiter (statt an alle wie ein Hub). Jeder Port ist eine eigene Kollisionsdomäne.\n• Bridge (Schicht 2): verbindet zwei (oder wenige) Netzwerksegmente miteinander, arbeitet ebenfalls mit MAC-Adressen, filtert und leitet Daten zwischen den Segmenten weiter. Ein Switch ist im Prinzip eine Multiport-Bridge.\n• Router (Schicht 3): verbindet verschiedene Netzwerke (z. B. LAN mit Internet, verschiedene Subnetze/VLANs). Er arbeitet mit IP-Adressen, wählt per Routing-Tabelle den besten Weg und trennt Broadcastdomänen.","nr":203,"cat":6},{"id":194,"question":"Wofür wird das Network File System (NFS) verwendet?","answer":"NFS ist ein Protokoll für den Zugriff auf Dateien über ein Netzwerk, das hauptsächlich in Unix- und Linux-Umgebungen eingesetzt wird. Es ermöglicht den transparenten Zugriff auf entfernte Dateisysteme: Freigaben eines Servers werden auf dem Client in das lokale Dateisystem eingehängt (gemountet) und können wie lokale Verzeichnisse genutzt werden.\nZweck: gemeinsame Nutzung von Dateien und Daten zwischen verschiedenen Betriebssystemen und Rechnern, zentrale Datenhaltung (z. B. Home-Verzeichnisse auf einem Server, Speicher für Virtualisierung).\nNFS basiert auf dem Client-Server-Modell; Pendant in der Windows-Welt: SMB.","nr":204,"cat":7},{"id":195,"question":"Was ist die Aufgabe des SMB-Protokolls?","answer":"SMB (Server Message Block) ist ein Netzwerkprotokoll, das ursprünglich von IBM/Microsoft entwickelt wurde und hauptsächlich in Windows-Umgebungen verwendet wird.\nEs ermöglicht die gemeinsame Nutzung von Dateien, Druckern und anderen Ressourcen in einem Netzwerk (Datei- und Druckerfreigaben, z. B. \\\\server\\freigabe).\nSMB unterstützt Funktionen wie Authentifizierung, Datei- und Sperrmechanismen (Locking), Verschlüsselung (ab SMB 3) und den Zugriff auf Netzwerkfreigaben. Es ist das Standardprotokoll für die Dateifreigabe in Windows-Netzwerken; unter Linux nutzbar mit Samba.\nPort: TCP 445. Veraltetes SMBv1 ist unsicher (WannaCry) und sollte deaktiviert werden.","nr":205,"cat":7},{"id":196,"question":"Erläutern Sie die Aufgabe eines Hypervisors / Virtual Machine Monitor (VMM).","answer":"Die Hauptaufgabe eines Hypervisors besteht darin, virtuelle Maschinen (VMs) auf einem physischen Computer zu erstellen und auszuführen, wodurch mehrere unabhängige Betriebssysteme und Anwendungen auf einem einzigen physischen Server laufen können.\nDer Hypervisor erstellt eine Abstraktionsschicht zwischen der physischen Hardware und den virtuellen Maschinen:\n• Er verteilt Ressourcen wie Prozessoren, Arbeitsspeicher, Festplatten und Netzwerkschnittstellen zwischen den VMs.\n• Er isoliert die VMs voneinander (Absturz einer VM betrifft andere nicht).\n• Er verwaltet Start, Stopp, Snapshots und Migration der VMs.\nVorteil: bessere Auslastung der Hardware-Ressourcen und effizientere Nutzung der vorhandenen Ressourcen.","nr":206,"cat":7},{"id":197,"question":"Erläutern Sie den Unterschied zwischen einem Hypervisor Typ 1 und einem Hypervisor Typ 2.","answer":"• Hypervisor Typ 1 (Bare-Metal-Hypervisor): wird direkt auf der physischen Hardware eines Computers installiert. Er läuft direkt auf der Hardware, ohne dass ein separates Betriebssystem erforderlich ist. Dies ermöglicht eine direkte Verwaltung der Hardware-Ressourcen und eine bessere Leistung, Sicherheit und Stabilität. Einsatz im Rechenzentrum. Beispiele: VMware ESXi, Microsoft Hyper-V, Proxmox VE/KVM, Xen.\n• Hypervisor Typ 2 (Hosted-Hypervisor): wird als Anwendung auf einem bereits installierten Host-Betriebssystem ausgeführt. Das bedeutet, dass zuerst ein vollständiges Betriebssystem auf der physischen Hardware installiert sein muss. Mehr Overhead, geringere Leistung; einfach für Tests und Desktops. Beispiele: VirtualBox, VMware Workstation.","nr":207,"cat":7},{"id":198,"question":"Wie kann ein bestehender physischer Server mit Betriebssystem in eine virtuelle Maschine konvertiert werden?","answer":"Um einen bestehenden physischen Server in eine VM zu übertragen, gibt es verschiedene Möglichkeiten (P2V – Physical to Virtual):\n• Neuinstallation und Konfiguration des Betriebssystems und der Anwendungen in einer neuen VM, anschließend Datenübernahme\n• Wiederherstellung der Image-Sicherung eines bestehenden Systems in einer neuen virtuellen Maschine\n• Konvertierung eines physischen Servers in eine virtuelle Maschine mittels spezieller Konvertierungstools (z. B. VMware vCenter Converter, Disk2vhd, Veeam), die das laufende System inkl. Daten in eine VM-Festplatte überführen\nNach der Konvertierung: Treiber anpassen (VM-Tools), Hardware-spezifische Software entfernen, Netzwerk prüfen.","nr":208,"cat":7},{"id":199,"question":"Was ist unter dem Funktionsprinzip der Containerisierung zu verstehen?","answer":"Containerisierung ist eine Form der Virtualisierung auf Betriebssystemebene. Anwendungen werden mitsamt aller notwendigen Abhängigkeiten (Bibliotheken, Konfiguration, Laufzeitumgebung) in isolierte Container verpackt, die auf demselben Host-Betriebssystem laufen und dessen Kernel gemeinsam nutzen – ohne eigenes Gast-Betriebssystem.\nVorteile:\n• Portabilität: Container laufen auf jedem unterstützten System gleich („läuft überall“)\n• Isolation: Jeder Container ist von anderen und vom Host-System getrennt\n• Effizienz: leichtgewichtig, starten in Sekunden, benötigen weniger Ressourcen als VMs\n• Skalierbarkeit: einfaches Hinzufügen weiterer Instanzen und Verwaltung über Orchestrierung\nBeispiele: Docker, Podman; Orchestrierung mit Kubernetes.","nr":209,"cat":7},{"id":200,"question":"Beschreiben Sie die Methoden der horizontalen und der vertikalen Skalierung von IT-Infrastruktur.","answer":"• Horizontale Skalierung (Scale-out): bezieht sich auf die Erweiterung eines Systems, indem zusätzliche Ressourcen hinzugefügt werden – also weitere Server, Computer oder Knoten. Die Last wird auf mehrere Systeme verteilt (z. B. per Load Balancer). Vorteile: nahezu unbegrenzt erweiterbar, höhere Ausfallsicherheit; Nachteil: Anwendung muss verteilbar sein, mehr Verwaltungsaufwand.\n• Vertikale Skalierung (Scale-up): bezieht sich auf die Verbesserung der Leistung eines einzelnen Systems, indem die vorhandenen Ressourcen verbessert oder aufgerüstet werden – z. B. mehr CPU-Kerne, RAM oder schnellerer Speicher. Einfach umzusetzen, aber begrenzt durch die Hardware; das System bleibt ein Single Point of Failure.","nr":210,"cat":7},{"id":201,"question":"Erklären Sie die Unterschiede zwischen den Speichersystemen DAS und NAS.","answer":"• DAS (Direct Attached Storage): ein Speichersystem, das direkt an einen Computer oder Server angeschlossen ist (z. B. per SATA, SAS, USB). Es ist nur über diesen Rechner zugänglich. Vorteile: einfach, günstig, sehr schnelle Datenübertragungsrate. Nachteil: nicht direkt im Netzwerk teilbar, schlecht skalierbar.\n• NAS (Network Attached Storage): ein eigenständiges Speichergerät, das mit dem Netzwerk verbunden ist und Speicher dateibasiert über Netzwerkprotokolle (SMB, NFS) bereitstellt. Mehrere Benutzer und Geräte können gleichzeitig darauf zugreifen. Hat eine eigene IP-Adresse und meist eigene Funktionen (RAID, Benutzerverwaltung, Backup). Geringere Geschwindigkeit als DAS, abhängig vom Netzwerk.","nr":211,"cat":7},{"id":202,"question":"Beschreiben Sie die Vorteile, die der Einsatz eines SAN (Storage Area Network) gegenüber einem NAS bietet.","answer":"Ein SAN ist ein eigenes, dediziertes Hochgeschwindigkeitsnetzwerk von Speichergeräten, die den Servern als lokale Laufwerke (blockbasiert) zur Verfügung gestellt werden. Gegenüber einem NAS bietet es:\n• höhere Leistung und geringere Latenz (Fibre Channel, iSCSI; eigenes Netz, belastet das LAN nicht)\n• blockbasierten Zugriff – geeignet für Datenbanken und Virtualisierung\n• bessere Skalierbarkeit: Kapazität kann flexibel erweitert und zentral verwaltet werden\n• hohe Verfügbarkeit und Fehlertoleranz durch redundante Pfade, Snapshots, Replikation\n• die Daten-Volumes können online erweitert werden\nNachteil: deutlich teurer und komplexer.","nr":212,"cat":7},{"id":203,"question":"Erläutern Sie den Unterschied zwischen blockorientierten und dateiorientierten Speichertechniken.","answer":"• Blockorientierte Speicherung: Daten werden in festgelegten Blockgrößen gespeichert und direkt vom Speichermedium gelesen bzw. geschrieben. Der Server sieht den Speicher wie eine lokale Festplatte und legt selbst ein Dateisystem darauf an. Hohe Performance, ideal für Datenbanken und VMs. Diese Methode ist typisch für SAN (Storage Area Network) und DAS.\n• Dateiorientierte Speicherung: arbeitet auf Datei-Ebene. Sie lesen und schreiben ganze Dateien anstelle von Blöcken; das Dateisystem wird vom Speichersystem verwaltet und über Protokolle wie SMB oder NFS freigegeben. Einfach gemeinsam nutzbar. Diese Methode wird bei NAS (Network Attached Storage) verwendet.","nr":213,"cat":7},{"id":204,"question":"Was bedeutet der Begriff „Clustergröße“ im Kontext von Laufwerken und welchen Einfluss hat die Wahl der Clustergröße auf die Speicherleistung?","answer":"Die Clustergröße (Zuordnungseinheit) bezeichnet die kleinste Menge an Speicherplatz, die ein Dateisystem einer Datei zuordnen kann. Jede Datei belegt mindestens einen ganzen Cluster, unabhängig von ihrer tatsächlichen Größe (z. B. NTFS-Standard 4 KB).\n• Kleine Clustergröße: Speicherplatz wird effizienter genutzt, da weniger verschwendet wird (geringer Verschnitt bei vielen kleinen Dateien). Nachteil: Große Dateien bestehen aus sehr vielen Clustern → mehr Verwaltungsaufwand, stärkere Fragmentierung, langsamer.\n• Große Clustergröße: schneller beim Lesen und Schreiben großer Dateien (weniger Cluster zu verwalten), aber mehr Speicherplatz wird bei kleinen Dateien verschwendet.\nWahl je nach Einsatz: viele kleine Dateien → klein; Video/Backups → groß.","nr":214,"cat":7},{"id":205,"question":"Was ist Deduplizierung in der Datenverarbeitung und wie wirkt sie sich auf Speichereffizienz und Performance aus?","answer":"Deduplizierung ist ein Verfahren in der Datenverwaltung, bei dem redundante (doppelte) Datenkopien eliminiert werden, um den Speicherbedarf zu reduzieren. Identische Daten bzw. Datenblöcke werden nur einmal physisch gespeichert; weitere Vorkommen werden durch Verweise (Pointer) auf diese einzige Kopie ersetzt. Erkennung über Hashwerte.\n• Speichereffizienz: deutlich weniger Speicherbedarf – besonders bei Backups und VMs mit vielen gleichen Daten.\n• Performance: Weniger Daten müssen übertragen und geschrieben werden (z. B. schnellere Backups über WAN). Allerdings kostet das Berechnen der Hashwerte und das Zusammensetzen der Daten beim Lesen Rechenleistung, was die Performance auch verschlechtern kann.\nHäufig in Speichersystemen und Datensicherung eingesetzt.","nr":215,"cat":7},{"id":206,"question":"Was versteht man unter Datenkomprimierung und welche Auswirkungen hat sie auf den Speicherbedarf und die Datenübertragung?","answer":"Datenkomprimierung ist der Prozess der Reduzierung der Größe von Daten, indem redundante oder unwichtige Informationen effizienter kodiert bzw. entfernt werden.\n• verlustfrei: Originaldaten können vollständig wiederhergestellt werden (ZIP, PNG)\n• verlustbehaftet: einige Daten gehen verloren, dafür höhere Kompressionsrate (JPEG, MP3)\nAuswirkungen:\n• Speicherbedarf: sinkt, da komprimierte Daten weniger Speicherplatz benötigen.\n• Datenübertragung: Weniger Daten müssen übertragen werden → kürzere Übertragungszeiten, geringere Bandbreitennutzung.\n• Nachteil: Komprimieren und Dekomprimieren benötigt Rechenleistung (CPU-Last, Zeit).","nr":216,"cat":7},{"id":207,"question":"Es soll eine Vielzahl von Bildern gespeichert werden. Wie wird die Dateigröße eines Bildes in Byte berechnet?","answer":"Die Dateigröße eines unkomprimierten Bildes berechnet sich so:\nDateigröße (Byte) = Breite (Pixel) × Höhe (Pixel) × Farbtiefe (Byte)\nDie Farbtiefe wird oft in Bit angegeben → durch 8 teilen (24 Bit = 3 Byte, 32 Bit = 4 Byte).\nBeispiel: 1920 × 1080 Pixel mit 24 Bit Farbtiefe:\n1920 × 1080 × 3 Byte = 6.220.800 Byte ≈ 6,22 MB (≈ 5,93 MiB)\nFür viele Bilder: Ergebnis × Anzahl der Bilder. Achtung bei der Umrechnung: 1 KB = 1000 Byte, 1 KiB = 1024 Byte.","nr":217,"cat":7},{"id":208,"question":"Beschreiben Sie kurz die Lizenzmodelle kommerzielle Lizenz, Open Source und Freeware.","answer":"• Kommerzielle Lizenzen: erfordern in der Regel eine Zahlung oder den Erwerb einer Lizenz, um die Software nutzen zu können. Die Bedingungen und Einschränkungen variieren je nach Lizenzvereinbarung des Anbieters (z. B. Anzahl Nutzer/Geräte, Kauf oder Abo). Quellcode ist meist nicht zugänglich (proprietär).\n• Open-Source-Lizenzen: ermöglichen die Einsichtnahme, Nutzung, Weitergabe und Modifizierung des Quellcodes einer Software durch die Öffentlichkeit. Open-Source-Software steht in der Regel kostenlos zur Verfügung; die Lizenzbedingungen (z. B. GPL, MIT, Apache) regeln, wie der Quellcode weiterverbreitet und modifiziert werden kann.\n• Freeware: bezeichnet Software, die kostenlos genutzt werden kann, jedoch dennoch urheberrechtlich geschützt ist. Der Quellcode ist nicht offen; Veränderung meist nicht erlaubt, kommerzielle Nutzung teils eingeschränkt.","nr":218,"cat":7},{"id":209,"question":"Was besagt die GNU General Public License?","answer":"Die GNU General Public License (GPL) ist eine weit verbreitete Open-Source-Lizenz, die von der Free Software Foundation (FSF) entwickelt wurde.\nDie GPL erlaubt die freie Nutzung, Verteilung und Modifizierung der Software – auch kommerziell.\nSie erfordert jedoch, dass alle abgeleiteten Werke unter derselben Lizenz veröffentlicht werden („Copyleft“): Wer GPL-Software verändert und weitergibt, muss den Quellcode seiner veränderten Version ebenfalls offenlegen und unter der GPL weitergeben.\nDies stellt sicher, dass der Quellcode von abgeleiteten Versionen ebenfalls offen zugänglich bleibt. Beispiel: Linux-Kernel (GPLv2).","nr":219,"cat":7},{"id":210,"question":"Wie unterscheiden sich die beiden Lizenztypen User CAL und Device CAL?","answer":"CAL = Client Access License: Zugriffslizenz, die zum Zugriff auf Serverdienste (z. B. Windows Server, Exchange) berechtigt.\n• User CAL: Lizenz für einen Benutzer, der von beliebigen Geräten aus auf ein System zugreifen darf. Dieser Lizenztyp ist vorteilhaft, wenn Nutzer oft mehrere verschiedene Geräte verwenden (PC, Laptop, Smartphone, Homeoffice).\n• Device CAL: Lizenz für ein Gerät, auf dem beliebig viele Benutzer ein System nutzen können. Dieser Lizenztyp ist vorteilhaft, wenn mehrere Nutzer ein gemeinsames Gerät benutzen (z. B. Schichtbetrieb, Kassen, Schulungsrechner).\nWahl: Rechnen, was günstiger ist – Anzahl Benutzer vs. Anzahl Geräte.","nr":220,"cat":7},{"id":211,"question":"Erklären Sie den Unterschied zwischen Individualsoftware und Standardsoftware.","answer":"• Individualsoftware: wird nach den spezifischen Anforderungen des Auftraggebers entwickelt. Dies bedeutet, dass die Software genau auf die Geschäftsprozesse und Anforderungen abgestimmt ist und höchste Effizienz und Produktivität ermöglicht. Nachteile: hohe Kosten, lange Entwicklungszeit, Abhängigkeit vom Entwickler bei Wartung.\n• Standardsoftware: eine vorgefertigte Softwarelösung, die für einen breiten Markt von Benutzern entwickelt wurde, mit Funktionen, die für viele verschiedene Unternehmen und Anwender geeignet sind (z. B. MS Office, SAP). Vorteile: niedrigere Kosten und sofortige Verfügbarkeit; wird oft von großen Softwareunternehmen entwickelt, die regelmäßige Updates und Kundensupport bieten. Nachteil: Prozesse müssen ggf. an die Software angepasst werden.","nr":221,"cat":7},{"id":212,"question":"Erläutern Sie den Begriff Service Level Agreement (SLA).","answer":"Ein Service Level Agreement (SLA) ist eine schriftliche Vereinbarung zwischen einem Dienstleister und einem Kunden, die die vereinbarten Leistungsparameter und -ziele für eine bestimmte Dienstleistung oder ein Produkt festlegt.\nEin SLA definiert die Erwartungen hinsichtlich z. B.:\n• Qualität und Umfang des Services\n• Verfügbarkeit (z. B. 99,9 % pro Jahr)\n• Reaktions- und Lösungszeiten bei Störungen\n• Supportzeiten und Ansprechpartner\n• Vertragsstrafen bei Nichteinhaltung\nEs dient als Grundlage für die Bewertung der Servicequalität.","nr":222,"cat":7},{"id":213,"question":"Was sind die Aufgaben des First-Level-Supports?","answer":"Der First-Level-Support ist der erste Kontakt für Kunden bei Supportanfragen (Service Desk/Helpdesk). Die Aufgaben des 1st-Level-Supports umfassen:\n• Entgegennahme von Supportanfragen (Telefon, E-Mail, Ticketsystem)\n• Klassifizierung und Priorisierung von Supportanfragen\n• grundlegende Unterstützung, um häufig auftretende Probleme zu lösen (z. B. Passwort zurücksetzen, Standardfehler)\n• Weiterleitung von Anfragen, wenn das Problem über den Bereich des 1st-Level-Supports hinausgeht\n• Dokumentation der Supportanfragen in einem Ticketsystem oder einer Wissensdatenbank\n• professionelle und freundliche Kommunikation mit den Kunden","nr":223,"cat":7},{"id":214,"question":"Erklären Sie den Unterschied zwischen dem 2nd-Level- und 3rd-Level-Support.","answer":"• Second-Level-Support: die erste Eskalationsstufe, wenn eine Anfrage nicht vom First-Level-Support gelöst werden kann. Er besteht aus erfahrenen Technikern oder Spezialisten, die komplexe Anfragen bearbeiten, Fehlerdiagnosen durchführen und spezifische Lösungen bereitstellen (tieferes technisches Wissen, Zugriff auf Systeme).\n• Third-Level-Support: die höchste Eskalationsstufe im Supportprozess. Er umfasst hochspezialisierte Fachleute (oft Entwickler oder Hersteller), die über umfangreiches technisches Wissen und Expertise verfügen. Sie sind in der Lage, komplexe Probleme zu analysieren und umfassende Fehlerbehebung durchzuführen (z. B. Bugfixes im Code), die über die Möglichkeiten des Second-Level-Supports hinausgehen.","nr":224,"cat":7},{"id":215,"question":"Welchem Zweck dienen Standard Operating Procedures (SOP)?","answer":"Standard Operating Procedures (SOP) sind schriftliche Anweisungen oder Leitfäden, die die spezifischen Schritte und Verfahren beschreiben, die in einer Organisation oder einem Unternehmen bei bestimmten Aufgaben oder Prozessen befolgt werden sollen (z. B. Benutzeranlage, Backup-Prüfung, Notfallablauf).\nSie dienen dazu:\n• eine klare Struktur, Einheitlichkeit und Effizienz in organisatorischen Abläufen zu gewährleisten\n• die Qualität zu kontrollieren und die Einhaltung von Standards sicherzustellen\n• Fehler zu reduzieren und Wissen zu dokumentieren\n• neue Mitarbeitende schneller einzuarbeiten","nr":225,"cat":7},{"id":216,"question":"Beschreiben Sie, was unter dem ITIL-Framework zu verstehen ist.","answer":"ITIL (Information Technology Infrastructure Library) ist ein Framework für das IT-Service-Management (ITSM), das bewährte Praktiken (Best Practices) und Standards für die effektive Bereitstellung und Verwaltung von IT-Services bietet.\nEs wurde entwickelt, um die Qualität von IT-Services zu verbessern, die Kundenzufriedenheit zu steigern und die Effizienz der IT-Organisationen zu maximieren.\nITIL besteht aus einer Sammlung von Best Practices, die in verschiedene Prozesse und Funktionen unterteilt sind – z. B. Incident Management, Problem Management, Change Management, Service Desk, Service Level Management.\nEs wird weltweit von Organisationen verschiedener Größen und Branchen eingesetzt und ist zu einem Industriestandard für das IT-Service-Management geworden (aktuelle Version: ITIL 4).","nr":226,"cat":7}];
CARDS.push(...[{"id": 301, "question": "Wie lang darf die Probezeit in einem Ausbildungsverhältnis sein?", "answer": "Mindestens 1 Monat, höchstens 4 Monate (§ 20 BBiG).\nWährend der Probezeit können beide Seiten jederzeit ohne Kündigungsfrist und ohne Angabe von Gründen kündigen – aber immer schriftlich.", "nr": null, "cat": 8}, {"id": 302, "question": "Wie kann ein Ausbildungsverhältnis nach der Probezeit gekündigt werden?", "answer": "• Aus wichtigem Grund fristlos – von beiden Seiten, innerhalb von 2 Wochen nach Bekanntwerden des Grundes.\n• Vom Azubi mit 4 Wochen Frist, wenn er die Ausbildung aufgibt oder einen anderen Beruf erlernen will.\n• Eine ordentliche Kündigung durch den Ausbildungsbetrieb ist nicht möglich.\nDie Kündigung muss schriftlich erfolgen, nach der Probezeit mit Angabe der Gründe (§ 22 BBiG).", "nr": null, "cat": 8}, {"id": 303, "question": "Wann endet ein Ausbildungsverhältnis?", "answer": "Mit Ablauf der vereinbarten Ausbildungszeit. Wird die Abschlussprüfung vorher bestanden, endet es mit der Bekanntgabe des Ergebnisses durch den Prüfungsausschuss (§ 21 BBiG).\nWird der Azubi danach weiterbeschäftigt, ohne dass etwas vereinbart wurde, gilt ein unbefristetes Arbeitsverhältnis als begründet (§ 24 BBiG).", "nr": null, "cat": 8}, {"id": 304, "question": "Was muss mindestens im Ausbildungsvertrag stehen (§ 11 BBiG)?", "answer": "• Art, sachliche und zeitliche Gliederung sowie Ziel der Ausbildung\n• Beginn und Dauer\n• Ausbildungsmaßnahmen außerhalb der Ausbildungsstätte\n• Dauer der regelmäßigen täglichen Ausbildungszeit\n• Dauer der Probezeit\n• Zahlung und Höhe der Vergütung\n• Dauer des Urlaubs\n• Voraussetzungen der Kündigung\n• Hinweis auf Tarifverträge und Betriebsvereinbarungen\n• Form des Ausbildungsnachweises\nNicht dazu gehören z. B. Gleitzeitregelungen.", "nr": null, "cat": 8}, {"id": 305, "question": "Welche Regeln gelten nach dem Jugendarbeitsschutzgesetz (unter 18 Jahre)?", "answer": "• Höchstens 8 Stunden täglich und 40 Stunden pro Woche, 5-Tage-Woche\n• Pausen: 30 Minuten bei mehr als 4,5 Stunden, 60 Minuten bei mehr als 6 Stunden\n• Mindestens 12 Stunden Freizeit zwischen zwei Arbeitstagen\n• Urlaub je nach Alter zu Beginn des Kalenderjahres: unter 16 → 30 Werktage, unter 17 → 27 Werktage, unter 18 → 25 Werktage\n• An einem Berufsschultag mit mehr als 5 Unterrichtsstunden (je 45 Min.) einmal pro Woche keine Beschäftigung mehr im Betrieb", "nr": null, "cat": 8}, {"id": 306, "question": "Wie viel Urlaub steht Erwachsenen gesetzlich mindestens zu?", "answer": "Nach dem Bundesurlaubsgesetz mindestens 24 Werktage pro Jahr. Werktage sind Montag bis Samstag.\nBei einer 5-Tage-Woche entspricht das 20 Arbeitstagen.\nDer volle Anspruch entsteht erstmals nach 6 Monaten Betriebszugehörigkeit (Wartezeit).", "nr": null, "cat": 8}, {"id": 307, "question": "Was regelt das Arbeitszeitgesetz?", "answer": "• Werktägliche Arbeitszeit höchstens 8 Stunden. Sie darf auf 10 Stunden steigen, wenn im Durchschnitt von 6 Monaten bzw. 24 Wochen 8 Stunden nicht überschritten werden.\n• Pausen: 30 Minuten bei 6 bis 9 Stunden, 45 Minuten bei mehr als 9 Stunden\n• Ruhezeit nach Arbeitsende: mindestens 11 Stunden\n• An Sonn- und Feiertagen grundsätzlich keine Beschäftigung (mit Ausnahmen)", "nr": null, "cat": 8}, {"id": 308, "question": "Welche gesetzlichen Kündigungsfristen gelten für Arbeitnehmer (§ 622 BGB)?", "answer": "• Grundkündigungsfrist: 4 Wochen zum 15. oder zum Ende eines Kalendermonats\n• In einer vereinbarten Probezeit (max. 6 Monate): 2 Wochen\n• Kündigt der Arbeitgeber, verlängert sich die Frist mit der Betriebszugehörigkeit: ab 2 Jahren 1 Monat zum Monatsende, gestaffelt bis 7 Monate ab 20 Jahren.\nDie Kündigung muss schriftlich erfolgen (§ 623 BGB). E-Mail oder SMS reichen nicht.", "nr": null, "cat": 8}, {"id": 309, "question": "Wann gilt das Kündigungsschutzgesetz und welche Kündigungsgründe kennt es?", "answer": "Es gilt in Betrieben mit mehr als 10 Arbeitnehmern, wenn das Arbeitsverhältnis länger als 6 Monate besteht.\nEine Kündigung muss sozial gerechtfertigt sein:\n• personenbedingt, z. B. lange Krankheit mit negativer Prognose\n• verhaltensbedingt, z. B. Diebstahl oder wiederholtes Zuspätkommen (meist nach Abmahnung)\n• betriebsbedingt, z. B. Wegfall des Arbeitsplatzes (mit Sozialauswahl)\nKündigungsschutzklage: innerhalb von 3 Wochen beim Arbeitsgericht.", "nr": null, "cat": 8}, {"id": 310, "question": "Wer hat einen besonderen Kündigungsschutz?", "answer": "• Schwangere und Mütter bis 4 Monate nach der Entbindung (Mutterschutzgesetz)\n• Beschäftigte in Elternzeit\n• Schwerbehinderte Menschen: Kündigung nur mit Zustimmung des Integrationsamts\n• Betriebsrats- und JAV-Mitglieder: ordentliche Kündigung ausgeschlossen\n• Auszubildende nach der Probezeit", "nr": null, "cat": 8}, {"id": 311, "question": "Was gilt für befristete Arbeitsverträge (TzBfG)?", "answer": "• Ohne sachlichen Grund höchstens 2 Jahre, innerhalb dieser Zeit bis zu 3 Verlängerungen\n• Mit sachlichem Grund (z. B. Elternzeitvertretung, Projekt) auch länger\n• Die Befristung muss schriftlich vereinbart werden, sonst gilt der Vertrag als unbefristet.\n• Das Arbeitsverhältnis endet mit Fristablauf, ohne dass gekündigt werden muss.", "nr": null, "cat": 8}, {"id": 312, "question": "Wann kann ein Betriebsrat gewählt werden und wer darf wählen?", "answer": "• In Betrieben mit mindestens 5 ständigen wahlberechtigten Arbeitnehmern, von denen 3 wählbar sind\n• Wahlberechtigt (aktives Wahlrecht): alle Arbeitnehmer ab 16 Jahren\n• Wählbar (passives Wahlrecht): Wahlberechtigte ab 18 Jahren, die mindestens 6 Monate dem Betrieb angehören\n• Amtszeit: 4 Jahre", "nr": null, "cat": 8}, {"id": 313, "question": "Was ist die Jugend- und Auszubildendenvertretung (JAV)?", "answer": "Sie vertritt Arbeitnehmer unter 18 Jahren und alle Auszubildenden – seit Juni 2021 ohne Altersgrenze (früher nur Auszubildende unter 25).\nWählbar sind Beschäftigte unter 25 und alle Auszubildenden, aber keine Betriebsratsmitglieder.\nSie wird gewählt, wenn es einen Betriebsrat gibt und mindestens 5 solche Beschäftigte im Betrieb sind. Amtszeit: 2 Jahre.\nDie JAV kann selbst keine Vereinbarungen mit dem Arbeitgeber schließen. Sie handelt über den Betriebsrat, z. B. indem sie Anträge stellt und an Betriebsratssitzungen teilnimmt.", "nr": null, "cat": 8}, {"id": 314, "question": "Welche Beteiligungsrechte hat der Betriebsrat?", "answer": "Von schwach nach stark:\n• Informationsrecht, z. B. bei der Personalplanung\n• Anhörungs- und Beratungsrecht: vor jeder Kündigung anhören, sonst ist die Kündigung unwirksam\n• Widerspruchsrecht bzw. Zustimmungsverweigerung bei personellen Einzelmaßnahmen (Einstellung, Versetzung) in Betrieben mit mehr als 20 Arbeitnehmern\n• Echte Mitbestimmung in sozialen Angelegenheiten (§ 87 BetrVG), z. B. Beginn und Ende der Arbeitszeit, Pausen, Urlaubsgrundsätze, technische Überwachung (z. B. Zeiterfassung), Entlohnungsgrundsätze\nKeine Mitbestimmung bei rein wirtschaftlichen Entscheidungen, z. B. Rechtsformwechsel oder Lieferantenwahl.", "nr": null, "cat": 8}, {"id": 315, "question": "Was ist Tarifautonomie, und welche Arten von Tarifverträgen gibt es?", "answer": "Tarifautonomie (Art. 9 GG): Gewerkschaften und Arbeitgeberverbände bzw. einzelne Arbeitgeber handeln Arbeitsbedingungen ohne staatliche Einmischung aus.\n• Manteltarifvertrag: allgemeine Arbeitsbedingungen wie Arbeitszeit, Urlaub, Kündigungsfristen; meist mehrjährig\n• Lohn- und Gehaltstarifvertrag: Höhe der Vergütung; kürzere Laufzeit\nWährend der Laufzeit gilt die Friedenspflicht: keine Streiks. Abweichungen sind nur zugunsten der Arbeitnehmer erlaubt (Günstigkeitsprinzip).", "nr": null, "cat": 8}, {"id": 316, "question": "In welcher Reihenfolge läuft eine Tarifauseinandersetzung ab?", "answer": "1. Kündigung des bestehenden Tarifvertrags\n2. Tarifverhandlungen\n3. Erklärung des Scheiterns\n4. ggf. Schlichtung\n5. Urabstimmung über Streik (meist mindestens 75 % Zustimmung)\n6. Streik bzw. Aussperrung\n7. Neue Verhandlungen und Einigung\n8. Urabstimmung über das Ergebnis (meist mindestens 25 % Zustimmung)\n9. Neuer Tarifvertrag", "nr": null, "cat": 8}, {"id": 317, "question": "Welche Rangfolge haben die Rechtsquellen im Arbeitsrecht?", "answer": "Grundgesetz → Gesetze → Rechtsverordnungen → Tarifvertrag → Betriebsvereinbarung → Arbeitsvertrag → Weisungsrecht des Arbeitgebers.\nEine niedrigere Regelung darf von einer höheren grundsätzlich nur zugunsten des Arbeitnehmers abweichen (Günstigkeitsprinzip).\nDie Betriebsvereinbarung schließt der Arbeitgeber mit dem Betriebsrat. Sie gilt für alle Arbeitnehmer des Betriebs.", "nr": null, "cat": 8}, {"id": 318, "question": "Welche Zweige hat die gesetzliche Sozialversicherung, und wer zahlt die Beiträge?", "answer": "• Krankenversicherung: Träger Krankenkassen\n• Pflegeversicherung: Pflegekassen\n• Rentenversicherung: Deutsche Rentenversicherung\n• Arbeitslosenversicherung: Bundesagentur für Arbeit\n• Unfallversicherung: Berufsgenossenschaften\nKV, PV, RV und AV zahlen Arbeitgeber und Arbeitnehmer grundsätzlich je zur Hälfte. Ausnahme: Den Kinderlosenzuschlag in der PV zahlt der Arbeitnehmer allein. Die Unfallversicherung zahlt allein der Arbeitgeber.", "nr": null, "cat": 8}, {"id": 319, "question": "Was bedeuten Beitragsbemessungsgrenze und Versicherungspflichtgrenze?", "answer": "• Beitragsbemessungsgrenze: Einkommen bis zu dieser Grenze ist beitragspflichtig. Für den Teil darüber werden keine Beiträge mehr fällig. Der Arbeitnehmer bleibt aber versichert.\n• Versicherungspflichtgrenze (Jahresarbeitsentgeltgrenze, nur KV/PV): Wer darüber verdient, kann aus der gesetzlichen in die private Krankenversicherung wechseln.\nIn der Rentenversicherung gibt es keine Versicherungspflichtgrenze.", "nr": null, "cat": 8}, {"id": 320, "question": "Was leistet die gesetzliche Unfallversicherung?", "answer": "Träger sind die Berufsgenossenschaften, die Beiträge zahlt allein der Arbeitgeber.\nVersichert sind Arbeitsunfälle, Wegeunfälle auf dem direkten Weg zur und von der Arbeit sowie Berufskrankheiten.\nLeistungen: Heilbehandlung und Reha, Verletztengeld, Pflegegeld, Verletztenrente (bei mindestens 20 % Minderung der Erwerbsfähigkeit).\nDer Arbeitgeber muss einen Unfall der Berufsgenossenschaft melden, wenn der Beschäftigte mehr als 3 Tage arbeitsunfähig ist.", "nr": null, "cat": 8}, {"id": 321, "question": "Wie lange zahlt der Arbeitgeber bei Krankheit das Gehalt weiter?", "answer": "Nach dem Entgeltfortzahlungsgesetz bis zu 6 Wochen pro Krankheit, mit vollem Entgelt. Der Anspruch besteht nach 4 Wochen ununterbrochener Beschäftigung.\nDanach zahlt die Krankenkasse Krankengeld: 70 % des Bruttos, höchstens 90 % des Nettos.\nDie Arbeitsunfähigkeit muss dem Arbeitgeber unverzüglich gemeldet werden.", "nr": null, "cat": 8}, {"id": 322, "question": "Was gilt beim Mutterschutz und bei der Elternzeit?", "answer": "• Schutzfrist: 6 Wochen vor und 8 Wochen nach der Entbindung (12 Wochen bei Früh- oder Mehrlingsgeburt). Danach besteht ein Beschäftigungsverbot.\n• Kündigungsverbot ab Beginn der Schwangerschaft bis 4 Monate nach der Entbindung\n• Elternzeit: bis zu 3 Jahre pro Kind, nehmbar bis zum 8. Geburtstag; Kündigungsschutz während der Elternzeit", "nr": null, "cat": 8}, {"id": 323, "question": "Welche Rechtsformen sollte man für die WiSo-Prüfung kennen?", "answer": "• Einzelunternehmen: Inhaber haftet unbeschränkt\n• OHG: alle Gesellschafter haften unbeschränkt und gesamtschuldnerisch\n• KG: Komplementär haftet unbeschränkt, Kommanditist nur bis zur Höhe seiner Einlage\n• GmbH: Stammkapital mindestens 25.000 €, Haftung nur mit dem Gesellschaftsvermögen. Organe: Geschäftsführer und Gesellschafterversammlung\n• UG (haftungsbeschränkt): GmbH mit weniger als 25.000 € Stammkapital (ab 1 €)\n• AG: Grundkapital mindestens 50.000 €. Organe: Vorstand, Aufsichtsrat, Hauptversammlung\n• GmbH & Co. KG: Eine GmbH ist der Komplementär.", "nr": null, "cat": 8}, {"id": 324, "question": "Wie entsteht eine GmbH?", "answer": "1. Notariell beurkundeter Gesellschaftsvertrag\n2. Einzahlung des Stammkapitals: mindestens die Hälfte bzw. 12.500 €\n3. Bestellung des Geschäftsführers\n4. Anmeldung und Eintragung ins Handelsregister. Erst mit der Eintragung entsteht die GmbH als juristische Person.\nEin Gesellschafter darf zugleich Geschäftsführer sein.", "nr": null, "cat": 8}, {"id": 325, "question": "Was ist der Unterschied zwischen Prokura und Handlungsvollmacht?", "answer": "Prokura (Zusatz „ppa.“):\n• erteilt ein Kaufmann ausdrücklich\n• wird ins Handelsregister eingetragen\n• erlaubt fast alle Geschäfte eines Handelsgewerbes\n• Ausnahmen: Grundstücke verkaufen oder belasten, Bilanz und Steuererklärung unterschreiben, Prokura erteilen, Insolvenz anmelden, Geschäft verkaufen\n\nHandlungsvollmacht (Zusatz „i. V.“, bei Einzelvollmacht oft „i. A.“):\n• keine Eintragung im Handelsregister\n• allgemeine Vollmacht: alle gewöhnlichen Geschäfte\n• Artvollmacht: eine bestimmte Art von Geschäften\n• Einzelvollmacht: ein einzelnes Geschäft", "nr": null, "cat": 8}, {"id": 326, "question": "Welche Arten von Kaufleuten gibt es nach dem HGB?", "answer": "• Istkaufmann: betreibt ein Handelsgewerbe mit kaufmännischem Geschäftsbetrieb. Er muss sich ins Handelsregister eintragen lassen; die Eintragung ist nur deklaratorisch (bestätigend).\n• Kannkaufmann: Kleingewerbe oder Land- und Forstwirtschaft. Er wird erst durch die freiwillige Eintragung Kaufmann (konstitutiv).\n• Formkaufmann: Kapitalgesellschaften wie GmbH und AG sind kraft ihrer Rechtsform Kaufleute.", "nr": null, "cat": 8}, {"id": 327, "question": "Wie kommt ein Kaufvertrag zustande, und welche Rechte gibt es bei mangelhafter Lieferung?", "answer": "Ein Kaufvertrag entsteht durch zwei übereinstimmende Willenserklärungen: Antrag und Annahme.\nBei einem Mangel hat zuerst die Nacherfüllung Vorrang: Nachbesserung oder Ersatzlieferung, die Wahl hat der Käufer.\nErst wenn sie scheitert: Rücktritt, Minderung oder Schadensersatz.\nGewährleistungsfrist: 2 Jahre. Bei Onlinekäufen haben Verbraucher ein Widerrufsrecht von 14 Tagen.", "nr": null, "cat": 8}, {"id": 328, "question": "Was regelt die Geschäftsfähigkeit?", "answer": "• Unter 7 Jahren: geschäftsunfähig, Willenserklärungen sind nichtig.\n• 7 bis 17 Jahre: beschränkt geschäftsfähig. Verträge sind schwebend unwirksam, bis die gesetzlichen Vertreter zustimmen. Ausnahmen: Geschäfte mit Taschengeld (§ 110 BGB), lediglich rechtliche Vorteile und Geschäfte im Rahmen eines genehmigten Arbeitsverhältnisses.\n• Ab 18 Jahren: voll geschäftsfähig", "nr": null, "cat": 8}, {"id": 329, "question": "Wie hängen Angebot, Nachfrage und Preis zusammen?", "answer": "• Je höher der Preis, desto größer das Angebot und desto kleiner die Nachfrage.\n• Steigt das Angebot stärker als die Nachfrage, entsteht ein Angebotsüberhang. Man spricht von einem Käufermarkt; die Preise sinken eher.\n• Ist die Nachfrage größer als das Angebot, entsteht ein Nachfrageüberhang. Das ist ein Verkäufermarkt; die Preise steigen eher.\n• Beim Gleichgewichtspreis stimmen Angebot und Nachfrage überein.\n• Bedürfnis + Kaufkraft = Bedarf; Bedarf, der am Markt wirksam wird = Nachfrage.", "nr": null, "cat": 8}, {"id": 330, "question": "Was kennzeichnet die soziale Marktwirtschaft?", "answer": "• Privateigentum an Produktionsmitteln\n• Vertragsfreiheit und Gewerbefreiheit\n• Wettbewerb; der Staat schützt ihn durch das Kartellrecht\n• Freie Preisbildung am Markt\n• Sozialer Ausgleich durch den Staat: Sozialversicherung, Sozialgesetzgebung, progressive Steuern\n• Tarifautonomie\nGrundprinzipien der sozialen Sicherung: Solidaritätsprinzip, Subsidiaritätsprinzip und Sozialstaatsprinzip.", "nr": null, "cat": 8}, {"id": 331, "question": "Welche Formen von Unternehmenszusammenschlüssen gibt es?", "answer": "• Kooperation, z. B. Arbeitsgemeinschaft oder Kartell: Die Unternehmen bleiben rechtlich und wirtschaftlich selbstständig. Preis- und Gebietskartelle sind grundsätzlich verboten.\n• Konzern: Die Unternehmen bleiben rechtlich selbstständig, sind aber wirtschaftlich unter einheitlicher Leitung, z. B. durch eine Mehrheitsbeteiligung.\n• Fusion: Die Unternehmen verschmelzen zu einem einzigen und verlieren ihre rechtliche Selbstständigkeit.\nRichtung: horizontal (gleiche Stufe), vertikal (vor- oder nachgelagerte Stufe), diagonal bzw. anorganisch (branchenfremd).", "nr": null, "cat": 8}, {"id": 332, "question": "Welche Kennzahlen kommen in der WiSo-Prüfung häufig vor?", "answer": "• Eigenkapitalrentabilität = Gewinn ÷ Eigenkapital × 100\n• Umsatzrentabilität = Gewinn ÷ Umsatz × 100\n• Produktivität = Ausbringungsmenge ÷ Einsatzmenge, z. B. Umsatz pro Mitarbeiter\n• Wirtschaftlichkeit = Ertrag ÷ Aufwand. Ein Wert über 1 bedeutet wirtschaftlich.\n• Prozentuale Veränderung = (neu − alt) ÷ alt × 100\n• Prozentpunkte = Differenz zweier Prozentwerte, z. B. 9,4 % − 8,5 % = 0,9 Prozentpunkte", "nr": null, "cat": 8}, {"id": 333, "question": "Was sind die Wirtschaftssektoren?", "answer": "• Primärer Sektor: Urproduktion wie Land- und Forstwirtschaft, Fischerei, Bergbau\n• Sekundärer Sektor: Industrie, Handwerk, Energie, Bau (Weiterverarbeitung)\n• Tertiärer Sektor: Dienstleistungen wie Handel, Banken, IT-Dienstleister\nIn Deutschland arbeiten die meisten Beschäftigten im tertiären Sektor.", "nr": null, "cat": 8}, {"id": 334, "question": "Welche Ziele hat die Wirtschaftspolitik (magisches Viereck)?", "answer": "Nach dem Stabilitätsgesetz von 1967:\n• Stabilität des Preisniveaus\n• Hoher Beschäftigungsstand\n• Außenwirtschaftliches Gleichgewicht\n• Stetiges und angemessenes Wirtschaftswachstum\n„Magisch“ heißt es, weil sich die Ziele nicht alle gleichzeitig erreichen lassen (Zielkonflikte).\nZum Sechseck kommen gerechte Einkommens- und Vermögensverteilung sowie Umweltschutz hinzu.", "nr": null, "cat": 8}, {"id": 335, "question": "Was ist beim Arbeitszeugnis zu beachten?", "answer": "Jeder Arbeitnehmer hat bei Ende des Arbeitsverhältnisses Anspruch auf ein schriftliches Zeugnis.\n• Einfaches Zeugnis: Art und Dauer der Tätigkeit\n• Qualifiziertes Zeugnis, auf Verlangen: zusätzlich Leistung und Verhalten\nDas Zeugnis muss wahr und wohlwollend formuliert sein. Auszubildende erhalten ein Ausbildungszeugnis.", "nr": null, "cat": 8}, {"id": 336, "question": "Wie ist die Arbeitsgerichtsbarkeit aufgebaut?", "answer": "Arbeitsgericht → Landesarbeitsgericht → Bundesarbeitsgericht (Erfurt).\nVor der Verhandlung findet eine Güteverhandlung statt.\nIn der 1. Instanz besteht kein Anwaltszwang. Jede Partei trägt ihre Anwaltskosten selbst, auch wenn sie gewinnt.\nZuständig für Streitigkeiten aus dem Arbeits- und Ausbildungsverhältnis. Bei Ausbildungsstreitigkeiten muss vorher ein Schlichtungsausschuss der Kammer angerufen werden, sofern es einen gibt.", "nr": null, "cat": 8}, {"id": 337, "question": "Welche drei Dimensionen hat Nachhaltigkeit?", "answer": "• Ökologisch: Ressourcen schonen, Emissionen senken, z. B. Green IT oder Hardware länger nutzen\n• Ökonomisch: dauerhaft wirtschaftlich erfolgreich sein\n• Sozial: faire Arbeitsbedingungen, Gesundheit, Chancengleichheit\nOft als Drei-Säulen-Modell dargestellt. Unternehmen berichten darüber z. B. im Nachhaltigkeitsbericht (CSR).", "nr": null, "cat": 8}]);

function day(){return Math.floor(Date.now()/86400000)}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Filter ---------- */
const FILTERS=[['all','Alle'],['due','⏰ Fällig'],['weak','🔴 Schwach'],['neu','★ Neu 4. Aufl.'],['marks','🔖 Gemerkt'],...[1,2,3,4,5,6,7,8].map(k=>[String(k),k+' · '+CAT[k]])];
function fSet(f){return String(f||'all').split(',').filter(Boolean)}
function fTog(cur,k){if(k==='all')return 'all';let a=fSet(cur).filter(x=>x!=='all');a=a.includes(k)?a.filter(x=>x!==k):[...a,k];const ix=x=>FILTERS.findIndex(y=>y[0]===x);a.sort((x,y)=>ix(x)-ix(y));return a.length?a.join(','):'all'}
function fLabel(f){return fSet(f).map(k=>{const x=FILTERS.find(y=>y[0]===k);return x?x[1]:k}).join(', ')}
function matchF(c,f){if(typeof f==='string'&&f.includes(','))return f.split(',').some(x=>matchF(c,x));if(f==='all')return true;if(f==='due')return isDue(c);if(f==='weak')return ['red','yellow'].includes(state[c.id]?.rating);if(f==='neu')return !!c.neu;if(f==='marks')return meta.marks.includes(c.id);return String(c.cat)===f}
function chipRow(box,cur,onPick){box.replaceChildren();const onS=new Set(fSet(cur));FILTERS.forEach(([k,l])=>{const b=el('button','chip'+(onS.has(k)?' on':''),esc(k==='due'?l+' ('+CARDS.filter(isDue).length+')':l));b.setAttribute('aria-pressed',onS.has(k));b.onclick=()=>{const nv=fTog(cur,k);cur=nv;const s2=new Set(fSet(nv));box.querySelectorAll('.chip').forEach((c,i)=>{const o=s2.has(FILTERS[i][0]);c.classList.toggle('on',o);c.setAttribute('aria-pressed',o)});onPick(nv);vib(8)};box.appendChild(b)});const on=box.querySelector('.on');if(on)setTimeout(()=>on.scrollIntoView({inline:'center',block:'nearest'}),0)}
function smartPool(f){const cs=CARDS.filter(c=>matchF(c,f));const g=[[],[],[],[],[]];cs.forEach(c=>{const s=state[c.id];if(!s)g[2].push(c);else if(isDue(c))g[s.rating==='red'?0:s.rating==='yellow'?1:3].push(c);else g[4].push(c)});const g4=shuffle(g[4]).sort((a,b)=>(state[a.id].due||0)-(state[b.id].due||0));
  const ord=meta.order||'random';if(ord==='random')return shuffle(cs);if(ord==='nr')return [...cs].sort((a,b)=>(a.cat===8?999:a.nr||29.5)-(b.cat===8?999:b.nr||29.5));
  return [...shuffle(g[0]),...shuffle(g[1]),...shuffle(g[2]),...shuffle(g[3]),...g4]}

/* ---------- Bewertung, XP, Ziele ---------- */
let combo=0;
function activity(xp){const k=dkey();const before=meta.days[k]||0;meta.days[k]=before+1;const oldL=level();meta.xp+=xp;
  if(before+1===meta.goal){setTimeout(()=>{confetti(160);toast('🎯 Tagesziel geschafft! 🔥 '+streak()+' Tage Streak');vib([30,60,30])},350)}
  else if(level()>oldL){setTimeout(()=>{confetti(90);toast('⬆️ Level '+level()+': '+lvlName())},350)}
  checkBadges()}
function rate(id,r,src){const old=state[id]?{...state[id]}:null;const tl0=meta.tl&&meta.tl[id]?[...meta.tl[id]]:null;if(src!=='manual')tally(id,r);const o=old||{streak:0,count:0};const st=r==='green'?o.streak+1:0;const gap=r==='red'?0:r==='yellow'?1:[1,3,7,14,30,60][Math.min(st-1,5)];
  state[id]={rating:r,count:o.count+1,streak:st,due:day()+gap,updated:Date.now()};
  if(r==='green')combo++;else combo=0;
  const xp=(r==='green'?10:r==='yellow'?6:4)+(combo>=5?3:0);activity(xp);save();
  if(combo&&combo%10===0){toast('🔥 '+combo+'er Combo!');vib([20,40,20])}
  return {id,old,xp,tl0}}
function undoRate(h){if(h.old)state[h.id]=h.old;else delete state[h.id];if('tl0' in h){meta.tl=meta.tl||{};if(h.tl0)meta.tl[h.id]=h.tl0;else delete meta.tl[h.id]}const k=dkey();meta.days[k]=Math.max(0,(meta.days[k]||1)-1);meta.xp=Math.max(0,meta.xp-h.xp);combo=0;save()}
function toggleMark(id){const i=meta.marks.indexOf(id);if(i>=0)meta.marks.splice(i,1);else meta.marks.push(id);save();vib(10);return i<0}

let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function confetti(n){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;const w=fx.width=innerWidth,h=fx.height=innerHeight;const cols=['#5fe0c1','#ffcf5c','#ff8fa3','#89b4ff','#c49bff','#fff'];for(let i=0;i<n;i++)parts.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,l:110+Math.random()*50});if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.globalAlpha=Math.min(1,p.l/40);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);fctx.restore()});if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fctx.clearRect(0,0,fx.width,fx.height)}}

function exById(id){return PR&&PR.exams.find(e=>e.id===id)}
function partOf(e,p){return e[p]}
function attempts(eid,p){return meta.ex[eid+'-'+p]||[]}
function bestOf(eid,p){const a=attempts(eid,p);return a.length?Math.max(...a.map(x=>x.pts)):null}
function wqid(e,t){return e.id+'-'+t.n}
function allWQ(){const a=[];if(!PR)return a;PR.exams.forEach(e=>e.wiso.tasks.forEach(t=>a.push([e,t])));return a}
function topicName(k){const t=PR&&PR.topics.find(x=>x[0]===k);return t?t[1]:k}

  loadPruef().then(pr=>{if(cur!=='exam')return;if(!pr)return renderNoData(b);exSeg==='test'?renderTestList(b):renderWisoHome(b)})}
document.querySelectorAll('#exSeg button').forEach(x=>x.onclick=()=>{exSeg=x.dataset.s;vib(6);renderExam()});

  <div class="card" style="margin-top:12px"><h2>📘 WiSo-Merkwissen</h2><p class="small muted">Die WiSo-Karteikarten funktionieren auch ohne Prüfungsdaten.</p><button class="btn primary block" id="wkGo">Karten lernen</button></div>`;$('#wkGo').onclick=()=>{meta.filter='8';save();swipeReset=true;go('swipe')}}

/* --- Übersicht Testprüfungen --- */

function saveRun(){if(R&&(R.kind==='teil'||R.kind==='wiso'))try{localStorage.setItem('ap2_run',JSON.stringify(R))}catch(e){}}
function clearRun(){try{localStorage.removeItem('ap2_run')}catch(e){}}
function startExam(eid,part){const e=exById(eid);if(!e)return;
  R={kind:part==='wiso'?'wiso':'teil',eid,part,el:0,limit:e[part].min*60,phase:'run',paused:false,ans:{},sc:{},i:0,zoom:1,rot:{},tab:'pages',started:Date.now()};
  saveRun();openRunner();toast(part==='wiso'?'⏱ 60 Minuten – viel Erfolg!':'⏱ 90 Minuten – viel Erfolg!')}

  $('#runner').classList.remove('hidden');document.body.classList.add('running');clearInterval(rTick);let last=Date.now();
  rTick=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;if(!R||R.phase!=='run'||R.paused||document.hidden)return;R.el+=dt;const t=$('#rTime');if(t){const left=R.limit-R.el;t.textContent=(left<0?'+':'')+fmtT(Math.abs(left));t.classList.toggle('warn',left<300)}

    if(Math.round(R.el)%5===0)saveRun()},1000);
  renderRunner()}
function closeRunner(){clearInterval(rTick);$('#runner').classList.add('hidden');document.body.classList.remove('running');R=null;if(cur==='exam')renderExam()}
function rHead(title,right){return `<div class="rhead"><button class="rbtn" id="rX" title="Schließen">✕</button><div class="rtitle">${title}</div>${right||''}</div>`}
function renderRunner(){const box=$('#runner');if(!R)return;if(R.kind==='teil')return R.phase==='run'?rTeil(box):R.phase==='grade'?rGrade(box):rResult(box);
  if(R.kind==='wiso')return R.phase==='run'?rWiso(box):rWisoResult(box);if(R.kind==='wp')return rPractice(box);if(R.kind==='view')return rViewer(box)}
function bindX(onX){const x=$('#rX');if(x)x.onclick=onX||(async()=>{if(R&&(R.kind==='teil'||R.kind==='wiso')&&R.phase!=='done'){saveRun();toast('⏸️ Gespeichert – unter „Prüfung“ fortsetzen');}closeRunner()})}

function pagesHtml(pages,raw){const z=R.zoom||1;return `<div class="zoombar"><button class="rbtn" data-z="-">−</button><span class="tiny">${Math.round(z*100)} %</span><button class="rbtn" data-z="+">🔍+</button></div><div class="pages" style="--z:${z}">${pages.map((p,i)=>`<div class="pg ${R.rot[p]?'r'+R.rot[p]:''}"><img loading="lazy" src="${raw?p:isrc(p)}" alt="Seite ${i+1}"><button class="rot" data-r="${esc(p)}" title="Drehen">⟳</button>${pages.length>1?`<span class="pn">${i+1}/${pages.length}</span>`:''}</div>`).join('')}</div>`}
function bindPages(root){root.querySelectorAll('[data-z]').forEach(x=>x.onclick=()=>{R.zoom=Math.min(3,Math.max(1,(R.zoom||1)+(x.dataset.z==='+'?.5:-.5)));saveRun();const pg=root.querySelector('.pages');pg.style.setProperty('--z',R.zoom);root.querySelector('.zoombar .tiny').textContent=Math.round(R.zoom*100)+' %'});

  <button class="btn primary block" id="gSave" style="padding:15px;margin:6px 0 30px">Ergebnis speichern</button></div>`;
  bindX();$('#gOrig').onclick=()=>openViewer(P.solPages,'Lösungshinweise');box.querySelectorAll('img[data-zoom]').forEach(im=>im.onclick=()=>zoomImgs([im.getAttribute('src')]));
  box.querySelectorAll('.step').forEach(st=>st.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{const id=st.dataset.id,mx=+st.dataset.max;let v=+R.sc[id]||0;const d=bt.dataset.d;v=d==='0'?0:d==='max'?mx:d==='+'?Math.min(mx,v+1):Math.max(0,v-1);R.sc[id]=v;st.querySelector('span').textContent=v+'/'+mx;vib(6);
    const t=P.tasks.find(x=>x.n==id.split('-')[0]);box.querySelector(`[data-tt="${t.n}"]`).textContent=taskTotal(t)+' / '+t.pts;$('#gTot').textContent=teilTotal(P,e)+' P';saveRun()}));
  $('#gSave').onclick=()=>{const pts=teilTotal(P,e);const k=R.eid+'-'+R.part;(meta.ex[k]=meta.ex[k]||[]).push({d:Date.now(),pts,min:Math.round(R.el/60)});save();clearRun();R.phase='done';R.pts=pts;activity(25);renderRunner()}}
function rResult(box){const e=exById(R.eid),p=R.pts,n=noteOf(p);const hist=attempts(R.eid,R.part);
  box.innerHTML=rHead('Ergebnis')+`<div class="rbody"><div class="card" style="text-align:center;padding:26px 16px"><div class="muted small">${esc(e.label)} · ${R.part==='t1'?'Teil 1':R.part==='t2'?'Teil 2':'WiSo'}</div><div style="font-size:56px;font-weight:900;margin:6px 0;color:${n<=2?'var(--grn)':n<=4?'var(--yel)':'var(--red)'}">${(+p).toFixed(p%1?1:0)}</div><div class="small">von 100 Punkten</div><h2 style="margin:12px 0 0">Note ${n} · ${NOTEN[n]}</h2><p class="tiny muted">Bearbeitungszeit: ${Math.round(R.el/60)} Min.</p></div>

/* --- WiSo: Antwortlogik --- */
// Zahl eintragen statt Ziffer wählen: keine Antwortliste und im Text ist von keiner Ziffer/Reihenfolge die Rede
function isNumQ(t){if(t._nq!=null)return t._nq;let o=false;t.b.forEach(b=>{if(b.k==='o')o=true});const tx=t.b.filter(b=>b.k!=='o').map(b=>b.t||'').join(' ');return t._nq=!o&&!/Ziffer|Nummer|Reihenfolge|zuordnen|zuzuordnen|Ordnen Sie/i.test(tx)}
function kType(t){let k=t.key;if(k&&typeof k==='object')return Object.values(k).every(v=>/^\d$/.test(v))&&!isNumQ(t)?'multi':'mtext';k=String(k);if(/^\[\d;\d\]$/.test(k))return 'two';if(/^\d(\|\d)?$/.test(k)&&!isNumQ(t))return 'one';return 'text'}
function keyDigits(t){return String(typeof t.key==='object'?Object.values(t.key).join(''):t.key).match(/\d/g)?.map(Number)||[]}
function nOpts(t){const ty=kType(t);if(ty==='multi'){const L=Object.keys(t.key).length;return Math.max(t.no||0,t.opts||0,L,...keyDigits(t))}const o=optList(t).length;return Math.max(t.no||(o>=2?o:Math.max(t.opts||0,5)),...keyDigits(t))}
function nrm(s){s=String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'').replace(/(eur|€|euro|%|prozent|werktage|arbeitstage|tage|wochen|monate|jahre|stunden|std\.?|minuten|min\.?|uhr|p\.?)$/,'');
  let m=s.match(/^(\d{1,2})[:.](\d{2})$/);if(m&&s.includes(':'))return parseInt(m[1])+':'+m[2];
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m)return +m[1]+'.'+(+m[2])+'.'+(m[3].length===2?'20'+m[3]:m[3]);
  let n=s;if(n.includes(','))n=n.replace(/\./g,'').replace(',','.');else if(/\.\d{3}$/.test(n))n=n.replace(/\./g,'');
  const f=parseFloat(n);if(!isNaN(f)&&/^-?[\d.]+$/.test(n))return Math.round(f*100)/100;return s}
function sameVal(a,b){const x=nrm(a),y=nrm(b);if(typeof x==='number'&&typeof y==='number')return Math.abs(x-y)<0.006;return x===y}
function scoreW(t,a){const ty=kType(t),k=t.key;if(a==null||a==='')return 0;
  if(ty==='one'){return String(k).split('|').includes(String(a))?1:0}
  if(ty==='two'){const want=String(k).match(/\d/g);const got=(a||[]).map(String);const hit=want.filter(w=>got.includes(w)).length-Math.max(0,got.length-2);const fr=Math.max(0,hit)/2;return t.teil?fr:(fr===1?1:0)}
  if(ty==='text'){return sameVal(a,k)?1:0}
  const L=Object.keys(k);let ok=0;L.forEach(l=>{if(a&&a[l]!=null&&a[l]!==''&&(ty==='multi'?String(a[l])===String(+k[l]):sameVal(a[l],k[l])))ok++});const fr=ok/L.length;return t.teil?fr:(fr===1?1:0)}
function keyTxt(t){const k=t.key,ty=kType(t);if(ty==='one'){const o=optList(t);return String(k).split('|').map(d=>d+(o[d-1]?' – '+o[d-1]:'')).join(' oder ')}
  if(ty==='two'){const o=optList(t);return String(k).match(/\d/g).map(d=>d+(o[d-1]?' – '+o[d-1]:'')).join(' und ')}
  if(ty==='text')return String(k);return Object.entries(k).map(([l,v])=>l+') '+v).join('  ')}
function optList(t){if(t.img1&&!t.man)return [];const o=[];let run=null;t.b.forEach(b=>{if(b.k==='o'){if(!run){run=[];o.push(run)}run.push(b.t)}else run=null});return o.length?o.reduce((a,b)=>a.length>=b.length?a:b):[]}
function esc2(s){return esc(s).replace(/\n/g,'<br>')}
function tblHtml(t){const rows=t.split('\n').map(r=>r.split('|').map(c=>c.trim()));return `<div class="wtbl"><table>${rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`}
function blocksHtml(bl){let num=0;return bl.map(b=>{if(b.k==='o'){num++;return `<div class="wopt"><span class="wn">${num}</span><span>${esc2(b.t)}</span></div>`}num=0;
  if(b.k==='img')return `<div class="wfig"><img loading="lazy" src="${isrc(b.src)}" alt="Abbildung" data-zoom="1"></div>`;
  if(b.k==='t')return tblHtml(b.t);if(b.k==='f')return `<div class="wframe">${esc2(b.t)}</div>`;return `<p class="wp">${esc2(b.t)}</p>`}).join('')}

function qHtml(t,e,showImg){const W=e.wiso||{};const sh=(t.sh||[]).map(id=>(W.shared||[]).find(s=>s.id===id)).filter(Boolean);

  else if(origAll.length)h+=`<div class="worig ${showImg?'':'hidden'}">${imgsHtml(origAll)}</div><button class="btn sm wtog" style="margin:6px 0 2px">${showImg?'📄 Original ausblenden':'📄 Original anzeigen'}</button>`;

function bindQ(root){const b=root.querySelector('.wtog');if(b)b.onclick=()=>{const o=root.querySelector('.worig.hidden')||root.querySelector('.wq > .worig');o.classList.toggle('hidden');b.textContent=o.classList.contains('hidden')?'📄 Original anzeigen':'📄 Original ausblenden'};

function ansHtml(t,a,lock){const ty=kType(t),N=nOpts(t);

  if(ty==='text')return `<input class="search win" inputmode="decimal" placeholder="Ergebnis eintragen" value="${esc(a||'')}" ${lock?'disabled':''}>`;
  const L=Object.keys(t.key);a=a||{};

function bindAns(root,t,get,set){const ty=kType(t);

    if(ty==='one')a=v;else if(ty==='two'){a=(a||[]).slice();const i=a.indexOf(v);if(i>=0)a.splice(i,1);else{a.push(v);if(a.length>2)a.shift()}}else{a=Object.assign({},a||{});const l=bt.dataset.l;a[l]=a[l]===v?undefined:v}
    set(a);vib(8);root.querySelectorAll('.dg').forEach(x=>{const xv=+x.dataset.v;x.classList.toggle('on',ty==='one'?a===xv:ty==='two'?a.includes(xv):a[x.dataset.l]===xv)})});
  root.querySelectorAll('input.win').forEach(inp=>inp.oninput=()=>{if(ty==='text')set(inp.value);else{const a=Object.assign({},get()||{});a[inp.dataset.l]=inp.value;set(a)}})}

  box.innerHTML=rHead('Durchsicht')+`<div class="wdots">${T.map((x,i)=>{const g=scoreW(x,R.ans[x.n]);return `<button class="${i===R.i?'cur':''} ${g===1?'ok':g>0?'part':'bad'}" data-i="${i}">${x.n}</button>`}).join('')}</div><div class="rbody" id="rBody">

<li><b>Warum keine Zustimmung?</b> Gespeichert wird nur, was die App für ihre Funktion unbedingt braucht (§ 25 Abs. 2 Nr. 2 TDDDG). Dieser Hinweis dient der Transparenz.</li>

async function wipeAll(){if(!await ask('Wirklich ALLE Daten dieser App auf diesem Gerät löschen? Lernstand, Prüfungen, Markierungen und Einstellungen sind danach weg.','Alles löschen'))return;
  window.__wipe=true;try{Object.keys(localStorage).filter(k=>/^ap2/i.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}
  try{if(window.caches)for(const k of await caches.keys())if(/ap2/i.test(k))await caches.delete(k)}catch(e){}
