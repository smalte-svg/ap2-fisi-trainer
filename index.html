<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AP2 Lernen">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1220">
<title>AP2 FISI Lerntrainer</title>
<style>
:root{--bg:#0b1220;--bg2:#0f1a2c;--panel:#14223a;--panel2:#1b2d4a;--text:#eef4fb;--muted:#9fb3c8;--line:#26405f;--acc:#5fe0c1;--red:#ff6b7a;--yel:#ffcf5c;--grn:#4ee59a;--blue:#89b4ff;--c1:#89b4ff;--c2:#ff8fa3;--c3:#ffcf5c;--c4:#c49bff;--c5:#ff9f5a;--c6:#5fe0c1;--c7:#7fd4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-touch-callout:none;-webkit-text-size-adjust:100%;height:100%;margin:0;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit}
#app{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative;overflow:hidden}
.view{flex:1;min-height:0;display:none;overflow-y:auto;overflow-x:hidden}
.view.on{display:flex;flex-direction:column}
.pad{padding:16px 16px 24px}
/* Tabbar */
#tabbar{display:flex;background:#0d1729;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));flex:none}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;border-radius:12px;transition:.15s}
#tabbar button .ic{font-size:22px;line-height:1.1;filter:grayscale(.6);transition:.15s}
#tabbar button.on{color:var(--acc)}
#tabbar button.on .ic{filter:none;transform:translateY(-2px) scale(1.12)}
/* Allgemein */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:650}
.btn.primary{background:linear-gradient(135deg,#5fe0c1,#3cc6a3);color:#062a24;border:0;box-shadow:0 8px 24px #5fe0c133}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}
h1{font-size:24px;margin:0;line-height:1.2}h2{font-size:18px;margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--acc);color:#062a24;border-color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#ffffff10}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
.bar{height:8px;background:#ffffff14;border-radius:9px;overflow:hidden}
.bar>div{height:100%;border-radius:9px;background:linear-gradient(90deg,#3cc6a3,#8af0d6);transition:width .4s}
.ans{white-space:pre-line}
/* Home */
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font-size:26px;line-height:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;min-height:118px}
.mode .e{font-size:30px}
.mode b{display:block;margin-top:6px;font-size:16px}
.mode span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.mode:active{transform:scale(.97)}
.mode::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--g,#5fe0c1);opacity:.12}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats3 b{display:block;font-size:22px}
.catrow{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid #ffffff0d}
.catrow:last-child{border:0}
.week{display:flex;gap:6px;align-items:flex-end;height:64px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;border-radius:6px;background:#ffffff14;min-height:4px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:12px;padding:6px 10px;border-radius:12px;background:#ffffff0a;border:1px dashed var(--line);color:var(--muted)}
.badge.got{background:#5fe0c11a;border:1px solid #5fe0c155;color:var(--text)}
/* Swipe */
#v-swipe{overflow:hidden}
.sw-top{padding:0 16px;flex:none}
.sw-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:4px 0 6px}
.stack{position:relative;flex:1;min-height:0;margin:6px 16px 0}
.sc{position:absolute;inset:0;perspective:1400px;touch-action:none;user-select:none;will-change:transform}
.sc .inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.sc.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px;display:flex;flex-direction:column;border:1px solid #ffffff1c;box-shadow:0 18px 40px #0007;overflow:hidden}
.front{background:linear-gradient(160deg,#1d3354,#132540)}
.back{background:linear-gradient(160deg,#173a3a,#12283a);transform:rotateY(180deg)}
.face .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:750;font-size:clamp(19px,5vw,25px);line-height:1.35;padding:6px}
.face .hint{text-align:center;font-size:13px;color:var(--muted)}
.back .bq{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.back .a{flex:1;overflow:hidden;font-size:15.5px;line-height:1.5}
.back .a.s{font-size:14px;line-height:1.45}.back .a.xs{font-size:13px;line-height:1.4}
.stamp{position:absolute;top:28px;padding:6px 14px;border:4px solid;border-radius:12px;font-weight:900;font-size:26px;letter-spacing:1px;opacity:0;z-index:5;pointer-events:none}
.stamp.yes{left:22px;color:var(--grn);border-color:var(--grn);transform:rotate(-14deg)}
.stamp.no{right:22px;color:var(--red);border-color:var(--red);transform:rotate(14deg)}
.stamp.mid{left:50%;top:auto;bottom:40px;color:var(--yel);border-color:var(--yel);transform:translateX(-50%)}
.sc.under{pointer-events:none}
.sw-btns{display:flex;justify-content:center;align-items:center;gap:18px;padding:14px 0 14px;flex:none}
.rb{width:62px;height:62px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0005;transition:transform .1s}
.rb:active{transform:scale(.9)}
.rb.no{color:var(--red)}.rb.yes{color:var(--grn)}.rb.mid{color:var(--yel);width:50px;height:50px;font-size:21px}.rb.undo{width:44px;height:44px;font-size:18px;color:var(--muted)}
.combo{font-weight:800;color:var(--yel)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.empty .big{font-size:56px}
/* Feed */
#v-feed{overflow-y:scroll;scroll-snap-type:y mandatory;position:relative}
.post{user-select:none;-webkit-user-select:none;height:var(--fh,100vh);scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:16px 70px 18px 18px;overflow:hidden}
.post::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,var(--pc,#5fe0c1)22,transparent 55%),radial-gradient(circle at 90% 90%,#ffffff08,transparent 50%);opacity:.9;pointer-events:none}
.post .ptop{position:relative;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.post .pbody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
.post .pq{font-size:clamp(21px,5.6vw,28px);font-weight:800;line-height:1.3}
.post .pa{font-size:15.5px;line-height:1.5;background:#00000030;border:1px solid #ffffff14;border-radius:18px;padding:14px;max-height:62%;overflow-y:auto;transition:filter .35s,opacity .35s}
.post .pa.hide{filter:blur(9px);opacity:.55;user-select:none}
.post .pa.s{font-size:14px}.post .pa.xs{font-size:13px}
.post .tap{font-size:13px;color:var(--muted)}
.side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:3}
.side button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.side .ib{width:48px;height:48px;border-radius:50%;background:#ffffff14;display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .15s,background .2s}
.side button.on .ib{background:#ffffff30;transform:scale(1.12)}
.side button.g.on .ib{background:#4ee59a44}.side button.r.on .ib{background:#ff6b7a44}.side button.y.on .ib{background:#ffcf5c44}
.heart{position:absolute;font-size:90px;pointer-events:none;z-index:9;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
.feedhud{position:sticky;top:0;height:0;z-index:6;pointer-events:none}
.feedhud .in{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:#00000030;border:1px solid #ffffff1c;font-size:14.5px;line-height:1.4;margin-bottom:8px;transition:background .2s,border .2s}
.opt.ok{background:#4ee59a33;border-color:var(--grn)}.opt.bad{background:#ff6b7a33;border-color:var(--red)}
.milestone{align-items:center;justify-content:center;text-align:center;padding:30px}
.milestone .big{font-size:70px}
/* Blitz */
.timer{height:10px;background:#ffffff14;border-radius:9px;overflow:hidden}
.timer div{height:100%;background:linear-gradient(90deg,var(--yel),var(--red));transition:width .25s linear}
.bq{font-size:19px;font-weight:750;line-height:1.35;margin:14px 0}
.score{font-size:30px;font-weight:900}
.flash-ok{animation:fok .35s}.flash-bad{animation:fbad .35s}
@keyframes fok{0%{background:#4ee59a40}100%{background:transparent}}
@keyframes fbad{0%{background:#ff6b7a40}100%{background:transparent}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Quiz */
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kt{position:relative;min-height:92px;border-radius:16px;padding:12px 12px 12px 12px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 #0005;transition:transform .1s,opacity .25s,filter .25s}
.kt:active{transform:translateY(3px);box-shadow:0 2px 0 #0005}
.kt .ks{font-size:20px;line-height:1}.kt .kx{font-size:15px;font-weight:700;line-height:1.3}
.kt .kc{position:absolute;right:10px;top:8px;font-weight:900;font-size:18px}
.kt.dim{opacity:.35;filter:saturate(.4)}.kt.picked{outline:4px solid #fff;outline-offset:-4px}.kt.good{outline:4px solid #fff;outline-offset:-4px;transform:scale(1.02)}
.kq{font-size:19px;font-weight:800;line-height:1.3;flex:1}
.kban{border-radius:14px;padding:12px;text-align:center;font-weight:800;font-size:18px}.kban.ok{background:#26890c}.kban.bad{background:#e21b3c}
.krow{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #ffffff0d}.krow:last-child{border:0}.krow.me{background:#5fe0c11a;border-radius:10px}
.kr{width:24px;height:24px;border-radius:50%;background:#ffffff14;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0}
.pd{flex:1;max-width:120px;text-align:center}.pd .pn{font-weight:700;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .pb{border-radius:14px 14px 0 0;background:var(--panel2);padding:10px 4px;display:flex;flex-direction:column;justify-content:flex-start}
.pd.p0 .pb{height:150px;background:linear-gradient(#d89e00,#8a6400)}.pd.p1 .pb{height:115px;background:linear-gradient(#9fb3c8,#5d6f82)}.pd.p2 .pb{height:90px;background:linear-gradient(#c97d4a,#7a4523)}
@keyframes pulse{50%{transform:scale(1.15)}}
@media (max-width:360px){.ktiles{grid-template-columns:1fr}}
/* Mehr */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 16px 0;flex:none}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.search{user-select:text;-webkit-user-select:text;width:100%;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.li{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid #ffffff0d}
.li .nr{font-size:12px;color:var(--muted);min-width:30px;padding-top:2px}
.li .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:#ffffff22}
.dot.green{background:var(--grn)}.dot.yellow{background:var(--yel)}.dot.red{background:var(--red)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0d}
.set select{max-width:55%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
.switch{width:50px;height:30px;border-radius:20px;background:#ffffff22;position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--acc)}.switch.on::after{left:23px}
/* Sheet / Overlay */
.overlay{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important;background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:720px;max-height:88%;overflow-y:auto;padding:18px 18px 24px;animation:up .25s ease-out}
.sheet.center{border-radius:24px;margin:auto 16px;max-width:460px;animation:zoom .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes zoom{from{transform:scale(.9);opacity:0}}
.grab{width:42px;height:5px;border-radius:5px;background:#ffffff30;margin:-6px auto 12px}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:#1f3557;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:650;z-index:80;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px #0008;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.onb{text-align:center;padding:10px 6px}
.onb .big{font-size:64px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff30}.dots i.on{background:var(--acc);width:22px;border-radius:5px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <!-- START -->
  <section class="view" id="v-home"><div class="pad" id="homeBody"></div></section>
  <!-- SWIPE -->
  <section class="view" id="v-swipe">
    <div class="chips" id="swChips"></div>
    <div class="sw-top">
      <div class="sw-meta"><span id="swCount">–</span><span id="swCombo" class="combo"></span><span id="swGoal"></span></div>
      <div class="bar"><div id="swBar" style="width:0"></div></div>
    </div>
    <div class="stack" id="stack"></div>
    <div class="sw-btns" id="swBtns">
      <button class="rb undo" id="bUndo" title="Rückgängig">↶</button>
      <button class="rb no" id="bNo" title="Nochmal (links wischen)">✖</button>
      <button class="rb mid" id="bMid" title="Unsicher (hoch wischen)">?</button>
      <button class="rb yes" id="bYes" title="Kann ich (rechts wischen)">✔</button>
      <button class="rb undo" id="bFlip" title="Umdrehen">⟳</button>
    </div>
  </section>
  <!-- FEED -->
  <section class="view" id="v-feed"><div class="feedhud"><div class="in" id="feedHud"></div></div><div id="feedList"></div></section>
  <!-- QUIZ -->
  <section class="view" id="v-quiz"><div class="pad" id="quizBody"></div></section>
  <!-- BLITZ -->
  <section class="view" id="v-blitz"><div class="pad" id="blitzBody" style="flex:1;display:flex;flex-direction:column"></div></section>
  <!-- MEHR -->
  <section class="view" id="v-more">
    <div class="seg"><button data-seg="lib" class="on">📚 Bibliothek</button><button data-seg="set">⚙️ Einstellungen</button></div>
    <div id="libPane" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div style="padding:12px 16px 0"><input class="search" id="search" type="search" placeholder="🔍 Begriff oder Kartennummer suchen"></div>
      <div class="chips" id="libChips"></div>
      <div class="tiny muted" style="padding:0 16px" id="libCount"></div>
      <div style="padding:0 12px 20px" id="libList"></div>
    </div>
    <div id="setPane" class="pad hidden"></div>
  </section>
  <nav id="tabbar">
    <button data-tab="home"><span class="ic">🏠</span>Start</button>
    <button data-tab="swipe"><span class="ic">🃏</span>Swipe</button>
    <button data-tab="feed"><span class="ic">📱</span>Feed</button>
    <button data-tab="quiz"><span class="ic">🎮</span>Quiz</button>
    <button data-tab="blitz"><span class="ic">⚡</span>Blitz</button>
    <button data-tab="more"><span class="ic">📚</span>Mehr</button>
  </nav>
</div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script>
const CARDS=[{"id":1,"question":"Was ist der Unterschied zwischen Datenschutz und Datensicherheit?","answer":"Datenschutz schützt Menschen: Es geht um personenbezogene Daten natürlicher Personen und deren Persönlichkeitsrechte (informationelle Selbstbestimmung). Geregelt durch Gesetze wie DSGVO und BDSG.\nDatensicherheit schützt Daten allgemein – egal ob mit oder ohne Personenbezug – vor Verlust, Manipulation, Beschädigung und unbefugtem Zugriff. Mittel: technische und organisatorische Maßnahmen (Backup, Verschlüsselung, Zugriffsschutz).\nMerksatz: Datensicherheit ist ein Werkzeug, um Datenschutz umzusetzen.","nr":1,"cat":1},{"id":2,"question":"Welche Betroffenenrechte gibt es laut DSGVO?","answer":"Die DSGVO gibt betroffenen Personen u. a. folgende Rechte:\n• Recht auf Information (Art. 13/14) – bei Erhebung der Daten\n• Recht auf Auskunft (Art. 15)\n• Recht auf Berichtigung (Art. 16)\n• Recht auf Löschung / „Vergessenwerden“ (Art. 17)\n• Recht auf Einschränkung der Verarbeitung (Art. 18)\n• Recht auf Datenübertragbarkeit (Art. 20)\n• Widerspruchsrecht (Art. 21)\nAnfragen müssen in der Regel innerhalb eines Monats beantwortet werden.","nr":2,"cat":1},{"id":3,"question":"Das Datenschutzrecht basiert auf dem Verbotsprinzip mit Erlaubnisvorbehalt. Was bedeutet das?","answer":"Jede Erhebung, Verarbeitung und Nutzung personenbezogener Daten ist grundsätzlich verboten – außer es liegt eine Erlaubnis vor.\nErlaubnisgründe (Art. 6 DSGVO), z. B.:\n• Einwilligung der betroffenen Person\n• Erfüllung eines Vertrags\n• rechtliche Verpflichtung (z. B. Steuerrecht)\n• berechtigtes Interesse des Verantwortlichen\nOhne eine solche Rechtsgrundlage ist die Verarbeitung unzulässig.","nr":3,"cat":1},{"id":4,"question":"Erläutern Sie den Zusammenhang zwischen Zweckbindung, Datenminimierung und Speicherbegrenzung.","answer":"Drei Grundsätze aus Art. 5 DSGVO, die aufeinander aufbauen:\n• Zweckbindung: Daten nur für den festgelegten, eindeutigen Zweck erheben und nutzen – keine Zweckentfremdung.\n• Datenminimierung: Nur so viele Daten wie für diesen Zweck wirklich nötig („so wenig wie möglich“).\n• Speicherbegrenzung: Daten löschen, sobald der Zweck erfüllt ist und keine Aufbewahrungspflicht mehr besteht.\nZusammenhang: Der Zweck bestimmt, welche Daten nötig sind und wie lange sie gespeichert werden dürfen.","nr":4,"cat":1},{"id":5,"question":"Erklären Sie den Grundsatz der Transparenz und den Grundsatz der Richtigkeit im Datenschutz.","answer":"Transparenz: Betroffene müssen jederzeit nachvollziehen können, welche Daten über sie verarbeitet werden, wer sie verarbeitet, zu welchem Zweck und wie lange. Umsetzung z. B. durch Datenschutzerklärung und Auskunftsrecht – verständlich und leicht zugänglich formuliert.\nRichtigkeit: Personenbezogene Daten müssen sachlich korrekt und aktuell sein. Organisationen müssen falsche oder veraltete Daten berichtigen oder löschen; Betroffene haben dafür das Recht auf Berichtigung.","nr":5,"cat":1},{"id":6,"question":"Welche besonderen Kategorien personenbezogener Daten werden gemäß DSGVO definiert?","answer":"Besonders schützenswerte Daten (Art. 9 DSGVO) – ihre Verarbeitung ist grundsätzlich verboten, außer z. B. bei ausdrücklicher Einwilligung:\n• ethnische Herkunft\n• politische Meinungen\n• religiöse oder weltanschauliche Überzeugungen\n• Gewerkschaftszugehörigkeit\n• genetische Daten\n• biometrische Daten zur eindeutigen Identifizierung\n• Gesundheitsdaten\n• Sexualleben und sexuelle Orientierung\nGrund: Missbrauch kann für Betroffene besonders schwere Folgen (Diskriminierung) haben.","nr":6,"cat":1},{"id":7,"question":"Wer muss bei einer Datenschutzverletzung informiert werden?","answer":"Zwei Parteien:\n• Die zuständige Datenschutz-Aufsichtsbehörde: innerhalb von 72 Stunden nach Bekanntwerden der Verletzung (Art. 33 DSGVO) – außer es besteht voraussichtlich kein Risiko für Betroffene.\n• Die betroffenen Personen: unverzüglich, wenn die Verletzung voraussichtlich ein hohes Risiko für ihre Rechte und Freiheiten darstellt (Art. 34).\nDer Vorfall muss außerdem intern dokumentiert werden.","nr":7,"cat":1},{"id":8,"question":"Was sind die Hauptaufgaben und Verantwortlichkeiten von Datenschutzbeauftragten?","answer":"Datenschutzbeauftragte (DSB):\n• beraten und unterrichten Unternehmensleitung und Beschäftigte zum Datenschutz\n• überwachen die Einhaltung von DSGVO, BDSG und internen Richtlinien\n• schulen und sensibilisieren Mitarbeitende\n• beraten bei der Datenschutz-Folgenabschätzung\n• sind Ansprechpartner für Betroffene (Anfragen, Beschwerden)\n• arbeiten mit der Aufsichtsbehörde zusammen und sind deren Anlaufstelle\nDer DSB ist weisungsfrei, die Verantwortung bleibt aber bei der Unternehmensleitung.","nr":8,"cat":1},{"id":9,"question":"Die Ziele der Datensicherheit sind Vertraulichkeit, Integrität, Verfügbarkeit und Authentizität. Erläutern Sie diese 4 Begriffe.","answer":"• Vertraulichkeit: Daten und Systeme sind nur für berechtigte Personen zugänglich (z. B. Verschlüsselung, Zugriffsrechte).\n• Integrität: Daten sind korrekt, vollständig und können nicht unbemerkt verändert werden (z. B. Hashwerte, Signaturen).\n• Verfügbarkeit: Daten und IT-Systeme stehen berechtigten Nutzern zur Verfügung, wenn sie gebraucht werden (z. B. RAID, USV, Redundanz).\n• Authentizität: Echtheit und Vertrauenswürdigkeit von Daten und Kommunikationspartnern sind nachweisbar (z. B. Zertifikate).","nr":9,"cat":1},{"id":10,"question":"Nennen Sie drei Aufgaben von IT-Sicherheitsbeauftragten.","answer":"Der IT-Sicherheitsbeauftragte (ISB) kümmert sich um die Informationssicherheit, z. B.:\n• Erstellung von Richtlinien und Sicherheitskonzepten zur Informationssicherheit\n• praktische Umsetzung von Maßnahmen der IT-Sicherheit steuern\n• Organisation von Schulungen und Sensibilisierung\n• Bearbeitung von IT-Sicherheitsvorfällen\n• Dokumentation und Überwachung der Sicherheitsmaßnahmen, Risikoanalysen\n• Ansprechpartner für Mitarbeitende und Unternehmensleitung","nr":10,"cat":1},{"id":11,"question":"Welche gesetzlichen Bestimmungen regeln in Deutschland den Umgang mit personenbezogenen Daten?","answer":"• DSGVO (Datenschutz-Grundverordnung): EU-weit unmittelbar geltende Verordnung, regelt den Datenschutz für alle Mitgliedsstaaten.\n• BDSG (Bundesdatenschutzgesetz, „BDSG-neu“): ergänzt die DSGVO und füllt ihre Öffnungsklauseln aus, z. B. Beschäftigtendatenschutz und Pflicht zur Benennung eines DSB.\nVorrang hat die DSGVO. Daneben gibt es Spezialgesetze, z. B. TDDDG (Telekommunikation/Telemedien) und Landesdatenschutzgesetze für Behörden.","nr":11,"cat":1},{"id":12,"question":"Womit beschäftigen sich die Standards ISO 27001 und BSI IT-Grundschutz?","answer":"Beide beschreiben den Aufbau eines Informationssicherheits-Managementsystems (ISMS):\n• ISO/IEC 27001: weltweit anerkannter internationaler Standard; legt Anforderungen an Aufbau, Betrieb und kontinuierliche Verbesserung eines ISMS fest. Für jede Organisationsgröße, zertifizierbar.\n• BSI IT-Grundschutz: nationaler deutscher Standard des BSI mit konkreter Methodik und Bausteinen (IT-Grundschutz-Kompendium), besonders verbreitet in Behörden und KRITIS. Zertifizierung „ISO 27001 auf Basis von IT-Grundschutz“ möglich.","nr":12,"cat":1},{"id":13,"question":"Wie werden die Schutzbedarfskategorien „normal“, „hoch“ und „sehr hoch“ verwendet?","answer":"Sie dienen dazu, den Sicherheitsbedarf von Informationen, Anwendungen, Systemen oder Räumen einzuschätzen – nach dem möglichen Schaden bei Verletzung von Vertraulichkeit, Integrität oder Verfügbarkeit:\n• normal: Schadensauswirkungen begrenzt und überschaubar\n• hoch: Schäden können beträchtlich sein\n• sehr hoch: Schäden können existenzbedrohend bzw. katastrophal sein\nAus der Kategorie leiten sich passende Sicherheitsmaßnahmen ab (z. B. nach BSI IT-Grundschutz).","nr":13,"cat":1},{"id":14,"question":"Nennen Sie im Zusammenhang mit dem Thema Datenschutz jeweils drei Beispiele für geeignete technische und organisatorische Maßnahmen (TOM).","answer":"TOM sichern die Verarbeitung personenbezogener Daten ab (Art. 32 DSGVO).\nTechnisch:\n• Verschlüsselung von Datenträgern und Übertragungen\n• Passwortrichtlinien, MFA, Berechtigungskonzept\n• Datensicherung, Firewall, Virenschutz\n• Zutrittskontrolle (Chipkarten), Alarmanlagen\nOrganisatorisch:\n• Schulung und Sensibilisierung der Mitarbeitenden\n• Richtlinien zur Nutzung von IT, Internet und mobilen Geräten\n• Verfahren zur datenschutzkonformen Entsorgung von Datenträgern\n• Vertraulichkeitsverpflichtungen, Vier-Augen-Prinzip","nr":14,"cat":1},{"id":15,"question":"Erklären Sie was in der DSGVO unter dem Ausdruck „Stand der Technik“ zu verstehen ist.","answer":"Nach Art. 32 DSGVO müssen Verantwortliche „unter Berücksichtigung des Stands der Technik“ geeignete TOM treffen.\nGemeint sind die neuesten bewährten, am Markt verfügbaren und wirksamen Sicherheitsmaßnahmen, die ein dem Risiko angemessenes Schutzniveau gewährleisten.\nDer Stand der Technik ist nicht statisch: Er entwickelt sich mit dem technischen Fortschritt weiter. Maßnahmen müssen deshalb regelmäßig überprüft und angepasst werden (z. B. veraltete Verschlüsselung wie DES/MD5 ersetzen).","nr":15,"cat":1},{"id":16,"question":"Beschreiben Sie den grundsätzlichen Unterschied zwischen der Anonymisierung und der Pseudonymisierung von personenbezogenen Daten.","answer":"• Anonymisierung: Alle identifizierenden Merkmale werden so entfernt, dass ein Personenbezug nicht mehr – auch nicht mit Zusatzwissen – hergestellt werden kann. Irreversibel; anonyme Daten fallen nicht mehr unter die DSGVO.\n• Pseudonymisierung: Identifizierende Merkmale werden durch ein Pseudonym (z. B. Kennnummer) ersetzt. Mit einer separat und sicher aufbewahrten Zuordnungstabelle ist die Person wieder identifizierbar. Reversibel; die Daten bleiben personenbezogen und unterliegen weiter der DSGVO.","nr":16,"cat":1},{"id":17,"question":"Was versteht man unter dem Begriff Compliance?","answer":"Compliance bedeutet Regelkonformität: die Einhaltung von gesetzlichen Bestimmungen, branchenspezifischen Standards, internen Richtlinien und ethischen Grundsätzen durch ein Unternehmen und seine Mitarbeitenden.\nUmfasst die Umsetzung und Überwachung dieser Regeln (z. B. Datenschutz, IT-Sicherheit, Lizenzrecht).\nZiel: Risiken minimieren und Vertrauen von Kunden, Investoren und Öffentlichkeit erhalten.\nFolgen von Verstößen: Bußgelder, Haftung, finanzielle Verluste und Reputationsschäden.","nr":17,"cat":1},{"id":18,"question":"Erklären Sie den Unterschied zwischen „Privacy by Design“ und „Privacy by Default“.","answer":"Beide aus Art. 25 DSGVO:\n• Privacy by Design (Datenschutz durch Technikgestaltung): Datenschutz wird schon bei der Entwicklung von Software, Hardware und Prozessen berücksichtigt – als fester Bestandteil der Planung, nicht nachträglich.\n• Privacy by Default (datenschutzfreundliche Voreinstellungen): Produkte sind ab Werk so eingestellt, dass nur die nötigsten Daten verarbeitet werden. Nutzer sind ohne eigenes Zutun geschützt – auch weniger technikversierte.","nr":18,"cat":1},{"id":19,"question":"Nennen Sie drei Komplexitätsanforderungen für Passwörter und erklären Sie warum diese für eine höhere Passwortsicherheit sorgen.","answer":"Typische Anforderungen:\n• Großbuchstaben und Kleinbuchstaben\n• Zahlen\n• Sonderzeichen\n• ausreichende Mindestlänge (z. B. 12+ Zeichen)\n• keine Wörter aus dem Wörterbuch, keine persönlichen Daten\nWarum sicherer: Ein größerer Zeichenvorrat und mehr Länge erhöhen die Zahl möglicher Kombinationen exponentiell. Brute-Force- und Wörterbuchangriffe brauchen dadurch erheblich länger bzw. werden praktisch unmöglich.","nr":19,"cat":2},{"id":20,"question":"Nennen Sie Vorteile und Nachteile der Nutzung von Single Sign-On (SSO).","answer":"SSO: einmal anmelden, Zugriff auf mehrere Anwendungen.\nVorteile:\n• nur eine Anmeldung nötig – bequem, spart Zeit\n• weniger Passwörter → weniger vergessene, notierte oder unsichere Passwörter\n• zentrale Verwaltung: Konten schnell sperren oder Rechte ändern\nNachteile:\n• Single Point of Failure: Wird das SSO-Konto kompromittiert, sind alle Anwendungen betroffen\n• fällt der SSO-Dienst aus, ist kein Zugriff möglich\n• Einrichtung komplex; Abhängigkeit von externem Anbieter (Datenschutz)","nr":20,"cat":2},{"id":21,"question":"Was ist OAuth 2.0 und wofür wird es in der Authentifizierung und Autorisierung verwendet?","answer":"OAuth 2.0 ist ein offenes Standardprotokoll zur sicheren Delegation von Zugriffsrechten (Autorisierung).\nEs ermöglicht Benutzern, Drittanbieter-Apps Zugriff auf ihre Daten bei einem anderen Dienst zu gewähren, ohne ihr Passwort preiszugeben – z. B. „Mit Google anmelden“ oder eine App, die auf den Kalender zugreifen darf.\nStatt Passwörtern werden zeitlich begrenzte Zugriffstoken mit eingeschränkten Rechten (Scopes) verwendet.\nHinweis: OAuth selbst regelt Autorisierung; für die Authentifizierung wird oft OpenID Connect darauf aufgesetzt.","nr":21,"cat":2},{"id":22,"question":"Beschreiben Sie den Autorisierungs-Prozess von OAuth 2.0.","answer":"Rollen: Ressourcenbesitzer (Benutzer), Client (App), Autorisierungsserver, Ressourcenserver.\nAblauf:\n1. Der Client fordert beim Benutzer Zugriff auf eine Ressource an.\n2. Der Benutzer wird zum Autorisierungsserver geleitet, meldet sich dort an und stimmt dem Zugriff zu.\n3. Der Client erhält eine Autorisierungsgenehmigung (Authorization Code).\n4. Der Client tauscht diese beim Autorisierungsserver gegen ein Zugriffstoken (Access Token).\n5. Mit dem Token greift der Client auf den Ressourcenserver zu; dieser prüft das Token und gibt die Daten frei.","nr":22,"cat":2},{"id":23,"question":"Beschreiben Sie den Unterschied zwischen Zugangskontrolle und Zugriffskontrolle.","answer":"• Zugangskontrolle: regelt, wer überhaupt in ein System gelangen darf – z. B. Anmeldung mit Benutzername/Passwort, Chipkarte, MFA. Frage: „Darf ich ins System?“\n• Zugriffskontrolle: regelt, was ein angemeldeter Benutzer im System mit welchen Daten tun darf – z. B. Lese-/Schreibrechte, Rollen- und Berechtigungskonzepte. Frage: „Was darf ich im System?“\nNicht verwechseln mit Zutrittskontrolle = physischer Zutritt zu Räumen/Gebäuden.","nr":23,"cat":2},{"id":24,"question":"Was ist in Bezug auf die Systemsicherheit unter dem Begriff der „Betriebssystemhärtung“ zu verstehen?","answer":"Härtung = Maßnahmen, um die Sicherheit eines Betriebssystems zu erhöhen, indem die Angriffsfläche verkleinert wird. Beispiele:\n• nur benötigte Dienste und Software installieren, Unnötiges deaktivieren/entfernen\n• Patch-Management: Updates regelmäßig einspielen\n• Standardkonten und -passwörter ändern oder deaktivieren\n• Firewall und Virenschutz aktivieren\n• Rechte nach Least-Privilege vergeben\n• Protokollierung aktivieren, Verschlüsselung nutzen","nr":24,"cat":2},{"id":25,"question":"Es gibt verschiedene Tools und Technologien, die bei der Updateverwaltung eingesetzt werden können. Erklären Sie kurz WSUS, SCCM und APT.","answer":"• WSUS (Windows Server Update Services): Microsoft-Tool zur zentralen Verwaltung und Verteilung von Updates für Windows und andere Microsoft-Produkte im Unternehmen – Updates werden einmal geladen, geprüft und freigegeben.\n• SCCM (System Center Configuration Manager, heute Microsoft Configuration Manager): umfassende Lösung fürs Client-Management – Softwareverteilung, Updates, Inventarisierung und Betriebssystem-Bereitstellung.\n• APT (Advanced Packaging Tool): Paketverwaltung von Debian/Ubuntu-Linux zum Installieren, Aktualisieren und Entfernen von Softwarepaketen (z. B. apt update / apt upgrade).","nr":25,"cat":2},{"id":26,"question":"Was ist der Unterschied zwischen einem Update und einem Upgrade?","answer":"• Update: kleinere Änderung innerhalb einer bestehenden Softwareversion. Behebt Fehler, schließt Sicherheitslücken, bringt kleine Verbesserungen. Meist kostenlos (z. B. 11.2 → 11.3).\n• Upgrade: größerer Versionssprung auf eine neue Hauptversion mit neuen Funktionen, oft überarbeitetem Design oder neuer technischer Grundlage (z. B. Windows 10 → Windows 11). Kann kostenpflichtig sein und höhere Systemanforderungen haben.","nr":26,"cat":2},{"id":27,"question":"Erläutern Sie die Angriffsmethoden Trojaner, Ransomware, Phishing und Distributed Denial of Service (DDoS).","answer":"• Trojaner: Schadprogramm, das sich als nützliche Anwendung tarnt und im Hintergrund ohne Wissen des Nutzers schädliche Funktionen ausführt (z. B. Hintertür öffnen, Daten ausspähen).\n• Ransomware: verschlüsselt Daten oder sperrt Systeme und erpresst Lösegeld für die Freigabe.\n• Phishing: Abgreifen von Zugangsdaten über gefälschte E-Mails oder Webseiten, um später auf Systeme zuzugreifen.\n• DDoS: Überlastung eines Dienstes durch massenhafte Anfragen von vielen (oft gekaperten) Rechnern – Botnetz –, sodass er nicht mehr erreichbar ist.","nr":27,"cat":2},{"id":28,"question":"Erklären Sie das Sicherheitsproblem SQL-Injection.","answer":"Bei einer SQL-Injection schleust ein Angreifer schädlichen SQL-Code über Eingabefelder (z. B. Login, Suche, URL-Parameter) in eine Datenbankabfrage ein, weil die Eingaben ungeprüft in den SQL-Befehl übernommen werden.\nFolgen: Daten auslesen, ändern oder löschen, Anmeldung umgehen.\nBeispiel: Eingabe ' OR '1'='1 macht die WHERE-Bedingung immer wahr.\nSchutz: Prepared Statements/parametrisierte Abfragen, Eingabevalidierung, minimale DB-Rechte, Escaping.","nr":28,"cat":2},{"id":29,"question":"Was versteht man unter einem „Man-in-the-Middle“-Angriff und welche Maßnahmen können getroffen werden, um sich davor zu schützen?","answer":"Ein Angreifer schaltet sich unbemerkt in die Kommunikation zwischen zwei Parteien. Er kann Daten mitlesen, abfangen oder manipulieren; beide Seiten glauben, direkt miteinander zu kommunizieren (z. B. über gefälschte WLAN-Hotspots oder ARP-Spoofing).\nSchutzmaßnahmen:\n• Ende-zu-Ende-Verschlüsselung (TLS/HTTPS, VPN)\n• Zertifikate prüfen, Warnungen ernst nehmen\n• MFA aktivieren\n• keine offenen/unsicheren WLANs nutzen","nr":29,"cat":2},{"id":30,"question":"Wann dürfen Spamfilter oder Administratoren E-Mails auf unerwünschte Inhalte prüfen?","answer":"E-Mails sind durch Datenschutz und ggf. Fernmeldegeheimnis geschützt. Eine Prüfung ist nur mit Rechtsgrundlage zulässig:\n• automatisierte Filter (Spam, Viren) sind in der Regel zulässig, wenn sie transparent geregelt sind und nur dem Schutz der IT dienen\n• ist private Nutzung des dienstlichen Postfachs erlaubt oder geduldet, gelten strengere Regeln – inhaltliche Einsicht nur mit Einwilligung bzw. klarer Regelung\n• Regelungen gehören in eine IT-/E-Mail-Richtlinie oder Betriebsvereinbarung; Datenschutzbeauftragten einbeziehen\n• Admins dürfen Inhalte nicht ohne Anlass und Rechtsgrundlage lesen","nr":null,"cat":2},{"id":31,"question":"Was ist im Bereich der IT-Sicherheit unter einem Honeypot zu verstehen?","answer":"Ein Honeypot („Honigtopf“) ist ein bewusst präpariertes, scheinbar verwundbares System, das Angreifer gezielt anlocken soll. Es simuliert z. B. einen Rechner, Netzwerkdienst oder eine Anwendung.\nZiele:\n• Angreifer von produktiven Systemen ablenken\n• Angriffsmethoden und Schadsoftware beobachten und studieren\n• Angriffe frühzeitig erkennen\n• Angreifern ggf. eine Falle stellen\nEchte Daten enthält ein Honeypot nicht; er muss gut vom echten Netz isoliert sein.","nr":30,"cat":2},{"id":32,"question":"Beschreiben Sie die Aufgabe einer Sandbox in Bezug auf die IT-Sicherheit.","answer":"Eine Sandbox ist eine abgeschottete, kontrollierte Umgebung, in der Software oder Code ausgeführt wird, ohne das eigentliche System oder Netzwerk zu beeinflussen.\nEinsatz:\n• unbekannte oder verdächtige Dateien/E-Mail-Anhänge gefahrlos testen\n• Malware-Verhalten analysieren\n• Browser und Apps isolieren\nSo wird verhindert, dass schädlicher oder nicht verifizierter Code auf das zugrundeliegende System, Daten oder das Netzwerk zugreifen kann.","nr":31,"cat":2},{"id":33,"question":"Erklären Sie den Unterschied zwischen der differenziellen und der inkrementellen Datensicherung. Gehen Sie hierbei auch auf den Aufwand bei der Wiederherstellung ein.","answer":"Beide starten mit einer Vollsicherung.\n• Differenziell: sichert jeweils alle Änderungen seit der letzten Vollsicherung. Die Sicherungen wachsen täglich an.\n  Wiederherstellung: letzte Vollsicherung + nur die letzte differenzielle Sicherung → schnell und einfach.\n• Inkrementell: sichert nur die Änderungen seit der letzten Sicherung (voll oder inkrementell). Sehr schnell, wenig Speicher.\n  Wiederherstellung: letzte Vollsicherung + alle inkrementellen Sicherungen in der richtigen Reihenfolge → aufwendiger, fehleranfälliger.","nr":32,"cat":2},{"id":34,"question":"Beschreiben Sie die Datensicherungsstrategie „Generationenprinzip“ (Großvater-Vater-Sohn-Prinzip).","answer":"Rotationsprinzip mit mehreren Sicherungsgenerationen über verschiedene Zeiträume. Dadurch können auch ältere Datenstände wiederhergestellt werden, und ein einzelner beschädigter Datenträger führt nicht zum Totalverlust.\nTypische Umsetzung:\n• Sohn: tägliche Sicherung (z. B. Mo–Do, Medien werden wöchentlich überschrieben)\n• Vater: wöchentliche Sicherung (z. B. freitags, monatlich überschrieben)\n• Großvater: monatliche Sicherung (länger aufbewahrt)\nVorteil: guter Kompromiss aus Anzahl der Datenträger und Zeitraum der Wiederherstellbarkeit.","nr":33,"cat":2},{"id":35,"question":"Was besagt die 3-2-1-Regel in Bezug auf die Datensicherung?","answer":"Faustregel für eine sichere Backup-Strategie:\n• 3 Kopien der Daten (Original + zwei Backups)\n• auf 2 verschiedenen Speichermedien (z. B. NAS und Band/Cloud), damit ein Medienfehler nicht alles trifft\n• 1 Kopie an einem anderen Ort (offsite), z. B. Rechenzentrum oder Cloud – Schutz vor Feuer, Wasser, Diebstahl oder lokaler Ransomware\nErweiterung: 3-2-1-1-0 (zusätzlich eine Offline-/unveränderbare Kopie, 0 Fehler beim Restore-Test).","nr":34,"cat":2},{"id":36,"question":"Worin liegt der Unterschied zwischen Datensicherung und Archivierung?","answer":"• Datensicherung (Backup): regelmäßige Kopien aktueller Daten, um sie nach Verlust (Defekt, Löschung, Angriff) schnell wiederherstellen zu können. Kurz- bis mittelfristig, Daten werden regelmäßig überschrieben.\n• Archivierung: langfristige, unveränderbare Aufbewahrung von Daten, die nicht mehr aktiv genutzt werden, aber aus rechtlichen oder geschäftlichen Gründen aufbewahrt werden müssen (z. B. Rechnungen 10 Jahre). Daten werden vom Produktivsystem verschoben und müssen auffindbar bleiben.","nr":35,"cat":2},{"id":37,"question":"Erklären Sie die WORM-Methode in der Datensicherung.","answer":"WORM = Write Once, Read Many: Daten können nur einmal geschrieben, danach beliebig oft gelesen, aber nicht mehr verändert oder gelöscht werden.\nNutzen:\n• Revisionssicherheit für Archivierung (gesetzliche Aufbewahrungspflichten)\n• Schutz vor Manipulation und versehentlichem Löschen\n• Schutz vor Ransomware, da Sicherungen nicht verschlüsselt/überschrieben werden können\nUmsetzung: spezielle WORM-Medien (z. B. Bänder, optische Medien) oder Software-WORM/Object Lock im Speicher.","nr":36,"cat":2},{"id":38,"question":"Was bedeutet Disaster Recovery in der Informationstechnologie und warum ist es für Unternehmen wichtig?","answer":"Disaster Recovery (DR) umfasst Strategien, Pläne und Maßnahmen, um IT-Systeme, Infrastruktur und Daten nach einem schwerwiegenden Ausfall (Naturkatastrophe, Brand, Cyberangriff, Hardwareausfall) wiederherzustellen.\nBestandteil ist ein Disaster-Recovery-Plan mit Abläufen, Zuständigkeiten, Prioritäten und Zielen (RTO/RPO) sowie redundanten Systemen und Backups an sicheren Orten.\nWichtig, weil: Ausfallzeiten und Datenverluste minimiert werden, der Geschäftsbetrieb weiterlaufen kann und existenzbedrohende Schäden vermieden werden.","nr":37,"cat":2},{"id":39,"question":"Erläutern Sie die Bedeutung von „Recovery Time Objective“ (RTO) und „Recovery Point Objective“ (RPO).","answer":"Zwei Kennzahlen der Disaster-Recovery-Planung:\n• RTO: maximal tolerierbare Ausfallzeit – also die Zeit, bis ein System nach einer Störung wieder funktionsfähig sein muss. Frage: „Wie lange dürfen wir offline sein?“\n• RPO: maximal tolerierbarer Datenverlust, gemessen in Zeit – also wie alt die letzte Sicherung höchstens sein darf. Frage: „Wie viele Daten dürfen verloren gehen?“ Ein RPO von 4 h verlangt mindestens alle 4 h ein Backup.\nJe kleiner RTO/RPO, desto teurer die Lösung.","nr":38,"cat":2},{"id":40,"question":"Worin liegt der Unterschied zwischen den Messgrößen „Mean Time Between Failures“ (MTBF) und „Mean Time to Failure“ (MTTF)?","answer":"• MTBF: durchschnittliche Betriebszeit zwischen zwei Ausfällen bei reparierbaren Systemen (z. B. Server, RAID). Hohe MTBF = hohe Zuverlässigkeit.\n• MTTF: durchschnittliche Zeit bis zum ersten (und einzigen) Ausfall bei nicht reparierbaren Bauteilen, die nach dem Defekt ersetzt werden (z. B. Festplatte, Lüfter).\nVerwandt: MTTR = Mean Time To Repair (durchschnittliche Reparaturdauer). Verfügbarkeit ≈ MTBF / (MTBF + MTTR).","nr":39,"cat":2},{"id":41,"question":"Treffen Sie für die RAID-Systeme RAID 0, RAID 1, RAID 5, RAID 6 und RAID 10 jeweils eine Aussage zu Mindestanzahl Festplatten, Ausfallsicherheit und Nutzkapazität.","answer":"• RAID 0 (Striping): min. 2 Platten · keine Ausfallsicherheit · Nutzkapazität n × Plattengröße (100 %)\n• RAID 1 (Spiegelung): min. 2 · eine Platte darf ausfallen · n/2 (50 %)\n• RAID 5 (Parität verteilt): min. 3 · eine Platte darf ausfallen · (n − 1) × Größe\n• RAID 6 (doppelte Parität): min. 4 · zwei Platten dürfen ausfallen · (n − 2) × Größe\n• RAID 10 (1+0): min. 4 · eine Platte pro Spiegelpaar darf ausfallen · n/2 (50 %)\nRechenbeispiel RAID 5 mit 4 × 2 TB: (4 − 1) × 2 TB = 6 TB.","nr":40,"cat":2},{"id":42,"question":"Erklären Sie anhand eines Beispiels, warum ein RAID keine Datensicherung ersetzt.","answer":"Ein RAID schützt nur vor dem Ausfall einzelner Festplatten (Verfügbarkeit). Alle Änderungen werden sofort auf alle Platten übertragen – auch Fehler. Kein Schutz bei:\n• versehentlich gelöschten oder veränderten Daten (Löschung wird gespiegelt)\n• Virenbefall oder Ransomware (verschlüsselte Daten liegen auf allen Platten)\n• Ausfall des RAID-Controllers oder des ganzen Systems\n• physischer Beschädigung durch Feuer, Wasser, Diebstahl oder Vandalismus\nBeispiel: Ein Mitarbeiter löscht einen Ordner – im RAID 1 ist er auf beiden Platten weg; nur ein Backup hilft.","nr":41,"cat":2},{"id":43,"question":"In einem RAID-5-Verbund wurde eine zusätzliche Hot-Spare-Festplatte verbaut. Erklären Sie die Funktion einer Hot-Spare-Festplatte.","answer":"Eine Hot-Spare ist eine zusätzliche, im Betrieb mitlaufende, aber ungenutzte Reservefestplatte im RAID-Verbund.\nFällt eine Platte aus, übernimmt die Hot-Spare automatisch und ohne manuellen Eingriff deren Rolle: Das RAID-System beginnt sofort mit der Wiederherstellung (Rebuild) der Daten auf der Hot-Spare.\nVorteil: Die Zeit, in der das RAID 5 ungeschützt („degraded“) läuft, wird stark verkürzt – ein zweiter Ausfall während dieser Zeit wäre fatal. Die defekte Platte wird später getauscht und zur neuen Hot-Spare.","nr":42,"cat":2},{"id":44,"question":"Was ist JBOD für eine Speicherlösung?","answer":"JBOD (Just a Bunch of Disks) ist eine einfache Speicherlösung, bei der mehrere Festplatten ohne RAID-Struktur zusammen genutzt werden – entweder einzeln oder zu einem großen logischen Laufwerk zusammengefasst (Spanning/Concatenation).\n• Vorteil: Gesamtkapazität aller Platten nutzbar (100 %), auch unterschiedlich große Platten möglich, hohe Speichereffizienz.\n• Nachteil: keine Redundanz und kein Leistungsgewinn – fällt eine Platte aus, sind deren Daten (bei Spanning ggf. mehr) verloren.","nr":43,"cat":2},{"id":217,"question":"Was versteht man unter dem Mix-and-Match-Prinzip bei Festplatten?","answer":"Beim Mix-and-Match-Prinzip werden in einem Speichersystem oder RAID-Verbund Festplatten unterschiedlicher Hersteller, Modelle, Kapazitäten oder Produktionschargen kombiniert, anstatt ausschließlich identische Laufwerke zu verwenden.\nÜberlegung dahinter:\n• Identische Festplatten aus derselben Produktionscharge haben oft dieselben Schwachstellen und ähnliche Lebensdauer.\n• Sie können daher kurz nacheinander ausfallen – besonders kritisch während eines RAID-Rebuilds.\n• Durch die Mischung soll das Risiko eines gleichzeitigen Ausfalls mehrerer Laufwerke reduziert werden.\nBeachten: Im RAID bestimmen die kleinste Kapazität und die langsamste Platte die Leistung des Verbunds.","nr":44,"neu":1,"cat":2},{"id":45,"question":"Erklären Sie den Unterschied zwischen einer Offline USV und einer Line Interactive USV. Gehen Sie hierbei auch auf die Bedeutung der Abkürzungen VFD und VI ein.","answer":"• Offline-USV (VFD – Voltage and Frequency Dependent): Die Verbraucher hängen direkt am Stromnetz. Erst bei Stromausfall wird auf Batterie umgeschaltet (Umschaltzeit wenige Millisekunden). Schützt nur vor Ausfall, kaum vor Netzschwankungen. Günstig, z. B. für Arbeitsplatz-PCs.\n• Line-Interactive-USV (VI – Voltage Independent): ähnlich, regelt aber zusätzlich Spannungsschwankungen (Über-/Unterspannung) über einen Transformator aus, ohne auf Batterie umzuschalten. Kurze Umschaltzeit bei Ausfall. Mittlere Preisklasse, z. B. für kleinere Server.","nr":45,"cat":2},{"id":46,"question":"Beschreiben Sie die Funktionsweise einer Voltage and Frequency Independent USV.","answer":"Online-USV / Doppelwandler (VFI – Voltage and Frequency Independent): bietet den höchsten Schutz.\nFunktionsweise: Der Netzstrom wird permanent in Gleichstrom umgewandelt (Gleichrichter, lädt die Batterie) und anschließend wieder in sauberen Wechselstrom (Wechselrichter). Die Verbraucher sind dadurch vollständig vom Stromnetz entkoppelt.\nVorteile: keine Umschaltzeit bei Stromausfall, Schutz vor allen Netzstörungen (Spannungsschwankungen, Spitzen, Frequenzschwankungen).\nNachteile: teurer, geringerer Wirkungsgrad (Wärme). Einsatz bei Servern und Rechenzentren.","nr":46,"cat":2},{"id":47,"question":"Nennen Sie mögliche Gefährdungen für Server, die sich bei direktem Anschluss an das Stromnetz ergeben können.","answer":"Ohne USV/Netzfilter können u. a. auftreten:\n• Stromausfall → Datenverlust, beschädigte Dateisysteme\n• Spannungsspitzen (z. B. Blitzeinschlag) → Hardwaredefekte\n• Spannungsschwankungen (Über-/Unterspannung)\n• Frequenzschwankungen\n• Spannungsverzerrungen / Oberschwingungen\n• Störspannungen (elektromagnetische Störungen)\nGegenmaßnahme: passende USV (für Server meist VFI), Überspannungsschutz.","nr":47,"cat":2},{"id":48,"question":"Was ist der Unterschied zwischen symmetrischen und asymmetrischen Verschlüsselungsverfahren?","answer":"• Symmetrisch: Ein einziger gemeinsamer Schlüssel zum Ver- und Entschlüsseln. Beispiele: AES, 3DES.\n  Vorteil: schnell und effizient, auch für große Datenmengen.\n  Nachteil: Schlüsselaustausch muss sicher erfolgen; bei vielen Partnern sehr viele Schlüssel.\n• Asymmetrisch: Schlüsselpaar aus öffentlichem Schlüssel (verschlüsseln, darf jeder kennen) und privatem Schlüssel (entschlüsseln, bleibt geheim). Beispiele: RSA, ECC.\n  Vorteil: löst das Schlüsselverteilungsproblem, ermöglicht Signaturen.\n  Nachteil: deutlich langsamer.\nLösung in der Praxis: hybride Verschlüsselung.","nr":48,"cat":2},{"id":49,"question":"Wie ist die Funktionsweise von hybriden Verschlüsselungsverfahren?","answer":"Hybride Verfahren kombinieren die Vorteile von symmetrischer (schnell) und asymmetrischer (sicherer Schlüsselaustausch) Verschlüsselung:\n1. Der Sender erzeugt einen zufälligen symmetrischen Sitzungsschlüssel.\n2. Die eigentliche Nachricht wird mit diesem Sitzungsschlüssel symmetrisch verschlüsselt (z. B. AES).\n3. Der Sitzungsschlüssel wird mit dem öffentlichen Schlüssel des Empfängers asymmetrisch verschlüsselt (z. B. RSA) und mitgeschickt.\n4. Der Empfänger entschlüsselt mit seinem privaten Schlüssel den Sitzungsschlüssel und damit die Nachricht.\nBeispiele: TLS/HTTPS, PGP/S/MIME.","nr":49,"cat":2},{"id":50,"question":"Welche Schutzmechanismen beinhaltet das TLS-Protokoll?","answer":"TLS (Transport Layer Security) sichert die Kommunikation über ein Netzwerk zwischen zwei Partnern ab, z. B. bei HTTPS:\n• Verschlüsselung (Vertraulichkeit): hybrides Verfahren – Schlüsselaustausch asymmetrisch, Datenübertragung symmetrisch\n• Authentifizierung (Authentizität): digitale Zertifikate weisen die Identität des Servers (optional auch Clients) nach\n• Integrität: Prüfsummen/Message Authentication Codes erkennen Manipulationen an Nachrichten\nVorgänger: SSL (veraltet). Aktuell: TLS 1.2 und 1.3.","nr":50,"cat":2},{"id":51,"question":"Digitale Signaturen stützen sich auf Hashverfahren und basieren auf der asymmetrischen Kryptografie. Erklären Sie diesen Zusammenhang.","answer":"Bei der Signatur wird die asymmetrische Kryptografie umgekehrt angewandt:\n1. Der Sender bildet einen Hashwert der Nachricht (z. B. SHA-256).\n2. Diesen Hashwert verschlüsselt er mit seinem privaten Schlüssel → digitale Signatur.\n3. Der Empfänger entschlüsselt die Signatur mit dem öffentlichen Schlüssel des Senders und bildet selbst den Hashwert der empfangenen Nachricht.\n4. Stimmen beide Hashwerte überein, ist die Nachricht unverändert (Integrität) und stammt vom Besitzer des privaten Schlüssels (Authentizität).\nWarum der Hash? Nur den kurzen Hashwert statt der ganzen Nachricht zu signieren, macht das Verfahren effizient.","nr":51,"cat":2},{"id":52,"question":"Nennen Sie drei Eigenschaften, die ein sicheres Hash-Verfahren aufweisen sollte.","answer":"Ein sicheres Hash-Verfahren …\n• … liefert einen völlig anderen Hashwert schon bei kleinster Änderung der Eingabe (Lawineneffekt)\n• … ist nicht umkehrbar: Aus dem Hashwert kann man nicht auf den Ursprungstext schließen (Einwegfunktion)\n• … ist kollisionsresistent: Verschiedene Eingaben dürfen praktisch nie denselben Hashwert ergeben\n• … erzeugt immer eine feste Länge, unabhängig von der Länge der Eingabe\n• … ist deterministisch: gleiche Eingabe → immer gleicher Hash\nBeispiele: SHA-256, SHA-3 (unsicher: MD5, SHA-1).","nr":52,"cat":2},{"id":53,"question":"Was ist „Salting“ in der Kryptographie und wie verbessert es die Sicherheit von gespeicherten Passwörtern?","answer":"Beim Salting wird vor dem Hashen eines Passworts eine zufällige Zeichenfolge (Salt) angehängt. Der Salt wird pro Benutzer neu erzeugt und zusammen mit dem Hash in der Datenbank gespeichert.\nVorteile:\n• Gleiche Passwörter ergeben unterschiedliche Hashwerte – man erkennt nicht, wer dasselbe Passwort nutzt\n• Vorberechnete Hash-Tabellen (Rainbow Tables) werden nutzlos\n• Brute-Force-Angriffe werden deutlich aufwendiger, da jeder Hash einzeln angegriffen werden muss\nErgänzend: Pepper (geheimer, nicht in der DB gespeicherter Wert) und langsame Hashverfahren (bcrypt, Argon2).","nr":53,"cat":2},{"id":54,"question":"Was ist die Rolle einer Certificate Authority (CA) im Kontext der Netzwerksicherheit?","answer":"Eine Certificate Authority (Zertifizierungsstelle) ist eine vertrauenswürdige Organisation, die digitale Zertifikate ausstellt, verwaltet und widerruft.\n• Sie prüft die Identität von Personen, Servern oder Organisationen.\n• Sie signiert das Zertifikat mit ihrem privaten Schlüssel und bestätigt so, dass der öffentliche Schlüssel zum Inhaber gehört.\n• Wer der CA vertraut (Root-Zertifikat im Browser/OS), kann die Echtheit des Zertifikats über die Signatur prüfen.\n• Sie führt Sperrlisten (CRL) bzw. OCSP für widerrufene Zertifikate.\nDie CA ist zentraler Bestandteil einer PKI.","nr":54,"cat":2},{"id":55,"question":"Was ist eine Public Key Infrastructure (PKI)?","answer":"Eine PKI ist ein System aus Rollen, Richtlinien, Hard- und Software und Verfahren, um digitale Zertifikate sicher auszustellen, zu verteilen, zu prüfen und zu widerrufen. Sie schafft Vertrauen in öffentliche Schlüssel für die asymmetrische Kryptografie.\nBestandteile: Certificate Authority (CA), Registration Authority (RA, prüft Identität), Verzeichnisdienst, Sperrlisten (CRL/OCSP).\nFunktionen:\n• Zertifikatserstellung\n• Zertifikatsverteilung\n• Zertifikatsprüfung\n• Zertifikatswiderruf\nAnwendung: HTTPS, E-Mail-Signatur, VPN, 802.1X/EAP-TLS.","nr":55,"cat":2},{"id":56,"question":"Welche Bestandteile beinhaltet ein digitales Zertifikat nach X.509?","answer":"Typische Inhalte eines X.509-Zertifikats:\n• Version\n• Seriennummer (von der CA zur Identifizierung vergeben)\n• Signaturverfahren (Algorithmus)\n• Aussteller des Zertifikats (CA)\n• Gültigkeitsdauer (gültig von … bis …)\n• Name des Zertifikatsinhabers (Subject)\n• Öffentlicher Schlüssel des Zertifikatsinhabers\n• Erweiterungen (z. B. Verwendungszweck, Subject Alternative Names)\n• Digitale Signatur der CA","nr":56,"cat":2},{"id":57,"question":"Erklären Sie die Bedeutung der folgenden Algorithmen: DES, 3DES, AES-128, AES-256, SHA256, MD5.","answer":"• DES (Data Encryption Standard): symmetrisches Verfahren, 56-Bit-Schlüssel – gilt als unsicher.\n• 3DES (Triple DES): DES wird dreifach angewendet, um die Sicherheit zu erhöhen; veraltet und langsam.\n• AES-128 / AES-256 (Advanced Encryption Standard): aktueller symmetrischer Standard mit 128- bzw. 256-Bit-Schlüssel; sicher und schnell.\n• SHA-256 (Secure Hash Algorithm): Hashverfahren mit 256-Bit-Hashwert; sicher, z. B. für Signaturen und Zertifikate.\n• MD5 (Message-Digest Algorithm 5): Hashverfahren mit 128-Bit-Hash; gilt als unsicher (Kollisionen), nur noch für einfache Prüfsummen.","nr":57,"cat":2},{"id":58,"question":"Was sind die grundlegenden Prinzipien und Anwendungen des RSA-Verschlüsselungsverfahrens?","answer":"RSA (Rivest-Shamir-Adleman) ist ein asymmetrisches Verfahren.\nPrinzip: Es beruht darauf, dass sich das Produkt zweier sehr großer Primzahlen kaum in seine Faktoren zerlegen lässt (Faktorisierungsproblem). Daraus werden ein öffentlicher Schlüssel (verschlüsseln/Signatur prüfen) und ein privater Schlüssel (entschlüsseln/signieren) erzeugt.\nAnwendungen:\n• sicherer Schlüsselaustausch (z. B. Sitzungsschlüssel in TLS – hybride Verschlüsselung)\n• digitale Signaturen und Zertifikate\nTypische Schlüssellänge heute: mind. 2048 Bit. Nachteil: langsam, daher nicht für große Datenmengen.","nr":58,"cat":2},{"id":218,"question":"Was ist ein TPM (Trusted Platform Module)?","answer":"Ein TPM ist ein Sicherheitschip auf dem Mainboard oder eine Firmware-Funktion im Computer (fTPM), die kryptografische Schlüssel sicher erzeugt, speichert und schützt. Die Schlüssel verlassen den Chip nicht und sind so vor Auslesen durch Schadsoftware geschützt.\nEinsatz z. B. für:\n• Festplattenverschlüsselung (BitLocker): Schlüssel wird im TPM verwahrt\n• Secure/Measured Boot: prüft, ob der Startvorgang manipuliert wurde\n• Windows Hello, Smartcard-Funktionen, Gerätezertifikate (z. B. für 802.1X)\nWindows 11 setzt TPM 2.0 voraus.","nr":59,"neu":1,"cat":2},{"id":59,"question":"Beschreiben Sie Lastenheft und Pflichtenheft hinsichtlich Verfasser, Verwendung und Inhalt.","answer":"Lastenheft:\n• Verfasser: Auftraggeber\n• Verwendung: Grundlage für Ausschreibung und das Einholen von Angeboten\n• Inhalt: alle Anforderungen des Auftraggebers – WAS soll umgesetzt werden und WOFÜR (Liefer- und Leistungsumfang)\nPflichtenheft:\n• Verfasser: Auftragnehmer (auf Basis des Lastenhefts)\n• Verwendung: vertragliche Grundlage für die Umsetzung und spätere Abnahme\n• Inhalt: beschreibt WIE und WOMIT die Anforderungen umgesetzt werden (technische Lösung)","nr":60,"cat":3},{"id":60,"question":"Wer sind die Stakeholder eines Projektes?","answer":"Stakeholder sind Personen oder Gruppen, die aktiv am Projekt beteiligt sind oder von dessen Durchführung bzw. Ergebnis betroffen sind oder Einfluss darauf haben. Beispiele:\n• Auftraggeber und Geschäftsleitung\n• Kundinnen und Kunden\n• Projektleitung und Projektteam / Mitarbeitende\n• spätere Anwender und Fachabteilungen\n• Lieferanten und Dienstleister\n• Betriebsrat, Datenschutzbeauftragter, Behörden\nStakeholder werden in einer Stakeholder-Analyse nach Einfluss und Einstellung bewertet.","nr":61,"cat":3},{"id":61,"question":"Erklären Sie die vier Phasen der Teambildung Forming, Storming, Norming und Performing.","answer":"Teambildungsphasen nach Tuckman:\n• Forming (Orientierung): Kennenlern- und Findungsphase. Ein neues Team beginnt die Zusammenarbeit, Mitglieder sind höflich und vorsichtig.\n• Storming (Konflikt): Es kommt zu Konflikten über Rollen, Ziele und Vorgehen; Machtkämpfe und Störungen der Zusammenarbeit.\n• Norming (Organisation): Das Team entwickelt gemeinsame Regeln, Strategien und Taktiken zur Zusammenarbeit.\n• Performing (Leistung): Das Team arbeitet eingespielt und effizient zusammen und konzentriert sich auf die Ziele.\n(Später ergänzt: Adjourning – Auflösung.)","nr":62,"cat":3},{"id":62,"question":"Was ist der Unterschied zwischen einem Projektstrukturplan und einem Netzplan?","answer":"• Projektstrukturplan (PSP): zeigt alle Teilaufgaben und Arbeitspakete eines Projekts hierarchisch in Baumstruktur (Projekt → Teilprojekte → Arbeitspakete). Er hat keine Zeitachse und zeigt keine Abhängigkeiten. Frage: „WAS ist zu tun?“\n• Netzplan: zeigt die Abhängigkeiten und Reihenfolge der Vorgänge mit Dauer, frühesten/spätesten Zeitpunkten und Puffern. Daraus lassen sich kritischer Pfad und Projektdauer ermitteln. Frage: „WANN und in welcher Reihenfolge?“","nr":63,"cat":3},{"id":63,"question":"Was ist bei einem Netzplan der Unterschied zwischen dem Gesamtpuffer und dem freien Puffer?","answer":"• Gesamtpuffer (GP): Zeitspanne, um die ein Vorgang verschoben werden kann, ohne dass sich das Projektende verschiebt.\n  GP = SAZ − FAZ (bzw. SEZ − FEZ)\n• Freier Puffer (FP): Zeitspanne, um die ein Vorgang verschoben werden kann, ohne dass sich der früheste Anfangszeitpunkt des Nachfolgers verschiebt.\n  FP = FAZ(Nachfolger) − FEZ(Vorgang); bei mehreren Nachfolgern der kleinste FAZ\nEs gilt: FP ≤ GP. Vorgänge auf dem kritischen Pfad haben GP = FP = 0.","nr":64,"cat":3},{"id":64,"question":"Welches Merkmal charakterisiert den kritischen Pfad?","answer":"Der kritische Pfad ist die Folge von Vorgängen ohne Puffer – alle Vorgänge auf ihm haben einen Gesamtpuffer von 0.\nFolge: Jede Verzögerung eines Vorgangs auf dem kritischen Pfad verschiebt automatisch das Projektende.\nEr ist der längste Weg durch den Netzplan und bestimmt damit die minimale Projektdauer.\nProjektmanagement-Tipp: Vorgänge auf dem kritischen Pfad besonders überwachen; zur Verkürzung des Projekts müssen diese Vorgänge beschleunigt werden.","nr":65,"cat":3},{"id":65,"question":"Nennen Sie zwei Merkmale, welche ein Gantt-Diagramm von einem Netzplan unterscheiden.","answer":"• Darstellung: Das Gantt-Diagramm (Balkendiagramm) zeigt Vorgänge als Balken auf einer Zeitachse (Kalender). Der Netzplan zeigt Vorgänge als Knoten mit Pfeilen, ohne Zeitachse.\n• Termine: Im Gantt-Diagramm werden konkrete Termine/Kalenderdaten angegeben; im Netzplan nur relative Zeitdauern (FAZ, FEZ …).\n• Abhängigkeiten: im Netzplan klar ersichtlich, im Gantt-Diagramm nur optional angedeutet.\n• Puffer und kritischer Pfad: werden im Netzplan berechnet, im Gantt-Diagramm nicht direkt abgelesen.\nVorteil Gantt: sehr anschaulich für Zeitplanung und Fortschrittskontrolle.","nr":66,"cat":3},{"id":66,"question":"Erläutern Sie was unter klassischen und agilen Vorgehensmodellen zu verstehen ist.","answer":"• Klassische Vorgehensmodelle: sequenziell, planorientiert. Das Projekt wird von der Konzeption bis zur Lieferung in klar abgegrenzten, aufeinanderfolgenden Phasen durchlaufen. Basis ist eine umfassende Planung am Anfang (Lasten-/Pflichtenheft) mit viel Dokumentation. Änderungen später sind aufwendig.\n• Agile Vorgehensmodelle: iterativ und inkrementell. Kleine, funktionsfähige Teilergebnisse werden in kurzen Zyklen (Sprints) entwickelt; enge Zusammenarbeit mit dem Kunden, Flexibilität bei Änderungen, regelmäßiges Feedback und Selbstorganisation des Teams.","nr":67,"cat":3},{"id":67,"question":"Nennen Sie jeweils ein Beispiel für ein klassisches und ein agiles Vorgehensmodell.","answer":"Klassische Vorgehensmodelle:\n• Wasserfallmodell: Phasen (Analyse, Entwurf, Implementierung, Test, Betrieb) nacheinander, Rücksprünge kaum vorgesehen\n• V-Modell (V-Modell XT): jeder Entwicklungsphase steht eine Testphase gegenüber\n• Spiralmodell: iterativ, aber planorientiert mit Risikoanalyse in jeder Runde\nAgile Vorgehensmodelle:\n• Scrum: Sprints (1–4 Wochen), Rollen Product Owner, Scrum Master, Entwicklerteam; Product/Sprint Backlog, Daily Scrum\n• Kanban: Visualisierung der Aufgaben auf einem Board, Begrenzung der parallelen Arbeit (WIP-Limit)\n• Extreme Programming (XP): Pair Programming, Test-Driven Development, kurze Releases","nr":68,"cat":3},{"id":68,"question":"Beschreiben Sie den Unterschied zwischen statischen und dynamischen Testverfahren und nennen Sie jeweils zwei Beispiele.","answer":"• Statische Testverfahren: Der Programmcode wird NICHT ausgeführt. Fehler werden durch Analyse und Prüfung von Quellcode oder Dokumenten gefunden.\n  Beispiele: Schreibtischtest, Code-Review/Inspektion, Walkthrough, statische Codeanalyse (Linter), Review von Anforderungen und Design.\n• Dynamische Testverfahren: Das Programm wird in einer Testumgebung ausgeführt und das Verhalten geprüft.\n  Beispiele: Black-Box-Test, White-Box-Test, Grenzwert-/Extremwerttest, Unit-, Integrations-, Systemtest.","nr":69,"cat":3},{"id":69,"question":"Was ist unter einem Extremwerttest zu verstehen?","answer":"Ein Extremwerttest (Grenzwerttest) ist ein Black-Box-Testverfahren, bei dem gezielt mit Werten an und knapp jenseits der Grenzen gültiger Eingabebereiche getestet wird – denn dort treten Fehler besonders häufig auf (z. B. < statt ≤).\nBeispiel: Gültig sind Werte von 1 bis 100 → testen mit 0, 1, 2, 99, 100, 101 sowie Extremen wie sehr große Zahlen, negative Werte, leere Eingaben.\nZiel: Systemverhalten unter Extrembedingungen prüfen und Fehler an Bereichsgrenzen aufdecken.","nr":70,"cat":3},{"id":70,"question":"Wie können Äquivalenzklassen genutzt werden, um eine effiziente und repräsentative Auswahl von Testfällen für ein System oder eine Funktion zu definieren?","answer":"Eingabedaten werden in Gruppen (Äquivalenzklassen) eingeteilt, bei denen das System voraussichtlich gleich reagiert – gültige und ungültige Klassen.\nPro Klasse genügt ein repräsentativer Testfall: Funktioniert er, funktionieren vermutlich alle Werte der Klasse; scheitert er, scheitern wohl auch die anderen.\nBeispiel Alter 18–65 gültig: Klassen < 18 (ungültig), 18–65 (gültig), > 65 (ungültig) → Testwerte z. B. 10, 40, 70.\nVorteil: wenige Testfälle, trotzdem breite Abdeckung; oft kombiniert mit Grenzwerttests.","nr":71,"cat":3},{"id":71,"question":"Erklären Sie die Testverfahren Black-Box- und White-Box-Test.","answer":"• Black-Box-Test: Die Testperson kennt den Quellcode bzw. die interne Struktur nicht. Getestet wird nur anhand der Spezifikation: Eingaben → erwartete Ausgaben. Prüft, ob die Funktionalität aus Anwendersicht korrekt ist. Methoden: Äquivalenzklassen, Grenzwerte. Oft durch Tester, nicht durch Entwickler.\n• White-Box-Test: Die Testperson kennt den Quellcode und testet gezielt interne Abläufe, Pfade, Verzweigungen und Bedingungen (Anweisungs-/Zweigüberdeckung). Meist durch Entwickler, z. B. Unit-Tests.\n(Mischform: Grey-Box-Test.)","nr":72,"cat":3},{"id":72,"question":"Was versteht man unter einem Code Review?","answer":"Ein Code Review ist eine systematische Untersuchung von Programmcode durch andere Entwickler – ein statisches Testverfahren (Code wird nicht ausgeführt).\nGeprüft werden z. B.:\n• Funktionalität und Logikfehler\n• Lesbarkeit und Verständlichkeit\n• Wartbarkeit\n• Einhaltung von Best Practices, Coding-Standards und Sicherheitsregeln\nVorteile: frühe Fehlererkennung, Wissenstransfer im Team, bessere Codequalität.\nNachteile: kostet Zeit und Ressourcen; Bewertungen können subjektiv sein.","nr":73,"cat":3},{"id":73,"question":"Was ist der Unterschied zwischen einem Syntaxfehler und einem Semantikfehler?","answer":"• Syntaxfehler: Der Code verstößt gegen die Regeln (Grammatik) der Programmiersprache, z. B. fehlendes Semikolon oder falsch geschriebenes Schlüsselwort. Das Programm kann nicht kompiliert bzw. ausgeführt werden; Compiler/Interpreter meldet den Fehler.\n• Semantikfehler (logischer Fehler): Der Code ist formal korrekt, tut aber nicht das, was beabsichtigt war – z. B. + statt − oder falsche Bedingung. Das Programm läuft ohne Fehlermeldung, liefert aber falsche Ergebnisse. Schwerer zu finden, nur durch Tests.","nr":74,"cat":3},{"id":74,"question":"Warum ist Performance-Testing in der Softwareentwicklung wichtig?","answer":"Performance-Tests stellen sicher, dass eine Anwendung unter verschiedenen Lastbedingungen schnell, stabil und zuverlässig funktioniert – bevor echte Nutzer Probleme bemerken. Fragen:\n• Wie reagiert die Anwendung unter normaler oder erwarteter Last? (Lasttest)\n• Wie skaliert sie mit steigender Last?\n• Wie verhält sie sich unter Spitzenlast und darüber hinaus? (Stresstest)\n• Bleibt sie über längere Zeit stabil? (Dauertest)\n• Wo gibt es Engpässe oder Flaschenhälse?","nr":75,"cat":3},{"id":76,"question":"Nennen Sie Kriterien zur Bewertung der Qualität von Software.","answer":"Kriterien für Softwarequalität (angelehnt an ISO/IEC 25010):\n• Funktionalität: Erfüllt die Software die geforderten Funktionen korrekt und vollständig?\n• Zuverlässigkeit: Läuft sie stabil, fehlertolerant und wiederherstellbar?\n• Benutzbarkeit: Ist sie verständlich, erlernbar und bedienbar?\n• Effizienz: Gutes Zeitverhalten und sparsamer Ressourcenverbrauch?\n• Änderbarkeit / Wartbarkeit: Lässt sie sich leicht analysieren, ändern und testen?\n• Übertragbarkeit: Kann sie auf andere Umgebungen übertragen bzw. installiert werden?\n• Sicherheit: Schutz von Daten vor unbefugtem Zugriff\n• Kompatibilität: Zusammenspiel mit anderen Systemen","nr":76,"cat":3},{"id":75,"question":"Was ist der Unterschied zwischen funktionalen und nichtfunktionalen Anforderungen in der Systementwicklung?","answer":"• Funktionale Anforderungen: beschreiben, WAS ein System tun soll – konkrete Funktionen und Verhalten. Beispiel: „Der Benutzer kann eine Rechnung als PDF exportieren.“\n• Nichtfunktionale Anforderungen: beschreiben, WIE GUT das System seine Aufgaben erfüllt – Qualitätsmerkmale wie Leistung, Zuverlässigkeit, Sicherheit, Benutzbarkeit, Wartbarkeit, und unter welchen Bedingungen es funktionieren soll. Beispiel: „Die Suche liefert Ergebnisse in unter 2 Sekunden.“","nr":77,"cat":3},{"id":77,"question":"Was ist der Zweck eines Mock-ups und wie kann es im Designprozess eingesetzt werden?","answer":"Ein Mock-up ist ein visuelles, meist nicht funktionsfähiges Modell einer Software, Webseite oder App. Es zeigt Aussehen und Aufbau der Oberfläche (Layout, Farben, Elemente).\nEinsatz im Designprozess:\n• Ideen früh präsentieren und Funktionalität/Erscheinungsbild veranschaulichen\n• Feedback von Kunden und Nutzern einholen, bevor programmiert wird\n• Designentscheidungen treffen und Missverständnisse vermeiden\n• potenzielle Probleme frühzeitig erkennen – Änderungen sind hier noch günstig\nAbstufung: Wireframe (Skizze) → Mock-up (Gestaltung) → Prototyp (klickbar).","nr":78,"cat":3},{"id":78,"question":"Was ist das Staging-Testing in Bezug auf Softwareentwicklung und -bereitstellung?","answer":"Beim Staging-Testing wird eine Anwendung in einer Staging-Umgebung getestet, bevor sie in die Produktion geht. Die Staging-Umgebung ist eine separate, möglichst identische Kopie der Produktionsumgebung (gleiche Konfiguration, ähnliche Daten).\nZweck: sicherstellen, dass die Software unter realistischen Bedingungen ordnungsgemäß funktioniert, und Fehler, Konfigurations- oder Kompatibilitätsprobleme finden, bevor die Software für Benutzer im Live-Betrieb verfügbar ist.\nTypische Kette: Entwicklung → Test → Staging → Produktion.","nr":79,"cat":3},{"id":79,"question":"Wie unterscheiden sich Komponententests, Funktionstests und Integrationstests im Softwareentwicklungsprozess voneinander?","answer":"• Komponententests (Unit-Tests): prüfen einzelne Softwarekomponenten wie Funktionen, Klassen oder Module isoliert voneinander – funktioniert jede Einheit für sich korrekt? Meist automatisiert durch Entwickler.\n• Integrationstests: prüfen das Zusammenspiel mehrerer Komponenten und deren Schnittstellen – arbeiten sie korrekt zusammen und tauschen Daten richtig aus?\n• Funktionstests: prüfen, ob das System als Ganzes die funktionalen Anforderungen erfüllt – also das gewünschte Verhalten aus Anwendersicht (Black-Box).","nr":80,"cat":3},{"id":80,"question":"Was ist ein End-to-End-Test (E2E-Test) und welches Ziel wird mit seiner Durchführung verfolgt?","answer":"Ein E2E-Test prüft die gesamte Funktionalität einer Anwendung von Anfang bis Ende aus Sicht des Benutzers – über alle beteiligten Komponenten hinweg (Oberfläche, Backend, Datenbank, externe Dienste, Netzwerk).\nBeispiel Onlineshop: Anmelden → Artikel suchen → in den Warenkorb → bezahlen → Bestätigungs-Mail erhalten.\nZiel: sicherstellen, dass alle Systemkomponenten gemeinsam korrekt funktionieren und der gesamte Geschäftsablauf fehlerfrei ist. Oft automatisiert (z. B. Selenium, Playwright).","nr":81,"cat":3},{"id":81,"question":"Erläutern Sie die Methode des Blue-Green Deployments.","answer":"Bereitstellungsmethode mit zwei identischen Produktionsumgebungen („Blue“ und „Green“):\n• Die aktuelle Version läuft live auf Blue.\n• Die neue Version wird auf Green bereitgestellt und dort getestet.\n• Ist alles in Ordnung, wird der Datenverkehr (z. B. per Load Balancer/DNS) auf Green umgeschaltet – Green ist jetzt live.\n• Bei Problemen kann sofort auf Blue zurückgeschaltet werden (schnelles Rollback).\nVorteile: kaum Ausfallzeit, geringes Risiko. Nachteil: doppelte Infrastruktur nötig.","nr":82,"cat":3},{"id":82,"question":"Wofür steht die Abkürzung KVP im Qualitätsmanagement?","answer":"KVP = Kontinuierlicher Verbesserungsprozess.\nEin Ansatz zur permanenten, schrittweisen Verbesserung von Prozessen, Produkten und Dienstleistungen in einer Organisation – statt einmaliger großer Veränderungen viele kleine Verbesserungen.\nZiel: langfristig Effizienz und Qualität steigern, Fehler und Verschwendung reduzieren. Mitarbeitende werden aktiv eingebunden.\nDer KVP wird niemals beendet. Typisches Werkzeug: PDCA-Zyklus. Japanisches Vorbild: Kaizen.","nr":83,"cat":3},{"id":83,"question":"Erklären Sie den Unterschied zwischen den Begriffen Qualitätssicherung und Qualitätskontrolle.","answer":"• Qualitätssicherung (QS): proaktiver, vorbeugender Prozess. Sie zielt darauf ab, Fehler während der Entwicklung bzw. Produktion gar nicht erst entstehen zu lassen – durch definierte Prozesse, Standards, Richtlinien, Schulungen und Reviews. Ziel: Qualität vom Beginn an gewährleisten.\n• Qualitätskontrolle (QK): reaktiver Prozess, bei dem fertige Produkte oder Zwischenergebnisse nach der Herstellung auf Fehler geprüft werden – durch Tests und Inspektionen. Ziel: sicherstellen, dass das Endprodukt den Qualitätsstandards entspricht.","nr":84,"cat":3},{"id":84,"question":"Nennen und erklären Sie die vier Phasen des PDCA-Zyklus.","answer":"PDCA-Zyklus (Deming-Kreis) für kontinuierliche Verbesserung:\n• Plan: Ist-Zustand analysieren, Ziele festlegen und Maßnahmen zur Zielerreichung planen.\n• Do: Maßnahmen umsetzen – oft zunächst im kleinen Rahmen/Test; Daten und Informationen erfassen.\n• Check: Ergebnisse überprüfen und mit den Zielen vergleichen; Abweichungen und Ursachen analysieren.\n• Act: Bei Erfolg Maßnahmen als Standard einführen, sonst anpassen; Erkenntnisse fließen in den nächsten Zyklus ein.","nr":85,"cat":3},{"id":85,"question":"Was bedeutet es, wenn eine Software als barrierefrei bezeichnet wird?","answer":"Barrierefreie Software ist so gestaltet, dass sie von allen Menschen genutzt werden kann – einschließlich Menschen mit Behinderungen (z. B. Seh-, Hör-, motorischen oder kognitiven Einschränkungen).\nBeispiele:\n• Unterstützung von Screenreadern (Bildschirmleseprogrammen) für blinde Menschen\n• Untertitel und Transkriptionen für Gehörlose\n• vollständige Bedienung per Tastatur oder Spracherkennung statt Maus\n• ausreichende Kontraste, skalierbare Schrift, keine Information nur über Farbe\nGrundlagen: WCAG, BITV 2.0, Barrierefreiheitsstärkungsgesetz.","nr":86,"cat":3},{"id":86,"question":"Was versteht man unter Softwareergonomie und welche Prinzipien und Maßnahmen können angewendet werden, um die Benutzerfreundlichkeit von Softwareanwendungen zu verbessern?","answer":"Softwareergonomie bezieht sich auf die Gestaltung von Software, die auf die menschlichen Fähigkeiten und Bedürfnisse abgestimmt ist, um Benutzerfreundlichkeit, Effektivität und Effizienz zu maximieren.\nPrinzipien/Maßnahmen:\n• Nutzerzentrierung: mit Blick auf Bedürfnisse der Endnutzer gestalten\n• Einfachheit und Konsistenz: einheitliche, intuitive Benutzeroberflächen\n• klare und zeitnahe Rückmeldung an den Benutzer\n• Anpassbarkeit an individuelle Bedürfnisse\n• Fehlervermeidung und -behandlung: Design, das Fehler minimiert und bei der Behebung hilft\n• Lernförderlichkeit","nr":87,"cat":3},{"id":87,"question":"Nennen Sie in Bezug auf Softwareergonomie die Grundsätze der Dialoggestaltung.","answer":"Grundsätze der Dialoggestaltung nach DIN EN ISO 9241-110:\n• Aufgabenangemessenheit: unterstützt den Nutzer effizient bei seiner Aufgabe\n• Selbstbeschreibungsfähigkeit: jeder Schritt ist ohne Zusatzerklärung verständlich\n• Steuerbarkeit: Nutzer kann Ablauf, Richtung und Tempo selbst bestimmen\n• Erwartungskonformität: Software verhält sich wie erwartet, entspricht Konventionen\n• Fehlertoleranz: Fehler werden verhindert bzw. sind mit wenig Aufwand korrigierbar\n• Individualisierbarkeit: Anpassung an Bedürfnisse des Nutzers\n• Lernförderlichkeit: unterstützt beim Erlernen der Software\n(Seit 2020 zusätzlich: Benutzerbindung.)","nr":88,"cat":3},{"id":88,"question":"Was sind relationale Datenbanken? Nennen Sie zwei Beispiele für nicht-relationale Datenbanktypen.","answer":"Relationale Datenbanken basieren auf dem relationalen Datenmodell: Daten werden in Tabellen (Relationen) aus Zeilen (Datensätze) und Spalten (Attribute) gespeichert. Beziehungen zwischen Tabellen werden über Primär- und Fremdschlüssel hergestellt; Abfrage mit SQL. Beispiele: MySQL, PostgreSQL, MS SQL Server.\nNicht-relationale (NoSQL-)Datenbanktypen:\n• dokumentenorientierte DB (z. B. MongoDB)\n• Schlüssel-Wert-Datenbanken (z. B. Redis)\n• spaltenorientierte DB (z. B. Cassandra)\n• Graphdatenbanken (z. B. Neo4j)\n• Zeitreihendatenbanken, objektorientierte DB","nr":89,"cat":4},{"id":89,"question":"Welche Datentypen werden in SQL verwendet und welchen Zweck erfüllen sie?","answer":"Gängige SQL-Datentypen:\n• INTEGER (INT): Ganzzahlen, z. B. IDs, Mengen\n• FLOAT / DECIMAL: Gleitkomma- bzw. exakte Dezimalzahlen (DECIMAL für Geldbeträge)\n• VARCHAR(n) / CHAR(n): Zeichenketten variabler bzw. fester Länge\n• DATE, TIME, TIMESTAMP / DATETIME: Datum und Uhrzeit\n• BOOLEAN: Wahrheitswerte (true/false)\n• BINARY / BLOB: Binärdaten (z. B. Dateien)\nZweck: Jeder Datentyp legt Wertebereich, Speicherbedarf und erlaubte Operationen fest. Die richtige Wahl sichert die Datenintegrität (z. B. kein Text im Datumsfeld) und optimiert Speicher und Performance.","nr":90,"cat":4},{"id":90,"question":"Erklären Sie in Bezug auf Datenbanken die Begriffe Primärschlüssel und Fremdschlüssel.","answer":"• Primärschlüssel (Primary Key): Feld oder Kombination von Feldern, das jeden Datensatz einer Tabelle eindeutig identifiziert. Er darf keine Duplikate und keine Nullwerte (NULL) enthalten. Beispiel: Kundennummer.\n• Fremdschlüssel (Foreign Key): Feld in einer Tabelle, das auf den Primärschlüssel einer anderen (oder derselben) Tabelle verweist und so eine Beziehung zwischen Tabellen herstellt. Beispiel: Kundennummer in der Tabelle Bestellung.\nZweck: Beziehungen abbilden und mit referenzieller Integrität die Konsistenz der Daten sichern.","nr":91,"cat":4},{"id":91,"question":"Was ist referenzielle Integrität in Bezug auf Datenbanken?","answer":"Referenzielle Integrität sichert die Konsistenz
