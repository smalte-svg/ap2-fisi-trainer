function mPkt(type,body){const len=[];let x=body.length;do{let d=x%128;x=Math.floor(x/128);if(x>0)d|=128;len.push(d)}while(x>0);const u=new Uint8Array(1+len.length+body.length);u[0]=type;u.set(len,1);u.set(body,1+len.length);return u}
class Mqtt{
  constructor(onMsg,onLost){this.onMsg=onMsg;this.onLost=onLost;this.ws=null;this.buf=new Uint8Array(0);this.pid=1;this.closed=false;this.subs=[]}
  async connect(){let list=[];try{list=(localStorage.getItem('ap2_broker')||'').split(',').filter(Boolean)}catch(e){}const urls=list.length?list:BROKERS;
    for(const u of urls){if(this.closed)return false;try{await this._try(u);this.url=u;return true}catch(e){}}return false}
  _try(url){return new Promise((res,rej)=>{let ws;try{ws=new WebSocket(url,['mqtt'])}catch(e){return rej(e)}ws.binaryType='arraybuffer';let done=false;
    const to=setTimeout(()=>{if(!done){done=true;try{ws.close()}catch(e){}rej('timeout')}},7000);
    this._connack=rc=>{if(done)return;done=true;clearTimeout(to);if(rc!==0){try{ws.close()}catch(e){}return rej('rc'+rc)}this.ws=ws;
      this._ping=setInterval(()=>this._send(new Uint8Array([0xC0,0])),20000);ws.onclose=()=>{clearInterval(this._ping);this.ws=null;if(!this.closed&&this.onLost)this.onLost()};res()};
    ws.onopen=()=>{const cid='ap2-'+Math.random().toString(36).slice(2,12);ws.send(mPkt(0x10,[...mStr('MQTT'),4,2,0,40,...mStr(cid)]))};
    ws.onmessage=e=>this._data(new Uint8Array(e.data));
    ws.onerror=()=>{if(!done){done=true;clearTimeout(to);rej('err')}};
    ws.onclose=()=>{if(!done){done=true;clearTimeout(to);rej('closed')}}})}
  _send(u){if(this.ws&&this.ws.readyState===1)try{this.ws.send(u)}catch(e){}}
  _data(chunk){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
    while(this.buf.length>=2){let mul=1,len=0,i=1,d;do{if(i>=this.buf.length)return;d=this.buf[i++];len+=(d&127)*mul;mul*=128}while(d&128);
      if(this.buf.length<i+len)return;const h=this.buf[0],body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);const t=h>>4;
      if(t===2&&this._connack)this._connack(body[1]);
      else if(t===3){const tl=(body[0]<<8)|body[1];const topic=TD.decode(body.slice(2,2+tl));const q=(h>>1)&3;const msg=TD.decode(body.slice(2+tl+(q?2:0)));try{this.onMsg(topic,msg)}catch(e){console.error(e)}}}}
  sub(topic){this.subs.push(topic);const p=this.pid++;this._send(mPkt(0x82,[p>>8,p&255,...mStr(topic),0]))}
  pub(topic,obj){this._send(mPkt(0x30,[...mStr(topic),...TE.encode(JSON.stringify(obj))]))}
  close(){this.closed=true;clearInterval(this._ping);try{this._send(new Uint8Array([0xE0,0]));this.ws&&this.ws.close()}catch(e){}}
}

/* ---------- QUIZ-SPIEL (Kahoot-Stil) ---------- */
if(!meta.pid){meta.pid=Math.random().toString(36).slice(2,10);save()}
const KCOL=[['#e21b3c','▲'],['#1368ce','◆'],['#d89e00','●'],['#26890c','■']];
const BASE='ap2fisi/kq1/';
let H=null;   // Host-Zustand (nur beim Host)
let G=null;   // Spieler-Sicht {role,code,net,snap,deadline,answered,...}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function myName(){return (meta.name||'').trim()||'Spieler'}

// ---- Host ----
function hostSnap(){const now=Date.now();const q=H.qi>=0&&H.qi<H.qs.length?H.qs[H.qi]:null;const rev=H.phase==='reveal';
  const players=[...H.players.values()].sort((a,b)=>b.score-a.score).map(p=>({id:p.id,name:p.name,off:kOff(p),score:p.score,tot:p.tot||0,wins:p.wins||0,gain:p.gain||0,ok:!!p.ok,streak:p.streak||0,ans:H.phase==='q'?!!p.ans:undefined}));
  let dist=null;if(rev){dist=[0,0,0,0];H.players.forEach(p=>{if(p.ans)dist[p.ans.c]++})}
  const left=H.paused?H.pauseRem:Math.max(0,H.deadline-now);
  return {t:'s',code:H.code,phase:H.phase,qi:H.qi,n:H.qs.length,dur:H.dur,rem:H.phase==='q'?left:0,nx:H.phase==='reveal'?left:0,rv:H.rev,paused:!!H.paused,pv:H.pv||0,rd:H.round||0,cfg:H.cfg,
    q:q?{id:q.k.id,nr:q.k.nr,cat:q.k.cat,text:q.k.q,opts:q.opts}:null,correct:rev?q.correct:-1,dist,answered:H.phase==='q'?[...H.players.values()].filter(p=>p.ans).length:0,players,host:meta.pid}}
function kOff(p){return p.id!==meta.pid&&!!p.hi&&Date.now()-(p.seen||0)>8000}
const KHKEY='ap2_kHost';
function kSaveHost(){if(!H||H.solo||Date.now()-(H.svT||0)<3000)return;H.svT=Date.now();
  try{localStorage.setItem(KHKEY,JSON.stringify({code:H.code,cfg:H.cfg,round:H.round||0,t:Date.now(),players:[...H.players.values(),...H.gone.values()].map(p=>({id:p.id,name:p.name,tot:p.tot||0,wins:p.wins||0}))}))}catch(e){}}
function kHostSaved(){try{const r=JSON.parse(localStorage.getItem(KHKEY)||'null');return r&&Date.now()-r.t<3*3600e3?r:null}catch(e){return null}}
function hostSend(){if(!H)return;kSaveHost();const s=hostSnap();if(H.net)H.net.pub(BASE+H.code+'/h',s);applySnap(s)}
function hostMsg(topic,raw){let m;try{m=JSON.parse(raw)}catch(e){return}if(!H||!m||!m.id)return;const pp=H.players.get(m.id);if(pp)pp.seen=Date.now();
  if(m.t==='hi'){if(pp)pp.hi=true}
  else if(m.t==='join'){const name=String(m.name||'Spieler').slice(0,16);
    if(H.players.has(m.id)){const p=H.players.get(m.id);p.name=name;p.seen=Date.now()}
    else if(H.gone.has(m.id)){const p=H.gone.get(m.id);H.gone.delete(m.id);p.name=name;p.seen=Date.now();p.ans=null;H.players.set(m.id,p);toast('👋 '+name+' ist wieder da');hostSend()}
    else{H.players.set(m.id,{id:m.id,name,score:0,streak:0,seen:Date.now()});hostSend()}}
  else if(m.t==='ans'&&H.phase==='q'&&!H.paused&&m.qi===H.qi&&(m.rd==null||m.rd===H.round)){const p=H.players.get(m.id);if(!p||p.ans)return;p.ans={c:+m.c,ms:Math.max(0,Math.min(H.dur,+m.ms||H.dur))};
    if([...H.players.values()].every(x=>x.ans||kOff(x)))hostReveal();else hostSend()}
  else if(m.t==='leave'){const p=H.players.get(m.id);if(p&&m.id!==meta.pid){H.players.delete(m.id);H.gone.set(m.id,p);H.svT=0;hostSend()}}}
async function hostCreate(opts){const cfg={filter:opts.filter||'all',n:opts.n,sec:opts.sec,rev:opts.rev||8};if(!kqFor(cfg.filter).length)return toast(noq());
  H={code:genCode(),net:null,players:new Map(),qs:[],qi:-1,phase:'lobby',cfg,round:0,dur:cfg.sec*1000,deadline:0,solo:opts.solo,rev:cfg.rev*1000,paused:false,pauseRem:0,pv:0,gone:new Map()};
  H.players.set(meta.pid,{id:meta.pid,name:myName(),score:0,streak:0});
  if(opts.restore){const r=opts.restore;H.code=r.code;H.round=r.round||0;(r.players||[]).forEach(p=>{if(p.id===meta.pid)Object.assign(H.players.get(meta.pid),{tot:p.tot||0,wins:p.wins||0});else H.players.set(p.id,{id:p.id,name:p.name,score:0,streak:0,tot:p.tot||0,wins:p.wins||0,hi:true,seen:0})})}
  G={role:'host',code:H.code,snap:null,answered:-1,solo:opts.solo,lastSeen:Date.now()};
  if(!opts.solo){renderKMsg('🔌 Verbinde mit dem Spielserver …');const net=new Mqtt(hostMsg,()=>toast('⚠️ Verbindung unterbrochen – verbinde neu …')||reconnect(net));
    if(!await net.connect()){H=null;G=null;return renderKMsg('❌ Keine Verbindung zum Spielserver. Prüfe die Internetverbindung und versuche es erneut.',true)}
    H.net=net;net.sub(BASE+H.code+'/p');H.hb=setInterval(hostSend,1500)}
  hostSend();if(opts.solo)hostStart()}
async function reconnect(net){if(!net||net.busy||net.closed)return;net.busy=true;
  for(let i=0;!net.closed;i++){await new Promise(r=>setTimeout(r,Math.min(1500*(i+1),8000)));if(net.closed)break;
    if(await net.connect()){net.subs.splice(0).forEach(t=>net.sub(t));toast('✅ Wieder verbunden');if(G)G.lastSeen=Date.now();break}}
  net.busy=false}
// App kommt aus dem Hintergrund zurück (iPhone schließt dann oft die Verbindung): sofort prüfen und neu verbinden
function kWake(){if(document.hidden)return;[G&&G.net,H&&H.net].forEach(n=>{if(!n||n.closed||n.busy)return;
  const stale=G&&G.role==='player'&&Date.now()-G.lastSeen>6000;if(!n.ws||n.ws.readyState>1)reconnect(n);else if(stale){try{n.ws.close()}catch(e){}}})}
document.addEventListener('visibilitychange',kWake);window.addEventListener('online',kWake);
function hostStart(){if(!H||(H.phase!=='lobby'&&H.phase!=='end'))return;const c=H.cfg;const pool=kqFor(c.filter);if(!pool.length)return toast('Für diese Auswahl gibt es keine Quizfragen – wähle andere Kategorien');
  const k=shuffle(pool).slice(0,c.n||pool.length);H.qs=k.map(it=>{const o=kqOpts(it);return{k:it,opts:o,correct:o.indexOf(it.a)}});
  H.dur=c.sec*1000;H.rev=c.rev*1000;H.round=(H.round||0)+1;H.qi=-1;H.paused=false;H.players.forEach(p=>{p.score=0;p.streak=0;p.gain=0;p.ok=false;p.ans=null});hostNext()}
// Runde vorbei: Punkte in die Gesamtwertung der Sitzung übernehmen
function kFinish(){const ps=[...H.players.values()].sort((a,b)=>b.score-a.score);ps.forEach((p,i)=>{p.tot=(p.tot||0)+p.score;if(i===0&&p.score>0&&ps.length>1)p.wins=(p.wins||0)+1})}
// Zurück in die Sitzungs-Lobby: Gruppe bleibt verbunden, Einstellungen lassen sich ändern
function hostLobby(){if(!H)return;clearInterval(H.tick);H.phase='lobby';H.qi=-1;H.paused=false;H.players.forEach(p=>{p.ans=null;p.gain=0;p.ok=false});hostSend()}
// Zeitachse: Frage → Auflösung → nächste Frage läuft von selbst, solange der Host nicht pausiert
function hostTick(){if(!H||H.paused||Date.now()<H.deadline)return;if(H.phase==='q')hostReveal();else if(H.phase==='reveal')hostNext()}
function hostNext(){if(!H)return;clearInterval(H.tick);H.paused=false;H.qi++;H.players.forEach(p=>{p.ans=null;p.gain=0;p.ok=false});
  if(H.qi>=H.qs.length){H.phase='end';kFinish();hostSend();return}
  H.phase='q';H.deadline=Date.now()+H.dur;hostSend();H.tick=setInterval(hostTick,250)}
function hostPause(){if(!H||(H.phase!=='q'&&H.phase!=='reveal'))return;if(!H.paused){H.paused=true;H.pauseRem=Math.max(0,H.deadline-Date.now())}else{H.paused=false;H.deadline=Date.now()+H.pauseRem}H.pv++;vib(10);hostSend()}
function hostReveal(){if(!H||H.phase!=='q')return;H.paused=false;const q=H.qs[H.qi];
  H.players.forEach(p=>{const ok=!!p.ans&&p.ans.c===q.correct;p.ok=ok;p.streak=ok?(p.streak||0)+1:0;p.gain=ok?Math.round(1000*(1-(p.ans.ms/H.dur)/2))+Math.min((p.streak-1)*100,500):0;p.score+=p.gain});
  H.phase='reveal';H.deadline=Date.now()+H.rev;hostSend();clearInterval(H.tick);H.tick=setInterval(hostTick,250)}
function quitGame(){if(G&&G.role==='player'&&G.net){G.net.pub(BASE+G.code+'/p',{t:'leave',id:meta.pid})}
  if(H){clearInterval(H.hb);clearInterval(H.tick);if(!H.solo)try{localStorage.removeItem(KHKEY)}catch(e){}if(H.net){try{H.net.pub(BASE+H.code+'/h',{t:'s',code:H.code,phase:'closed'})}catch(e){}H.net.close()}H=null}if(G){clearInterval(G.hb);clearInterval(G.tm);G.net&&G.net.close();G=null}renderQuizMenu()}

// ---- Spieler ----
async function joinGame(code){code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6)return toast('Der Code hat 6 Zeichen');
  G={role:'player',code,snap:null,answered:-1,lastSeen:Date.now()};renderKMsg('🔌 Verbinde mit Spiel '+code+' …');
  const net=new Mqtt((t,raw)=>{let s;try{s=JSON.parse(raw)}catch(e){return}if(s&&s.t==='s'&&G&&s.code===G.code){G.lastSeen=Date.now();if(s.phase==='closed')return kClosed();if(!G.snap){meta.kLast={code:G.code,t:Date.now()};save()}applySnap(s)}},()=>{toast('⚠️ Verbindung unterbrochen – verbinde neu …');reconnect(net)});
  if(!await net.connect()){G=null;return renderKMsg('❌ Keine Verbindung zum Spielserver. Prüfe die Internetverbindung.',true)}
  if(!G)return net.close();G.net=net;net.sub(BASE+code+'/h');
  const hello=()=>{if(!G)return;const inList=G.snap&&G.snap.players.some(p=>p.id===meta.pid);if(G.net&&G.net.ws)net.pub(BASE+code+'/p',inList?{t:'hi',id:meta.pid}:{t:'join',id:meta.pid,name:myName()});
    if(!G.snap&&Date.now()-G.lastSeen>9000)renderKMsg('⏳ Spiel '+code+' noch nicht gefunden … Ist der Code richtig und der Host online?',true,true);
    if(G.snap&&G.snap.phase!=='end'&&Date.now()-G.lastSeen>10000)renderKMsg('📡 Verbindung zum Spiel unterbrochen – es wird automatisch neu verbunden … Deine Punkte bleiben erhalten.',true,true)};
  hello();G.hb=setInterval(hello,2000)}
function kClosed(){if(!G)return;delete meta.kLast;save();clearInterval(G.hb);clearInterval(G.tm);const n=G.net;G=null;if(n)n.close();renderKMsg('👋 Der Host hat die Sitzung beendet.',true)}
function sendAnswer(c){if(!G||!G.snap||G.snap.phase!=='q'||G.answered===G.snap.qi||G.snap.paused)return;const ms=Math.max(0,G.snap.dur-Math.max(0,G.deadline-Date.now()));G.answered=G.snap.qi;G.myChoice=c;vib(15);
  const m={t:'ans',id:meta.pid,qi:G.snap.qi,rd:G.snap.rd||0,c,ms};if(G.role==='host')hostMsg('',JSON.stringify(m));else{G.net.pub(BASE+G.code+'/p',m);renderQuiz()}}

// ---- Darstellung ----
function applySnap(s){const prev=G.snap;G.snap=s;const force=G.msg;G.msg=false;if(prev&&(prev.rd||0)!==(s.rd||0)){G.answered=-1;G.myChoice=-1}
  if(s.phase==='lobby'&&prev&&prev.phase==='lobby'&&!force&&$('#kPl')){kLobbyUpd(s);return}
  const pvChg=prev&&prev.phase===s.phase&&prev.qi===s.qi&&(prev.pv||0)!==(s.pv||0);
  if(pvChg&&s.phase==='q'){G.deadline=Date.now()+s.rem;renderQuiz();return}
  if(pvChg&&s.phase==='reveal'){G.nextAt=Date.now()+(s.nx||0);renderQuiz();return}
  if(s.phase==='q'&&(!prev||prev.qi!==s.qi||prev.phase!=='q')){G.deadline=Date.now()+s.rem;G.myChoice=-1;renderQuiz();clearInterval(G.tm);G.tm=setInterval(kTimer,200);return}
  if(s.phase==='reveal'&&(!prev||prev.phase!=='reveal'||prev.qi!==s.qi)){clearInterval(G.tm);G.nextAt=Date.now()+(s.nx||0);if(s.rv)G.tm=setInterval(kNextTimer,250);const me=s.players.find(p=>p.id===meta.pid);
    if(me&&s.q){if(me.ok){vib([10,40,10]);quizOk(s.q.id);activity(5)}else{vib(60);rate(s.q.id,'red')}}renderQuiz();return}
  if(s.phase==='end'&&(!prev||prev.phase!=='end')){clearInterval(G.tm);const r=s.players.findIndex(p=>p.id===meta.pid);if(r>=0&&r<3)confetti(180);renderQuiz();return}
  if(s.phase==='lobby'||(prev&&JSON.stringify(prev.players.map(p=>p.id+p.ans))!==JSON.stringify(s.players.map(p=>p.id+p.ans)))){if(s.phase==='q')kAnsCount();else renderQuiz()}else if(force)renderQuiz()}
function kTimer(){if(!G||!G.snap||G.snap.phase!=='q')return;const left=G.snap.paused?G.snap.rem:Math.max(0,G.deadline-Date.now());const e=$('#kSec');if(e)e.textContent=Math.ceil(left/1000);const r=$('#kRing');if(r)r.style.strokeDashoffset=(2*Math.PI*26)*(1-left/G.snap.dur)}
function kNextTimer(){if(!G||!G.snap||G.snap.phase!=='reveal')return;const e=$('#kNx');if(!e)return;const s=G.snap;if(s.paused){e.textContent='⏸ Pausiert – der Host setzt gleich fort';return}const left=Math.max(0,Math.ceil((G.nextAt-Date.now())/1000));e.textContent=(s.qi+1>=s.n?'🏁 Endergebnis in ':'▶ Nächste Frage in ')+left+' s'}
function kAnsCount(){const s=G.snap,e=$('#kAns');if(e)e.textContent=s.answered+' / '+s.players.length+' haben geantwortet'}
function renderKMsg(t,back,keep){if(G)G.msg=true;const b=$('#quizBody');b.innerHTML=`<div class="empty"><p style="font-size:17px">${esc(t)}</p>${back?`<button class="btn" id="kBack">${keep?'Abbrechen':'Zurück'}</button>`:''}</div>`;const k=$('#kBack');if(k)k.onclick=quitGame}
function exName(){const N=['Alex','Sam','Jona','Mia','Lena','Noah','Kim','Luca','Emma','Ben','Lea','Finn','Nele','Tom','Sara','Jan','Lina','Max','Ida','Paul','Mila','Elias','Zoe','Leon'];return N[Math.floor(Math.random()*N.length)]}
let qSet={n:meta.qN??10,sec:meta.qS??20,rev:meta.qR??8};
function kNum(id,v,a,b){return `<span class="knum"><input type="number" id="${id}" inputmode="numeric" min="${a}" max="${b}" step="1" value="${v}" aria-label="Sekunden"><span>s</span></span>`}
function kSetHtml(p,c){return `<div class="set"><span>Fragen</span><select id="${p}N">${[5,10,15,20,30,50,75,100,0].map(n=>`<option value="${n}" ${n===c.n?'selected':''}>${n||'Alle'}</option>`).join('')}</select></div>
   <div class="set"><span>Zeit pro Frage<br><span class="tiny muted">frei wählbar, 5–300 s</span></span>${kNum(p+'S',c.sec,5,300)}</div>
   <div class="set" style="border:0"><span>Auflösung nach jeder Frage<br><span class="tiny muted">frei wählbar, 2–60 s</span></span>${kNum(p+'R',c.rev,2,60)}</div>`}
function kClamp(v,a,b,d){v=Math.round(parseFloat(String(v).replace(',','.')));return isNaN(v)?d:Math.max(a,Math.min(b,v))}
function kSetBind(p,c,cb){const N=$('#'+p+'N');if(N)N.onchange=()=>{c.n=+N.value;cb()};
  const num=(id,key,a,b)=>{const e=$('#'+id);if(!e)return;const ap=()=>{const raw=parseFloat(String(e.value).replace(',','.'));const v=kClamp(e.value,a,b,c[key]);if(!isNaN(raw)&&(raw<a||raw>b))toast('Erlaubt sind '+a+' bis '+b+' Sekunden');e.value=v;if(c[key]!==v){c[key]=v;cb()}};
    e.onchange=ap;e.onblur=ap;e.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();e.blur()}}};
  num(p+'S','sec',5,300);num(p+'R','rev',2,60)}
function kCfgSum(c){return (c.filter?fLabel(c.filter):'Alle')+' · '+(c.n||'alle')+' Fragen · '+c.sec+' s pro Frage · '+c.rev+' s Auflösung'}
function kPlHtml(s){if(!(s.rd>0))return `<div class="badges">${s.players.map(p=>`<span class="badge ${p.off?'':'got'}">${p.id===s.host?'👑 ':''}${esc(p.name)}${p.off?' 📡':''}</span>`).join('')}</div>`;
  return [...s.players].sort((a,b)=>(b.tot||0)-(a.tot||0)).map((p,i)=>`<div class="krow ${p.id===meta.pid?'me':''}"><span class="kr">${i+1}</span><span style="flex:1">${p.id===s.host?'👑 ':''}${esc(p.name)}${p.off?' <span class="tiny muted">📡 offline</span>':''}${p.wins?` <span class="tiny" style="color:var(--yel)">🏆 ${p.wins}</span>`:''}</span><b>${p.tot||0}</b></div>`).join('')}
function kLobbyUpd(s){const pl=$('#kPl');if(pl)pl.innerHTML=kPlHtml(s);const n=$('#kPlN');if(n)n.textContent='('+s.players.length+')';const cs=$('#kCfgS');if(cs)cs.textContent=kCfgSum(s.cfg||{})}
function kCfgBind(){if(!H)return;const c=H.cfg;const cnt=()=>{const n=kqFor(c.filter).length,e=$('#kLCnt');if(e)e.textContent=n?n+' Fragen in dieser Auswahl':'⚠️ Für diese Auswahl gibt es keine Quizfragen';const st=$('#kStart');if(st)st.disabled=!n};
  chipRow($('#kLChips'),c.filter,k=>{c.filter=k;meta.filter=k;save();cnt();hostSend()});cnt();
  kSetBind('kL',c,()=>{qSet.n=meta.qN=c.n;qSet.sec=meta.qS=c.sec;qSet.rev=meta.qR=c.rev;save();hostSend()})}
function kResumeHtml(){const h=kHostSaved(),l=meta.kLast&&Date.now()-meta.kLast.t<3*3600e3?meta.kLast:null;if(!h&&!l)return '';
  const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'gerade eben':m<60?'vor '+m+' min':'vor '+Math.round(m/60)+' h'};

/* ---------- Lernstand-Code (Sicherung & Übertragung) ---------- */
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function zip(u,dir){if(!window.CompressionStream)return null;const cs=dir?new CompressionStream('deflate-raw'):new DecompressionStream('deflate-raw');const r=new Response(new Blob([u]).stream().pipeThrough(cs));return new Uint8Array(await r.arrayBuffer())}
function packState(){const t=day();const s=[];for(const id in state){const e=state[id];s.push([+id,e.rating==='green'?2:e.rating==='yellow'?1:0,e.streak||0,e.count||0,(e.due||t)-t,Math.floor((e.updated||0)/60000)])}
  const dy={};Object.keys(meta.days).sort().slice(-90).forEach(k=>dy[k]=meta.days[k]);
  return {v:3,d:t,s,m:{xp:meta.xp,bb:meta.blitzBest,g:meta.goal,mk:meta.marks,bd:meta.badges,dy,o:meta.order||'smart',n:meta.name||'',ex:meta.ex||{},wq:meta.wq||{},wm:meta.wm||[],tl:meta.tl||{}}}}
async function makeCode(){const raw=TE.encode(JSON.stringify(packState()));const z=await zip(raw,true).catch(()=>null);return z?'AP2Z-'+b64u(z):'AP2J-'+b64u(raw)}
async function readCode(code){code=code.trim().replace(/\s+/g,'');let o;
  if(code.startsWith('AP2Z-')){const u=await zip(unb64u(code.slice(5)),false);o=JSON.parse(TD.decode(u))}
  else if(code.startsWith('AP2J-'))o=JSON.parse(TD.decode(unb64u(code.slice(5))));
  else if(code.startsWith('{')){const j=JSON.parse(code);return {state:j.progress||{},meta:j.meta||{}}}
  else throw new Error('format');
  const st={};const rs=['red','yellow','green'];o.s.forEach(([id,r,sk,c,dd,u])=>{if(BYID[id])st[id]={rating:rs[r],streak:sk,count:c,due:o.d+dd,updated:u*60000}});
  const m=o.m||{};return {state:st,meta:{xp:m.xp||0,blitzBest:m.bb||0,goal:m.g,marks:m.mk||[],badges:m.bd||[],days:m.dy||{},order:m.o,name:m.n,ex:m.ex||{},wq:m.wq||{},wm:m.wm||[],tl:m.tl||{}}}}
function mergeIn(inc){let n=0;for(const id in inc.state){const a=state[id],b=inc.state[id];if(!a||(b.updated||0)>(a.updated||0)){state[id]=b;n++}}
  const im=inc.meta||{};meta.xp=Math.max(meta.xp||0,im.xp||0);meta.blitzBest=Math.max(meta.blitzBest||0,im.blitzBest||0);
  for(const k in (im.days||{}))meta.days[k]=Math.max(meta.days[k]||0,im.days[k]);
  meta.marks=[...new Set([...(meta.marks||[]),...(im.marks||[])])];meta.wm=[...new Set([...(meta.wm||[]),...(im.wm||[])])];meta.ex=meta.ex||{};for(const k in (im.ex||{})){const have=new Set((meta.ex[k]||[]).map(x=>x.d));meta.ex[k]=[...(meta.ex[k]||[]),...im.ex[k].filter(x=>!have.has(x.d))].sort((a,b)=>a.d-b.d)}meta.wq=meta.wq||{};for(const k in (im.wq||{})){if(!meta.wq[k]||(im.wq[k].d||0)>(meta.wq[k].d||0))meta.wq[k]=im.wq[k]}meta.tl=meta.tl||{};for(const k in (im.tl||{})){const a=meta.tl[k]||[0,0,0],b2=im.tl[k]||[];meta.tl[k]=[0,1,2].map(i=>Math.max(a[i]||0,b2[i]||0))}meta.badges=[...new Set([...(meta.badges||[]),...(im.badges||[])])];
  if(!meta.name&&im.name)meta.name=im.name;if(im.goal&&!Object.keys(state).length)meta.goal=im.goal;meta.lastBackup=Date.now();save();return n}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>true).catch(()=>legacyCopy(t));return Promise.resolve(legacyCopy(t))}
function legacyCopy(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}

   <div class="row" style="margin-top:10px"><button class="btn primary block" id="bkCopy">📋 Kopieren</button>${navigator.share?'<button class="btn block" id="bkShare">📤 Teilen</button>':''}</div>`);

function restoreSheet(){const s=openSheet(`<h2>📥 Lernstand-Code einfügen</h2><p class="small muted">Füge hier deinen gespeicherten Code ein. Er wird mit dem aktuellen Stand <b>zusammengeführt</b> – pro Karte gilt jeweils die neuere Bewertung, nichts geht verloren.</p>
   <textarea id="rsCode" placeholder="AP2Z-…" style="width:100%;height:120px;border-radius:12px;background:#00000040;color:var(--text);border:1px solid var(--line);padding:10px;font:12px/1.4 ui-monospace,monospace;user-select:text;-webkit-user-select:text"></textarea>
   <div class="row" style="margin-top:10px">${navigator.clipboard&&window.isSecureContext?'<button class="btn block" id="rsPaste">📋 Aus Zwischenablage</button>':''}<button class="btn primary block" id="rsGo">Übernehmen</button></div>`);

  s.querySelector('#rsGo').onclick=async()=>{try{const inc=await readCode(ta.value);const n=mergeIn(inc);closeSheet();confetti(80);toast(`✅ Lernstand übernommen (${n} Karten aktualisiert)`);if(cur==='home')renderHome();else if(cur==='more')renderSettings()}catch(e){toast('❌ Das ist kein gültiger Lernstand-Code')}}}

const MKSEG={marks:['🔖','Markiert',c=>meta.marks.includes(c.id)],red:['❌','Falsch',c=>state[c.id]?.rating==='red'],yellow:['🤔','Unsicher',c=>state[c.id]?.rating==='yellow']};
function mkList(seg){return CARDS.filter(MKSEG[seg][2])}
function updMarkBadge(){const b=document.querySelector('#tabbar [data-tab="marks"] .ic');if(!b)return;let n=meta.marks.length;b.dataset.n=n>99?'99+':n||'';b.classList.toggle('cnt',n>0)}
function renderMarks(){const b=$('#marksBody');const t=($('#mkSearch')?.value||'').toLowerCase().trim();
  const counts={};Object.keys(MKSEG).forEach(k=>counts[k]=mkList(k).length);
  const all=mkList(mkSeg);const list=all.filter(c=>!t||String(c.nr)===t||(c.question+' '+c.answer).toLowerCase().includes(t));
  const head=`<h1 style="margin-bottom:4px">Meine Fragen</h1><p class="muted small" style="margin:0 0 12px">Markierte, falsch und unsicher beantwortete Fragen – gezielt wiederholen bis alles sitzt.</p>
   <div class="seg" style="margin:0 0 12px">${Object.entries(MKSEG).map(([k,[i,n]])=>`<button data-mk="${k}" class="${k===mkSeg?'on':''}">${i} ${n} <span class="tiny">(${counts[k]})</span></button>`).join('')}</div>
   ${all.length?`<div class="row" style="margin-bottom:12px"><button class="btn primary block" id="mkLearn">▶ ${all.length} Fragen lernen</button><button class="btn block" id="mkQuiz">📝 Üben</button></div>`:''}
   <input class="search" id="mkSearch" type="search" placeholder="🔍 In diesen Fragen suchen" value="${esc($('#mkSearch')?.value||'')}">`;
  let body;
  if(!all.length)body=`<div class="empty" style="padding:30px 10px"><div class="big">${MKSEG[mkSeg][0]}</div><h2>${mkSeg==='marks'?'Noch keine markierten Fragen':mkSeg==='red'?'Keine falsch beantworteten Fragen':'Keine unsicheren Fragen'}</h2><p class="muted small">${mkSeg==='marks'?'Tippe beim Lernen auf <b>🔖</b> (Swipe-Leiste, Feed oder Karten-Ansicht), um eine Frage hier zu sammeln.':'Fragen, die du mit '+(mkSeg==='red'?'„Nochmal“':'„Unsicher“')+' bewertest, landen automatisch hier – und verschwinden, sobald du sie mit „Kann ich“ beantwortest.'}</p></div>`;
  else body=`<div class="tiny muted" style="margin:10px 2px 2px">${list.length} von ${all.length}</div><div id="mkList">${list.map(c=>{const r=state[c.id]?.rating||'';return `<div class="li" data-id="${c.id}" style="cursor:pointer"><span class="dot ${r}"></span><span class="nr">${c.nr||'–'}</span><span style="flex:1"><span class="tag" style="padding:0;background:none;font-weight:600;color:var(--muted)"><i style="background:${CCOL[c.cat]}"></i>${esc(CAT[c.cat])}</span><br>${esc(c.question)}</span>${tlHtml(c.id)}${mkSeg==='marks'?`<button class="pill" data-un="${c.id}" title="Markierung entfernen" style="padding:4px 9px">🔖✕</button>`:''}</div>`}).join('')}</div>`;
  b.innerHTML=head+body;
  b.querySelectorAll('[data-mk]').forEach(x=>x.onclick=()=>{mkSeg=x.dataset.mk;vib(6);renderMarks()});
  const s=$('#mkSearch');s.oninput=()=>{const pos=s.selectionStart;renderMarks();const n=$('#mkSearch');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  const L=$('#mkLearn');if(L)L.onclick=()=>{newSession(shuffle(all),true);go('swipe')};
  const Q=$('#mkQuiz');if(Q)Q.onclick=()=>{const ids=new Set(all.map(c=>c.id));const pool=KQ.filter(k=>ids.has(k.id));if(!pool.length){toast('Zu diesen Fragen gibt es noch keine Quizfragen');return}mcPool=pool;go('mc');startMc(pool,true)};
  b.querySelectorAll('.li[data-id]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-un]'))return;detail(BYID[+x.dataset.id])});
  b.querySelectorAll('[data-un]').forEach(x=>x.onclick=()=>{toggleMark(+x.dataset.un);updMarkBadge();renderMarks();toast('Markierung entfernt')});
  updMarkBadge()}


/* ---------- ÜBEN: Multiple Choice ohne Zeitdruck ---------- */
let mc={run:false},mcPool=null,mcBag=[],mcLastPos=-1;
// Position der richtigen Antwort gleichmäßig verteilt (A–D), nie zweimal hintereinander gleich
function mcPos(){if(!mcBag.length){mcBag=shuffle([0,1,2,3]);if(mcBag[3]===mcLastPos)[mcBag[0],mcBag[3]]=[mcBag[3],mcBag[0]]}return mcLastPos=mcBag.pop()}
function mcOpts(k){const o=shuffle(k.w);o.splice(mcPos()%(o.length+1),0,k.a);return o}
function renderMcStart(){mc.run=false;const b=$('#mcBody');const pool=mcPool||kqFor(meta.filter);const N=meta.mcN??20;
  b.innerHTML=`<div class="empty" style="padding-top:18px"><div class="big">📝</div><h1>Üben</h1><p class="muted">Multiple Choice ohne Zeitdruck – wie in der Fahrschul-App.<br>Antwort wählen, prüfen, Erklärung lesen.</p>
   ${mcPool?`<div class="pill" style="font-size:15px">🔖 ${mcPool.length} Fragen aus „Markiert“ <button id="mcClr" style="margin-left:6px;color:var(--muted)">✕</button></div>`:`<div class="chips" id="mcChips" style="max-width:100%;padding:8px 0"></div><div class="tiny muted">${pool.length?pool.length+' Fragen in dieser Auswahl':'⚠️ '+noq()}</div>`}
   <div class="seg" id="mcN" style="margin:8px 0;max-width:340px;width:100%">${[10,20,30,0].map(n=>`<button data-n="${n}" class="${N===n?'on':''}">${n?n+' Fragen':'Alle'}</button>`).join('')}</div>
   <div class="seg" id="mcLvl" style="margin:0 0 6px;max-width:340px;width:100%">${[['n','Normal'],['v','Verdeckt'],['t','Eintippen']].map(([l,t])=>`<button data-l="${l}" class="${(meta.mcLvl||'n')===l?'on':''}">${t}</button>`).join('')}</div>
   <p class="tiny muted" style="max-width:340px;margin:0 0 10px">${{n:'4 Antworten zur Auswahl.',v:'Erst im Kopf beantworten, dann die 4 Antworten aufdecken.',t:`Kurze Antworten tippst du selbst ein (bei ${pool.filter(mcTypeable).length} von ${pool.length} Fragen), die übrigen sind verdeckt.`}[meta.mcLvl||'n']}</p>
   <button class="btn primary block" style="max-width:340px;padding:16px;font-size:18px" id="mcStart">Start ▶</button>
   ${meta.mcLast?`<p class="tiny muted">Letzte Runde: ${esc(meta.mcLast)}</p>`:''}<p class="tiny muted">Falsch beantwortete Fragen landen automatisch unter „Markiert → Falsch“.</p><p class="kbd">Tastatur: 1–4 oder A–D wählen · Enter prüfen und weiter · Leertaste deckt verdeckte Antworten auf</p></div>`;
  const ch=$('#mcChips');if(ch)chipRow(ch,meta.filter,k=>{meta.filter=k;save();renderMcStart()});
  const cl=$('#mcClr');if(cl)cl.onclick=()=>{mcPool=null;renderMcStart()};
  b.querySelectorAll('#mcN button').forEach(x=>x.onclick=()=>{meta.mcN=+x.dataset.n;save();vib(6);renderMcStart()});
  b.querySelectorAll('#mcLvl button').forEach(x=>x.onclick=()=>{meta.mcLvl=x.dataset.l;save();vib(6);renderMcStart()});
  $('#mcStart').onclick=()=>startMc()}
const ART=/^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|zum|zur)\s+/i;
function mcTypeable(k){const q=k.q,a=k.a.trim().replace(ART,'');
  if(/NICHT|\bnicht\b|\bkein(e|en)?\b|Aussage|richtig|falsch|zutreffend|Beispiel|\bist (ein|eine)\b|\bsind\b|Vorteil|Nachteil|Unterschied/i.test(q))return false;
  if(/[.!?;:]$/.test(a)||/^(Ja|Nein)\b/.test(a))return false;const w=a.split(/\s+/).length;
  if(/^(Wofür steht|Was bedeutet) [A-Z0-9-]{2,8}\??$/.test(q))return w<=5&&a.length<=40;
  return /\d/.test(a)?w<=3:w<=2&&a.length<=28}
function mcMode(k){const L=meta.mcLvl||'n';return L==='t'?(mcTypeable(k)?'t':'v'):L}
const UNITS=/\b(tb|gb|mb|kb|byte|bytes|bit|bits|prozent|sekunden|sek|minuten|min|stunden|std|tage|tagen|werktage|werktagen|arbeitstage|wochen|monate|monaten|monat|jahre|jahren|jahr|euro|eur|ab|bis|zu|ca|etwa|mindestens|hoechstens|maximal|max)\b/g;
function nTyp(s){s=String(s).toLowerCase().trim().replace(/[„“"'‚‘]/g,'');for(let i=0;i<2;i++)s=s.replace(ART,'');s=s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/(\d)([a-z%€])/g,'$1 $2').replace(/[%€]/g,' ').replace(UNITS,' ');return s.replace(/^(ieee|rfc|iso)\s*/,'').replace(/[^a-z0-9+#]/g,'')}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// Groß-/Kleinschreibung, Umlaute, Artikel, Einheiten und kleine Tippfehler (nicht bei Zahlen) sind egal
function typedOk(inp,ans){const x=nTyp(inp);if(!x)return false;const alts=new Set([ans]);const sp=ans.split(/\s*\/\s*|\s+oder\s+/);if(sp.length>1&&sp.every(p=>p.length>=4))sp.forEach(p=>alts.add(p));const m=ans.match(/^(.*?)\s*\((.+)\)\s*$/);if(m){alts.add(m[1]);alts.add(m[2])}
  for(const a of alts){const y=nTyp(a);if(!y)continue;if(x===y)return true;if(/\d/.test(y)||y.length<6)continue;if(lev(x,y)<=(y.length>=12?2:1))return true;if(x.length>=5&&y.startsWith(x)&&x.length>=0.75*y.length)return true}return false}
function mcTypeHtml(s){return `<div class="card" style="margin-top:4px"><label class="small muted" for="mcIn">Deine Antwort</label><input class="search" id="mcIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Antwort eintippen …" style="margin-top:6px" value="${esc(s.typed||'')}" ${s.done?'disabled':''}><div class="tiny muted" style="margin-top:6px">Groß-/Kleinschreibung, Umlaute und kleine Tippfehler sind egal.</div></div>`}
function startMc(list,all){const pool=list||mcPool||kqFor(meta.filter);if(!pool.length){toast(noq());return renderMcStart()}const n=all?0:(meta.mcN??20);
  mc={run:true,qs:shuffle(pool).slice(0,n||pool.length).map(k=>({k,o:mcOpts(k),pick:-1,done:false,ok:false,mode:mcMode(k)})),i:0};vib(15);mcQ()}
function mcCount(){let r=0,w=0;mc.qs.forEach(s=>{if(s.done)s.ok?r++:w++});return [r,w]}
function mcQ(){const s=mc.qs[mc.i],k=s.k,c=BYID[k.id],b=$('#mcBody'),[r,w]=mcCount();
  b.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><button class="pill" id="mcEnd">✕ Ende</button><span class="pill">Frage ${mc.i+1} / ${mc.qs.length}</span><span class="pill"><span style="color:var(--grn)">✔ ${r}</span>&nbsp;<span style="color:var(--red)">✖ ${w}</span></span></div>
   <div class="timer" style="margin-top:10px"><div style="width:${100*(r+w)/mc.qs.length}%;background:var(--acc)"></div></div>
   <div style="flex:1;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px" id="mcScroll">
   <div class="row" style="margin-top:14px"><span class="tag"><i style="background:${CCOL[c.cat]}"></i>${esc(CAT[c.cat])}</span><span class="tag">${label(c)}</span></div>
   <div class="bq">${esc(k.q)}</div>
   <div id="mcOpts">${s.mode==='t'?mcTypeHtml(s):s.mode==='v'&&!s.shown&&!s.done?`<div class="card" style="text-align:center;margin-top:4px"><div class="small muted">Überleg dir die Antwort zuerst selbst.</div><button class="btn primary block" id="mcShow" style="margin-top:10px">🤔 Antworten zeigen</button></div>`:s.o.map((o,i)=>`<button class="opt mco" data-o="${i}"><b class="lt">${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
   <div id="mcFb"></div></div>
   <div class="row" style="padding-top:10px"><button class="btn" id="mcBack" style="flex:none;width:58px" ${mc.i?'':'disabled'}>←</button><button class="btn primary block" id="mcGo" disabled>Antwort prüfen</button></div>`;
  const opts=[...b.querySelectorAll('.mco')];
  const sel=()=>{opts.forEach((x,i)=>x.classList.toggle('sel',i===s.pick));$('#mcGo').disabled=(s.mode==='t'?!(s.typed||'').trim():s.pick<0)&&!s.done};
  const sh=$('#mcShow');if(sh)sh.onclick=()=>{s.shown=true;vib(6);mcQ()};
  const inp=$('#mcIn');if(inp&&!s.done){inp.oninput=()=>{s.typed=inp.value;$('#mcGo').disabled=!inp.value.trim()};inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){e.preventDefault();$('#mcGo').click()}};setTimeout(()=>inp.focus(),60)}
  opts.forEach((x,i)=>x.onclick=()=>{if(s.done)return;s.pick=i;vib(6);sel()});
  $('#mcBack').onclick=()=>{if(mc.i>0){mc.i--;mcQ()}};
  $('#mcEnd').onclick=()=>{const[r,w]=mcCount();if(r+w)mcResult();else renderMcStart()};
  $('#mcGo').onclick=()=>{if(!s.done){s.done=true;s.ok=s.mode==='t'?typedOk(s.typed||'',k.a):s.o[s.pick]===k.a;if(s.ok){vib(10);quizOk(c.id);activity(2)}else{vib([50]);s.h=rate(c.id,'red');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}mcFb(s,true)}
    else if(mc.i<mc.qs.length-1){mc.i++;mcQ()}else mcResult()};
  sel();if(s.done)mcFb(s,false)}
function mcFb(s,fresh){const k=s.k,c=BYID[k.id],b=$('#mcBody'),ri=s.o.indexOf(k.a),last=mc.i>=mc.qs.length-1;
  b.querySelectorAll('.mco').forEach((x,i)=>{x.classList.toggle('ok',i===ri);x.classList.toggle('bad',i===s.pick&&!s.ok);x.classList.add('lock')});
  $('#mcFb').innerHTML=`<div class="card" style="margin-top:4px;border-color:${s.ok?'var(--grn)':'var(--red)'};background:${s.ok?'#4ee59a14':'#ff6b7a14'}">
    <b style="font-size:17px">${s.ok?'✔ Richtig!':'✖ Leider falsch'}</b>${s.mode==='t'?`<div class="small" style="margin-top:4px">Deine Antwort: <b>${esc(s.typed||'')}</b>${s.ok?(nTyp(s.typed)!==nTyp(k.a)?'<br>Gemeint ist: '+esc(k.a):''):'<br>Richtig ist: <b>'+esc(k.a)+'</b>'}</div>${!s.ok?'<button class="btn block" id="mcOver" style="margin-top:8px">✓ Ich hatte es richtig, nur anders formuliert</button>':''}`:s.ok?'':`<div class="small" style="margin-top:4px">Richtig ist <b>${'ABCD'[ri]}</b>: ${esc(k.a)}</div>`}<div class="tiny" style="margin-top:6px">Diese Karte bisher: ${tlHtml(c.id,true)}</div>
    <details style="margin-top:10px"${s.ok?'':' open'}><summary class="small" style="cursor:pointer;font-weight:700">📖 Erklärung – ${c.nr?'Karte '+c.nr:label(c)}</summary><div class="ans small" style="margin-top:8px;line-height:1.5">${esc(c.answer)}</div></details>
    <div class="row" style="margin-top:10px"><button class="pill" id="mcMark">${meta.marks.includes(c.id)?'🔖 Markiert':'🔖 Markieren'}</button></div></div>`;
  $('#mcMark').onclick=()=>{const on=toggleMark(c.id);$('#mcMark').textContent=on?'🔖 Markiert':'🔖 Markieren';updMarkBadge();toast(on?'🔖 Markiert':'Markierung entfernt')};
  const ov=$('#mcOver');if(ov)ov.onclick=()=>{if(s.h){undoRate(s.h);s.h=null}quizOk(c.id);activity(2);s.ok=true;vib(10);toast('Als richtig gewertet');mcQ()};
  const g=$('#mcGo');g.disabled=false;g.textContent=last?'Ergebnis ansehen 🏁':'Weiter →';
  const [r,w]=mcCount();const pr=b.querySelector('.timer div');if(pr)pr.style.width=(100*(r+w)/mc.qs.length)+'%';
  if(fresh){const sc=$('#mcScroll');setTimeout(()=>sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'}),60)}}
function mcResult(){mc.run=false;const[r,w]=mcCount(),n=r+w,p=n?Math.round(100*r/n):0;const wrong=mc.qs.filter(s=>s.done&&!s.ok);
  meta.mcLast=`${r} von ${n} richtig (${p} %)`;save();checkBadges();if(p>=90&&n>=10)confetti(120);vib([30,50,30]);
  $('#mcBody').innerHTML=`<div style="flex:1;overflow-y:auto"><div class="empty" style="padding:20px 0 10px"><div class="big">${p>=90?'🏆':p>=67?'💪':p>=50?'👍':'📚'}</div><h1>${p>=90?'Hervorragend!':p>=67?'Gut gemacht!':p>=50?'Bestanden – aber da geht noch was':'Weiter üben!'}</h1>
   <div class="score" style="font-size:48px">${p} %</div><p class="muted">${r} richtig · ${w} falsch${n<mc.qs.length?` · ${mc.qs.length-n} übersprungen`:''}</p>
   ${wrong.length?`<button class="btn primary block" style="max-width:340px" id="mcRe">🔁 Die ${wrong.length} Fehler nochmal üben</button>`:''}
   <button class="btn block" style="max-width:340px" id="mcNew">Neue Runde 📝</button></div>
   ${wrong.length?`<h2 style="margin:8px 2px">Deine Fehler</h2>${wrong.map(s=>`<div class="li" data-id="${s.k.id}" style="cursor:pointer"><span class="dot red"></span><span style="flex:1"><b>${esc(s.k.q)}</b><br><span class="small" style="color:var(--red)">✖ ${esc(s.mode==='t'?(s.typed||''):s.o[s.pick])}</span><br><span class="small" style="color:var(--grn)">✔ ${esc(s.k.a)}</span></span></div>`).join('')}`:''}</div>`;
  const re=$('#mcRe');if(re)re.onclick=()=>startMc(wrong.map(s=>s.k),true);
  $('#mcNew').onclick=()=>startMc();
  $('#mcBody').querySelectorAll('.li[data-id]').forEach(x=>x.onclick=()=>detail(BYID[+x.dataset.id]))}
